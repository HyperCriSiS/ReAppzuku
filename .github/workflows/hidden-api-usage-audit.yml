name: HiddenApiBypass usage audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Find HiddenApiBypass usage
        shell: bash
        run: |
          set -euo pipefail
          echo '=== hidden API dependency references ==='
          grep -RInE 'HiddenApiBypass|hiddenapibypass|org\.lsposed' \
            app/src app/build.gradle build.gradle gradle 2>/dev/null || true
          echo '=== source-only references ==='
          hits="$(grep -RIlE 'HiddenApiBypass|hiddenapibypass|org\.lsposed' app/src 2>/dev/null || true)"
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo 'SOURCE_USAGE_PRESENT=true'
          else
            echo 'SOURCE_USAGE_PRESENT=false'
          fi
