name: Guarded cleanup of completed On-demand branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-completed-roadmap.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Verify exact branch heads and delete
        shell: bash
        run: |
          set -euo pipefail
          verify_and_delete() {
            branch="$1"
            expected="$2"
            actual="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -z "$actual" ]; then
              echo "$branch already absent"
              return 0
            fi
            if [ "$actual" != "$expected" ]; then
              echo "Refusing to delete $branch: expected $expected, got $actual" >&2
              exit 1
            fi
            git push origin --delete "$branch"
          }
          verify_and_delete roadmap/on-demand-mode 825d902c77c353a213981b6188c120c7cd3143d8
          verify_and_delete roadmap/on-demand-help af01a5f7c5f54e2ae04009744e40f60de76e86a5
