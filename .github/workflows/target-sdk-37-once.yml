name: One-time Android 17 targetSdk 37 runtime gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-37-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ondemand-shizuku

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build targetSdk 37 candidate without changing source branch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          cp app/build.gradle /tmp/build.gradle.target36
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle')
          text = path.read_text()
          old = 'targetSdk = 36'
          assert text.count(old) == 1
          path.write_text(text.replace(old, 'targetSdk = 37'))
          PY
          grep -F 'compileSdk = 37' app/build.gradle
          grep -F 'targetSdk = 37' app/build.gradle
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          git diff -- app/build.gradle

      - name: Boot current API 37 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-37" "system-images;android-37;google_apis;x86_64"
          echo no | avdmanager create avd -n reappzuku-target37 -k "system-images;android-37;google_apis;x86_64" --force
          nohup emulator -avd reappzuku-target37 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -memory 3072 >/tmp/emulator-target37.log 2>&1 &
          adb wait-for-device
          booted=false
          for i in $(seq 1 210); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=true
              break
            fi
            sleep 1
          done
          test "$booted" = true
          api="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          test "$api" = 37
          adb shell input keyevent 82 || true
          adb shell wm dismiss-keyguard || true
          unlocked=false
          for i in $(seq 1 80); do
            state="$(adb shell cmd user get-user-state 0 2>/dev/null | tr -d '\r' || true)"
            grep -Fq 'RUNNING_UNLOCKED' <<<"$state" && { unlocked=true; break; }
            sleep 0.5
          done
          test "$unlocked" = true
          package_ready=false
          for i in $(seq 1 80); do
            adb shell cmd package list packages android >/tmp/pkg-ready.txt 2>/tmp/pkg-ready.err && { package_ready=true; break; }
            sleep 0.5
          done
          test "$package_ready" = true
          echo "API 37 booted and PackageManager responded"

      - name: Install targetSdk 37 app and instrumentation
        shell: bash
        run: |
          set -euo pipefail
          install_with_retry() {
            local apk="$1"
            local extra="$2"
            for attempt in 1 2 3; do
              if adb install --no-streaming -r -t $extra "$apk"; then
                return 0
              fi
              echo "install attempt $attempt failed" >&2
              adb shell cmd package list packages android >/dev/null 2>&1 || true
              sleep 2
            done
            return 1
          }
          install_with_retry app/build/outputs/apk/debug/app-debug.apk ""
          install_with_retry app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ""
          dump="$(adb shell dumpsys package com.gree1d.reappzuku | tr -d '\r')"
          grep -Fq 'targetSdk=37' <<<"$dump"
          grep -Fq 'versionName=1.8.7' <<<"$dump"
          echo "targetSdk 37 package installed successfully"

      - name: Execute Android instrumentation on targetSdk 37
        shell: bash
        run: |
          set -euo pipefail
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          output="$(adb shell am instrument -w com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          clean="$(printf '%s\n' "$output" | tr -d '\r')"
          printf '%s\n' "$clean"
          grep -Eq 'OK \([0-9]+ tests?\)' <<<"$clean"
          ! grep -Fq 'FAILURES!!!' <<<"$clean"
          echo "targetSdk 37 instrumentation passed"

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK_ROOT/platform-tools:$PATH"
          adb devices -l || true
          adb shell getprop ro.build.version.release || true
          adb shell getprop ro.build.version.sdk || true
          adb shell cmd user get-user-state 0 || true
          adb shell cmd package list packages android || true
          adb shell dumpsys package com.gree1d.reappzuku | head -260 || true
          adb logcat -d | grep -E 'AndroidRuntime|FATAL EXCEPTION|PackageManager|ReAppzuku' | tail -800 || true
          tail -300 /tmp/emulator-target37.log || true
