name: Refresh CHECK_MATRIX status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-check-matrix.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out matrix branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: roadmap/check-matrix-refresh
          fetch-depth: 0

      - name: Refresh audit status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path = Path('docs/CHECK_MATRIX.md')
          text = path.read_text()
          text = text.replace('> Audit baseline: `main`, consolidated 2026-09-11 from the fully validated product line.', '> Audit baseline: `main`, refreshed 2026-09-12 against the current validated product line.')
          old_a16 = '| A16 | Exported surfaces: shortcuts / tiles / receivers / widget | DECIDED | Shortcut confused-deputy routing has an explicit principal policy (`f3145bb0`, `34154664082`), the explicit-intent abuse step passed in `33986395874`, and manifest/documentation parity plus platform permissions are regression-tested (`34138775145`). External API-37 run `34308440409` additionally used a separate unprivileged attacker APK/UID (`10232` vs ReAppzuku `10231`) and proved denial of direct access to the Accessibility service, both Quick Tile services, the Shizuku provider and protected `BOOT_COMPLETED`, with no `ShappkyService` bootstrap. OEM/launcher/widget-host diversity remains release evidence. |'
          new_a16 = '| A16 | Exported surfaces: shortcuts / tiles / receivers / widget | DECIDED | Shortcut confused-deputy routing has an explicit principal policy (`f3145bb0`, `34154664082`) and manifest/documentation parity plus platform permissions are regression-tested (`34138775145`). The former one-shot external attacker check is now a permanent API-37 regression: `securityProbe` is a no-permission APK under a UID distinct from ReAppzuku; branch run `34668594681` and final branch run `34670073539` proved no Binder exposure from Accessibility/Quick Tiles and denial of explicit foreign `BOOT_COMPLETED`. The same lane is integrated into `main`; OEM/launcher/widget-host diversity remains release evidence. |'
          if text.count(old_a16) != 1:
              raise SystemExit(f'expected one A16 row, found {text.count(old_a16)}')
          text = text.replace(old_a16, new_a16, 1)
          old_a18 = '| A18 | Build / CI / dependencies / supply chain | DECIDED | Source-authoritative least-privilege CI, immutable Action pins, zero-error lint, dependency locking/SHA-256 verification and stable tag/source/APK version binding are enforced. Platform API lint debt was reduced while correcting the API-34 `SPECIAL_USE` FGS boundary (`34168563677`). Target-37 source validation `34274940182` and branch-exact Android 17/API 37 runtime + launcher smoke `34276106536` now close the former preview-runtime blocker. |'
          new_a18 = '| A18 | Build / CI / dependencies / supply chain | DECIDED | Source-authoritative least-privilege CI, immutable Action SHA pins, zero-error lint, dependency locking/verification and stable tag/source/APK version binding are enforced. Gradle is now 9.7.1 with the binary distribution SHA-256 pinned; branch normal/API-37 validation passed in `34668406587` / `34667821759`, and main normal revalidation passed in `34668611855`. The signed-release task graph is explicitly scoped to `:app:` so the permanent `securityProbe` test module cannot enter release builds. Physical release signing/rollback evidence remains open. |'
          if text.count(old_a18) != 1:
              raise SystemExit(f'expected one A18 row, found {text.count(old_a18)}')
          text = text.replace(old_a18, new_a18, 1)
          start = text.index('# High-priority findings')
          end = text.index('# P2 / maintainability findings')
          section = base64.b64decode('').decode()
          text = text[:start] + section + text[end:]
          path.write_text(text)
          PY
          grep -Fq 'Closure status — 2026-09-12' docs/CHECK_MATRIX.md
          grep -Fq 'CM-P0-01 | **RESOLVED**' docs/CHECK_MATRIX.md
          grep -Fq 'Remaining release-evidence gaps' docs/CHECK_MATRIX.md
          ! grep -Fq 'Intentional stop can be undone by service self-restart' docs/CHECK_MATRIX.md
          ! grep -Fq 'Gradle 9.6.0' docs/CHECK_MATRIX.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CHECK_MATRIX.md
          git diff --cached --quiet && { echo 'No matrix changes produced'; exit 1; }
          git commit -m 'Refresh CHECK_MATRIX closure status'
          git push origin HEAD:roadmap/check-matrix-refresh
