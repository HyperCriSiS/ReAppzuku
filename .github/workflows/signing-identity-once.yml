name: One-time APK signing identity check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build current debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Compare published and current signing certificates
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/HyperCriSiS/ReAppzuku/releases/latest' \
            >/tmp/latest.json
          python3 - <<'PY' >/tmp/published-apk-url
          import json
          data = json.load(open('/tmp/latest.json', encoding='utf-8'))
          assets = [a for a in data.get('assets', []) if a.get('name', '').lower().endswith('.apk')]
          if not assets:
              raise SystemExit('latest fork release has no APK asset')
          print(assets[0]['browser_download_url'])
          PY
          PUBLISHED_URL="$(cat /tmp/published-apk-url)"
          curl --fail --silent --show-error --location "$PUBLISHED_URL" -o /tmp/published.apk

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          CURRENT_APK='app/build/outputs/apk/debug/app-debug.apk'
          "$APKSIGNER" verify --print-certs "$CURRENT_APK" >/tmp/current-certs.txt
          "$APKSIGNER" verify --print-certs /tmp/published.apk >/tmp/published-certs.txt
          cat /tmp/current-certs.txt
          cat /tmp/published-certs.txt
          current_sha="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/current-certs.txt | head -1 | tr -d '\r')"
          published_sha="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/published-certs.txt | head -1 | tr -d '\r')"
          test -n "$current_sha"
          test -n "$published_sha"
          echo "current-signer-sha256=$current_sha"
          echo "published-signer-sha256=$published_sha"
          if [ "$current_sha" != "$published_sha" ]; then
            echo 'SIGNING_IDENTITY_MISMATCH: current CI debug APK cannot update the published APK in place.' >&2
            exit 2
          fi
          echo 'SIGNING_IDENTITY_MATCH: Android in-place update signature requirement is satisfied.'
