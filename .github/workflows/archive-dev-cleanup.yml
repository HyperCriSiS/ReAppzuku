name: Guarded dev branch archival

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with full refs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify archive is byte-identical and remove ambiguous dev ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/dev:refs/remotes/origin/dev' \
                           '+refs/heads/archive/dev-legacy-20260911:refs/remotes/origin/archive/dev-legacy-20260911'
          expected='8dfeae011a92c4fcde63ec091c6328d1e8e2dbd4'
          dev_sha="$(git rev-parse origin/dev)"
          archive_sha="$(git rev-parse origin/archive/dev-legacy-20260911)"
          test "$dev_sha" = "$expected"
          test "$archive_sha" = "$expected"
          test "$(git rev-parse origin/dev^{tree})" = "$(git rev-parse origin/archive/dev-legacy-20260911^{tree})"
          git push origin --delete dev
