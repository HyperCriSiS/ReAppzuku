name: One-time BackupManager bounds repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          fetch-depth: 0

      - name: Restore green BackupManager and apply only collection bounds
        shell: bash
        run: |
          set -euo pipefail
          path='app/src/main/java/com/gree1d/reappzuku/core/BackupManager.java'
          git show 34eee326b306a62492acadf1d94cff3855ad482c:"$path" > "$path"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/gree1d/reappzuku/core/BackupManager.java')
          s = p.read_text()
          replacements = [
              (
                  '            JSONArray array = root.getJSONArray(key);\n            Set<String> set = new HashSet<>();',
                  '            JSONArray array = root.getJSONArray(key);\n            BackupCollectionPolicy.requirePackageEntryCount(key, array.length());\n            Set<String> set = new HashSet<>();'
              ),
              (
                  '        Set<String> set = stored == null ? new HashSet<>() : new HashSet<>(stored);\n        root.put(key, new JSONArray(set));',
                  '        Set<String> set = stored == null ? new HashSet<>() : new HashSet<>(stored);\n        BackupCollectionPolicy.requirePackageEntryCount(key, set.size());\n        root.put(key, new JSONArray(set));'
              ),
              (
                  '        if (manualPackages == null) manualPackages = new java.util.HashSet<>();\n        JSONObject masks = new JSONObject();',
                  '        if (manualPackages == null) manualPackages = new java.util.HashSet<>();\n        BackupCollectionPolicy.requirePackageEntryCount(KEY_MANUAL_OPS_MASKS, manualPackages.size());\n        JSONObject masks = new JSONObject();'
              ),
              (
                  '        JSONObject masks = root.getJSONObject(KEY_MANUAL_OPS_MASKS);\n        java.util.Iterator<String> keys = masks.keys();',
                  '        JSONObject masks = root.getJSONObject(KEY_MANUAL_OPS_MASKS);\n        BackupCollectionPolicy.requirePackageEntryCount(KEY_MANUAL_OPS_MASKS, masks.length());\n        java.util.Iterator<String> keys = masks.keys();'
              ),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected repair anchor exactly once: {old!r}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          test "$(grep -c 'BackupCollectionPolicy.requirePackageEntryCount' "$path")" -eq 4
          grep -F 'private static final String KEY_PRESETS = "presets";' "$path"
          grep -F 'manager.savePresetBlocking(model)' "$path"
          grep -F 'getSafeBool' "$path"
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add "$path"
          git commit -m 'Preserve transactional restore while bounding collections'
          git push origin HEAD:ondemand-shizuku
