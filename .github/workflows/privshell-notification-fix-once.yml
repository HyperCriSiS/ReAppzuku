name: One-time PrivilegedShell notification patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Patch notification permission setup
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/workflows/privileged-shell-api37-once.yml
          test "$(grep -Fc 'adb shell pm grant com.gree1d.reappzuku android.permission.POST_NOTIFICATIONS' "$FILE")" -eq 0
          sed -i '/adb shell pm revoke com.gree1d.reappzuku moe.shizuku.manager.permission.API_V23/a\          adb shell pm grant com.gree1d.reappzuku android.permission.POST_NOTIFICATIONS 2>/dev/null || true' "$FILE"
          test "$(grep -Fc 'adb shell pm grant com.gree1d.reappzuku android.permission.POST_NOTIFICATIONS' "$FILE")" -eq 1
          git diff --check
          git diff -- "$FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'Bypass unrelated notification dialog in API 37 shell probe'
          git push origin HEAD:main
