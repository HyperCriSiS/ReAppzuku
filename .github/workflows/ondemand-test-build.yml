name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  remove-debug-dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Remove no-op AppDebugManager call sites and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('app/src/main/java')
          manager = root / 'com/gree1d/reappzuku/core/AppDebugManager.java'
          if not manager.exists():
              raise SystemExit('AppDebugManager.java missing before cleanup')

          def find_call_end(text, start):
              open_paren = text.find('(', start)
              if open_paren < 0:
                  raise ValueError('missing opening parenthesis')
              depth = 0
              i = open_paren
              state = 'code'
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
                  if state == 'code':
                      if c == '"': state = 'string'
                      elif c == "'": state = 'char'
                      elif c == '/' and n == '/': state = 'line_comment'; i += 1
                      elif c == '/' and n == '*': state = 'block_comment'; i += 1
                      elif c == '(':
                          depth += 1
                      elif c == ')':
                          depth -= 1
                          if depth == 0:
                              j = i + 1
                              while j < len(text) and text[j] in ' \t\r\n':
                                  j += 1
                              if j >= len(text) or text[j] != ';':
                                  raise ValueError(f'call at {start} not terminated by semicolon')
                              return j + 1
                  elif state == 'string':
                      if c == '\\': i += 1
                      elif c == '"': state = 'code'
                  elif state == 'char':
                      if c == '\\': i += 1
                      elif c == "'": state = 'code'
                  elif state == 'line_comment':
                      if c == '\n': state = 'code'
                  elif state == 'block_comment':
                      if c == '*' and n == '/': state = 'code'; i += 1
                  i += 1
              raise ValueError(f'unterminated call at {start}')

          touched = 0
          removed_calls = 0
          for path in sorted(root.rglob('*.java')):
              if path == manager:
                  continue
              raw = path.read_bytes()
              text = raw.decode('utf-8')
              original = text
              text = text.replace('import com.gree1d.reappzuku.core.AppDebugManager;\r\n', '')
              text = text.replace('import com.gree1d.reappzuku.core.AppDebugManager;\n', '')
              text = text.replace('import com.gree1d.reappzuku.core.AppDebugManager.Category;\r\n', '')
              text = text.replace('import com.gree1d.reappzuku.core.AppDebugManager.Category;\n', '')

              while True:
                  start = text.find('AppDebugManager.')
                  if start < 0:
                      break
                  line_start = text.rfind('\n', 0, start) + 1
                  prefix = text[line_start:start]
                  nonspace = prefix.rstrip()
                  if nonspace and not nonspace.endswith(('{', '}', ';')):
                      raise SystemExit(f'{path}: unsafe prefix before AppDebugManager call: {prefix!r}')
                  try:
                      end = find_call_end(text, start)
                  except Exception as exc:
                      lo = max(0, start - 180)
                      hi = min(len(text), start + 500)
                      context = text[lo:hi].replace('\n', '\\n')
                      raise SystemExit(f'{path}: {exc}; context={context!r}')
                  text = text[:start] + text[end:]
                  removed_calls += 1

              lines = text.splitlines(keepends=True)
              text = ''.join(('' if line.strip(' \t\r\n') == '' and line not in ('\n', '\r\n') else line) for line in lines)
              if text != original:
                  path.write_bytes(text.encode('utf-8'))
                  touched += 1

          manager.unlink()

          leftovers = []
          for path in sorted(root.rglob('*.java')):
              data = path.read_text(errors='replace')
              if 'AppDebugManager' in data:
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Residual AppDebugManager references: ' + ', '.join(leftovers))
          if removed_calls < 800:
              raise SystemExit(f'Unexpectedly low removal count: {removed_calls}')
          print(f'Removed {removed_calls} AppDebugManager calls across {touched} Java files; facade deleted.')
          PY

          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug
          git diff --check
          test -z "$(grep -RIl 'AppDebugManager' app/src/main/java || true)"

          git show origin/main:.github/workflows/ondemand-test-build.yml > .github/workflows/ondemand-test-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove obsolete AppDebugManager dead code"
          git push origin HEAD:${GITHUB_REF_NAME}
