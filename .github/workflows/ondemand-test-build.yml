name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ondemand-shizuku-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest
      - name: Verify current Room schema export
        run: test -f app/schemas/com.gree1d.reappzuku.db.AppDatabase/11.json
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ReAppzuku-1.8.7-ondemand-debug.apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum ReAppzuku-1.8.7-ondemand-debug.apk | tee ReAppzuku-1.8.7-ondemand-debug.apk.sha256
          gh release delete ondemand-test --cleanup-tag -y || true
          gh release create ondemand-test \
            ReAppzuku-1.8.7-ondemand-debug.apk \
            ReAppzuku-1.8.7-ondemand-debug.apk.sha256 \
            --target "${GITHUB_SHA}" \
            --title "ReAppzuku 1.8.7 Assurance Phase 5 test" \
            --notes "Live-test build with Phases 1-5: explicit Shizuku readiness state machine, desired background-state enforcement, preset reboot recovery, transactional versioned backup restore, non-destructive Room policy with v2→v11 migration test compilation, explicit platform-backup exclusion, and exported-shortcut privilege hardening. Dynamic RAM shortcuts use an install-specific token; legacy/static entry points require explicit user confirmation."