name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-agp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Upgrade both Android Gradle plugins and regenerate trust metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("build.gradle")
          s = p.read_text()
          old_app = "id 'com.android.application' version '9.4.0' apply false"
          old_lib = "id 'com.android.library' version '9.4.0' apply false"
          if s.count(old_app) != 1 or s.count(old_lib) != 1:
              raise SystemExit("Expected AGP 9.4.0 application/library declarations exactly once")
          s = s.replace(old_app, "id 'com.android.application' version '9.4.1' apply false", 1)
          s = s.replace(old_lib, "id 'com.android.library' version '9.4.1' apply false", 1)
          p.write_text(s)
          PY

          chmod +x gradlew
          ./gradlew --write-verification-metadata sha256 --write-locks             testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug

          grep -Fq "id 'com.android.application' version '9.4.1' apply false" build.gradle
          grep -Fq "id 'com.android.library' version '9.4.1' apply false" build.gradle
          git diff --check

          git fetch origin main
          git checkout origin/main -- .github/workflows/ondemand-test-build.yml

          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git","diff","--name-only"], text=True).splitlines())
          required = {"build.gradle", "gradle/verification-metadata.xml"}
          allowed = required | {"app/gradle.lockfile"}
          if not required.issubset(changed):
              raise SystemExit(f"Missing required AGP diffs: {required - changed}")
          if not changed.issubset(allowed):
              raise SystemExit(f"Unexpected AGP diff files: {changed - allowed}")
          print("Final AGP diff:", sorted(changed))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle gradle/verification-metadata.xml app/gradle.lockfile
          git diff --cached --check
          git commit -m "Upgrade Android Gradle Plugin to 9.4.1"
          git push origin HEAD:maintenance/agp-9.4.1-current
