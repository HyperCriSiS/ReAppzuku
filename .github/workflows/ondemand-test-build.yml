name: On-demand Shizuku test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory-debug-scaffolding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Inventory residual debug-only scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('app/src/main/java')]
          files = []
          for root in roots:
              files.extend(root.rglob('*.java'))
              files.extend(root.rglob('*.kt'))

          print('=== SINGLE-USE TAG/FILE_NAME CONSTANTS ===')
          for path in sorted(files):
              text = path.read_text(errors='replace')
              for name in ('TAG', 'FILE_NAME'):
                  if len(re.findall(r'\b' + name + r'\b', text)) == 1 and re.search(r'\b' + name + r'\s*=', text):
                      line = text[:text.find(name)].count('\n') + 1
                      print(f'{path}:{line}: {name}')

          print('=== EMPTY SIMPLE BLOCKS ===')
          block_re = re.compile(r'(?ms)^([ \t]*)(if\s*\([^\n{}]*\)|else|catch\s*\([^\n{}]*\)|for\s*\([^\n{}]*\)|while\s*\([^\n{}]*\))\s*\{[ \t\r\n]*\}')
          for path in sorted(files):
              text = path.read_text(errors='replace')
              for m in block_re.finditer(text):
                  line = text.count('\n', 0, m.start()) + 1
                  snippet = ' '.join(m.group(2).split())
                  print(f'{path}:{line}: {snippet} {{}}')

          print('=== EMPTY VOID METHODS (simple) ===')
          meth_re = re.compile(r'(?ms)^\s*(?:public|private|protected)\s+(?:static\s+)?void\s+([A-Za-z_$][\w$]*)\s*\([^{};]*\)\s*\{[ \t\r\n]*\}')
          for path in sorted(files):
              text = path.read_text(errors='replace')
              for m in meth_re.finditer(text):
                  line = text.count('\n', 0, m.start()) + 1
                  print(f'{path}:{line}: {m.group(1)}')

          print('=== TIMING LOCALS WITH <=2 REFERENCES ===')
          decl_re = re.compile(r'\b(?:long|int)\s+([A-Za-z_$][\w$]*(?:Start|Elapsed|Duration|Ms|Millis|Count|Now))\b')
          for path in sorted(files):
              text = path.read_text(errors='replace')
              seen = set()
              for m in decl_re.finditer(text):
                  name = m.group(1)
                  if name in seen:
                      continue
                  seen.add(name)
                  count = len(re.findall(r'\b' + re.escape(name) + r'\b', text))
                  if count <= 2:
                      line = text.count('\n', 0, m.start()) + 1
                      print(f'{path}:{line}: {name} refs={count}')
          PY
