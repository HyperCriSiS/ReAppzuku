name: One-time Room 13 schema export

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
      - name: Generate schema 13 from source
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --rerun-tasks --no-build-cache
          test -f app/schemas/com.gree1d.reappzuku.db.AppDatabase/13.json
      - name: Commit compiler-generated schema only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas/com.gree1d.reappzuku.db.AppDatabase/13.json
          git diff --cached --exit-code && exit 0
          git commit -m "Add compiler-generated Room schema 13"
          git push origin HEAD:feature/legacy-policy-activation
