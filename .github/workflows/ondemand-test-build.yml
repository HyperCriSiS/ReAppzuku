name: Refresh dependency verification evidence

on:
  workflow_dispatch:

concurrency:
  group: dependency-verification-refresh-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Refresh complete SHA-256 verification metadata
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --refresh-dependencies --write-verification-metadata sha256 \
            testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug
          git diff --exit-code -- app/gradle.lockfile
          test -s gradle/verification-metadata.xml
      - name: Re-prove from an empty dependency cache
        run: |
          set -euo pipefail
          ./gradlew --stop || true
          rm -rf ~/.gradle/caches/modules-2 ~/.gradle/caches/transforms-*
          ./gradlew --no-daemon --refresh-dependencies \
            testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug
      - name: Commit only refreshed verification metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "Verification metadata already complete."
            exit 0
          fi
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "gradle/verification-metadata.xml"
          git diff --cached --check
          git commit -m "Complete dependency verification metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
