name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cleanup-debug-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
      - name: Remove production debug controls and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings_path = Path('app/src/main/java/com/gree1d/reappzuku/ui/SettingsActivity.java')
          settings = settings_path.read_text()
          block = '''        binding.switchDebugEnabled.setChecked(AppDebugManager.isEnabled());
                  binding.switchDebugEnabled.setOnCheckedChangeListener((buttonView, isChecked) -> {
                      AppDebugManager.setEnabled(isChecked);
                      binding.layoutDebugMenu.setVisibility(isChecked ? View.VISIBLE : View.GONE);
                  });
                  binding.layoutDebugMenu.setVisibility(AppDebugManager.isEnabled() ? View.VISIBLE : View.GONE);
                  binding.layoutDebugMenu.setOnClickListener(v -> showDebugMenuDialog());
          '''
          if settings.count(block) != 1:
              raise SystemExit(f'Expected one Settings debug binding block, found {settings.count(block)}')
          settings_path.write_text(settings.replace(block, '', 1))

          dialogs_path = Path('app/src/main/java/com/gree1d/reappzuku/ui/SettingsActivityDialogs.java')
          dialogs = dialogs_path.read_text()
          start = dialogs.find('    protected void showDebugMenuDialog() {')
          end = dialogs.find('    protected void showSingleChoiceDialog(', start)
          if start < 0 or end < 0:
              raise SystemExit('Debug dialog boundaries not found')
          dialogs = dialogs[:start] + dialogs[end:]
          dialogs = dialogs.replace('import com.google.android.material.materialswitch.MaterialSwitch;\n', '')
          dialogs_path.write_text(dialogs)

          layout_path = Path('app/src/main/res/layout/activity_settings.xml')
          layout = layout_path.read_text()
          pattern = re.compile(r'''\n\s*<LinearLayout\n\s*android:layout_width="match_parent"\n\s*android:layout_height="wrap_content"\n\s*android:orientation="horizontal"\n\s*android:gravity="center_vertical"\n\s*android:paddingHorizontal="8dp"\n\s*android:paddingVertical="12dp">\n.*?android:text="@string/settings_debug_title".*?</LinearLayout>\n\s*<LinearLayout\n\s*android:id="@\+id/layout_debug_menu"\n.*?android:text="@string/settings_debug_menu_title".*?</LinearLayout>\n''', re.S)
          layout, count = pattern.subn('\n', layout, count=1)
          if count != 1:
              raise SystemExit(f'Expected one debug layout block, removed {count}')
          layout_path.write_text(layout)

          changed_string_files = 0
          for strings_path in Path('app/src/main/res').glob('values*/strings.xml'):
              text = strings_path.read_text()
              original = text
              kept = []
              for line in text.splitlines(keepends=True):
                  if '<!-- AppDebugManager category names -->' in line:
                      continue
                  if 'name="appdebug_' in line:
                      continue
                  if 'name="settings_debug_title"' in line or 'name="settings_debug_menu_title"' in line:
                      continue
                  kept.append(line)
              text = ''.join(kept)
              if text != original:
                  strings_path.write_text(text)
                  changed_string_files += 1
          if changed_string_files < 1:
              raise SystemExit('No debug string resources were removed')
          PY

          ! grep -RIn -E 'switch_debug_enabled|layout_debug_menu|settings_debug_title|settings_debug_menu_title|appdebug_' app/src/main || exit 1
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug

          git fetch origin main
          git checkout origin/main -- .github/workflows/ondemand-test-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/gree1d/reappzuku/ui/SettingsActivity.java app/src/main/java/com/gree1d/reappzuku/ui/SettingsActivityDialogs.java app/src/main/res/layout/activity_settings.xml app/src/main/res/values*/strings.xml .github/workflows/ondemand-test-build.yml
          git diff --cached --check
          git commit -m "Remove production debug settings UI"
          git push origin HEAD:${GITHUB_REF_NAME}
