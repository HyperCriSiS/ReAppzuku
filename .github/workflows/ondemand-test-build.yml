name: On-demand Shizuku test APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Ignored during one-time Room schema commit
        required: false
        type: boolean
        default: false

concurrency:
  group: ondemand-shizuku-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  commit-room-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Generate Room schema from source
        run: ./gradlew clean compileDebugJavaWithJavac --no-build-cache --rerun-tasks --warning-mode all
      - name: Commit only authoritative Room schema 11
        run: |
          set -euo pipefail
          schema='app/schemas/com.gree1d.reappzuku.db.AppDatabase/11.json'
          test -f "$schema"
          git add -- "$schema"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "$schema"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Schema 11 is already committed.'
            exit 0
          fi
          git commit -m 'Commit authoritative Room schema 11 [skip ci]'
          git push origin HEAD:ondemand-shizuku
