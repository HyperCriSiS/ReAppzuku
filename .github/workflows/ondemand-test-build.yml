name: Materialize dependency assurance evidence

on:
  workflow_dispatch:

concurrency:
  group: dependency-assurance-materialize-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Download and verify dependency assurance artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "9922094160"
          ARTIFACT_SHA256: "43c53cc13431cd2b2513fb0d9108836d548dd4b33b5673e9ddd49e4b1954918c"
        run: |
          mkdir -p /tmp/dependency-assurance
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/dependency-assurance.zip
          echo "${ARTIFACT_SHA256}  /tmp/dependency-assurance.zip" | sha256sum --check --strict
          unzip -q /tmp/dependency-assurance.zip -d /tmp/dependency-assurance
          test -s /tmp/dependency-assurance/gradle/verification-metadata.xml
          test -s /tmp/dependency-assurance/app/gradle.lockfile
          mkdir -p gradle app
          cp /tmp/dependency-assurance/gradle/verification-metadata.xml gradle/verification-metadata.xml
          cp /tmp/dependency-assurance/app/gradle.lockfile app/gradle.lockfile

      - name: Commit exact generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml app/gradle.lockfile
          if git diff --cached --quiet; then
            echo "Dependency assurance evidence already materialized."
            exit 0
          fi
          git commit -m "Add generated dependency assurance evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
