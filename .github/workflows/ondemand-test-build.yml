name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inventory-debug-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Classify nontrivial AppDebugManager call sites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter

          root = Path('app/src/main/java')

          def find_close(text, start):
              op = text.find('(', start)
              if op < 0: raise RuntimeError('missing (')
              depth = 0; i = op; state = 'code'
              while i < len(text):
                  c = text[i]; n = text[i+1] if i+1 < len(text) else ''
                  if state == 'code':
                      if c == '"': state = 'str'
                      elif c == "'": state = 'char'
                      elif c == '/' and n == '/': state = 'line'; i += 1
                      elif c == '/' and n == '*': state = 'block'; i += 1
                      elif c == '(': depth += 1
                      elif c == ')':
                          depth -= 1
                          if depth == 0: return i + 1
                  elif state == 'str':
                      if c == '\\': i += 1
                      elif c == '"': state = 'code'
                  elif state == 'char':
                      if c == '\\': i += 1
                      elif c == "'": state = 'code'
                  elif state == 'line':
                      if c == '\n': state = 'code'
                  elif state == 'block':
                      if c == '*' and n == '/': state = 'code'; i += 1
                  i += 1
              raise RuntimeError('unterminated')

          kinds = Counter(); examples = {}
          total = 0
          for path in sorted(root.rglob('*.java')):
              text = path.read_text(errors='replace')
              pos = 0
              while True:
                  start = text.find('AppDebugManager.', pos)
                  if start < 0: break
                  total += 1
                  close = find_close(text, start)
                  line_start = text.rfind('\n', 0, start) + 1
                  prefix = text[line_start:start].strip()
                  before = text[max(0, start-160):start].rstrip()
                  j = close
                  while j < len(text) and text[j] in ' \t\r\n': j += 1
                  after = text[j:j+16]
                  if j < len(text) and text[j] == ';' and (not prefix or prefix.endswith(('{','}',';'))):
                      kind = 'standalone'
                  elif j < len(text) and text[j] == ')' and before.endswith('->'):
                      kind = 'lambda-expression'
                  elif prefix.startswith('if ' ) or prefix.startswith('if(') or prefix.startswith('if ('):
                      kind = 'single-line-if'
                  elif prefix.startswith('else ' ):
                      kind = 'single-line-else'
                  else:
                      kind = 'other'
                  kinds[kind] += 1
                  if kind != 'standalone':
                      snippet = text[max(0,line_start-100):min(len(text), j+180)].replace('\n','\\n')
                      examples.setdefault(kind, []).append((str(path), snippet))
                  pos = close

          print('TOTAL', total)
          print('KINDS', dict(kinds))
          for kind, rows in examples.items():
              print(f'--- {kind} count={len(rows)} ---')
              for path, snippet in rows[:80]:
                  print(path + ' :: ' + snippet)
          PY
