name: On-demand Shizuku test APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Ignored during one-time lint baseline audit
        required: false
        type: boolean
        default: false

concurrency:
  group: ondemand-shizuku-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-lint-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Generate reviewed lint baseline diff only
        run: |
          set -euo pipefail
          cp app/lint-baseline.xml /tmp/lint-baseline-before.xml
          ./gradlew updateLintBaseline
          git diff -- app/lint-baseline.xml | tee /tmp/lint-baseline.diff
          test -s /tmp/lint-baseline.diff
