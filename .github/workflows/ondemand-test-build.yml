name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ondemand-shizuku-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  phase7-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 10
      - name: Apply guarded Phase 7 source hardening
        run: |
          python .github/scripts/phase7-contextcompat-import.py
          python .github/scripts/phase7-package-validation.py
          python .github/scripts/phase7-platform-accessibility.py
          python .github/scripts/phase7-locale-cleanup.py
          python .github/scripts/phase7-lint-errors-guarded.py
          python .github/scripts/phase7-overflow-accessibility.py
          git diff > /tmp/phase7-first.diff
          python .github/scripts/phase7-contextcompat-import.py
          python .github/scripts/phase7-package-validation.py
          python .github/scripts/phase7-platform-accessibility.py
          python .github/scripts/phase7-locale-cleanup.py
          python .github/scripts/phase7-lint-errors-guarded.py
          python .github/scripts/phase7-overflow-accessibility.py
          git diff > /tmp/phase7-second.diff
          cmp /tmp/phase7-first.diff /tmp/phase7-second.diff
      - name: Commit authoritative Phase 7 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test
          if ! git diff --cached --quiet; then
            git commit -m "Resolve final Phase 7 accessibility warning [skip ci]"
            git push origin HEAD:ondemand-shizuku
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Unit tests before baseline
        run: ./gradlew testDebugUnitTest
      - name: Verify lint has no errors before baselining warnings
        run: |
          rm -f app/lint-baseline.xml
          set +e
          ./gradlew lintDebug
          set -e
          REPORT=app/build/reports/lint-results-debug.xml
          test -s "$REPORT"
          if grep -q 'severity="Error"' "$REPORT"; then
            echo "Lint errors remain and may not be baselined:"
            grep -B2 -A8 'severity="Error"' "$REPORT" | head -240
            exit 1
          fi
          test -s app/lint-baseline.xml
          echo "Lint contains no errors; the expected first-run warning baseline was generated."
      - name: Review generated historical warning baseline
        run: |
          if grep -Eq 'id="(UnspecifiedRegisterReceiverFlag|PermissionImpliesUnsupportedHardware|ClickableViewAccessibility|RelativeOverlap|Recycle|LabelFor|Autofill|ContentDescription|MissingTvBanner|ResourceType|Instantiatable|MissingLeanbackSupport|NewApi|WrongThread|CoarseFineLocation|QueryAllPackagesPermission)"' app/lint-baseline.xml; then
            echo "A lint category that must be fixed is still present in the baseline"
            grep -E 'id="(UnspecifiedRegisterReceiverFlag|PermissionImpliesUnsupportedHardware|ClickableViewAccessibility|RelativeOverlap|Recycle|LabelFor|Autofill|ContentDescription|MissingTvBanner|ResourceType|Instantiatable|MissingLeanbackSupport|NewApi|WrongThread|CoarseFineLocation|QueryAllPackagesPermission)"' app/lint-baseline.xml
            exit 1
          fi
      - name: Commit reviewed lint baseline
        run: |
          git add -f app/lint-baseline.xml
          if ! git diff --cached --quiet; then
            git commit -m "Record reviewed historical lint warnings [skip ci]"
            git push origin HEAD:ondemand-shizuku
          fi
      - name: Quality gates
        run: |
          ./gradlew lintDebug
          ./gradlew testDebugUnitTest
          ./gradlew assembleDebugAndroidTest
          test -f app/schemas/com.gree1d.reappzuku.db.AppDatabase/11.json
          ./gradlew assembleDebug
      - name: Prepare APK and digest
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ReAppzuku-1.8.7-ondemand-debug.apk
          cd dist
          sha256sum ReAppzuku-1.8.7-ondemand-debug.apk | tee ReAppzuku-1.8.7-ondemand-debug.apk.sha256
      - name: Publish Phase 7 test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET="$(git rev-parse HEAD)"
          gh release delete ondemand-test --repo "${GITHUB_REPOSITORY}" --cleanup-tag -y || true
          gh release create ondemand-test \
            dist/ReAppzuku-1.8.7-ondemand-debug.apk \
            dist/ReAppzuku-1.8.7-ondemand-debug.apk.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET}" \
            --title "ReAppzuku 1.8.7 Assurance Phase 7 test" \
            --notes "Phase 7 live-test build: package-name validation at backup/preset and privileged command boundaries, Android receiver/hardware/TV capability fixes, accessibility/layout corrections, fork-feature translations, reviewed warning-only lint baseline, plus all Phase 1-6 hardening."
