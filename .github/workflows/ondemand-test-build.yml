name: On-demand Shizuku test APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-debug-scaffolding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Execute guarded cleanup with runner JDK 17
        shell: bash
        run: |
          set -euo pipefail
          : "${JAVA_HOME_17_X64:?GitHub runner JDK 17 is unavailable}"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version

          git show ff69e36437e23d20b8571bc55895ed31cef18b62:.github/workflows/ondemand-test-build.yml > /tmp/staged-cleanup.yml
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/staged-cleanup.yml').read_text().splitlines()
          marker = '      - name: Remove residual debug-only scaffolding and validate'
          step = source.index(marker)
          run_line = next(i for i in range(step + 1, len(source)) if source[i].strip() == 'run: |')
          body = source[run_line + 1:]
          prefix = '          '
          out = []
          for line in body:
              if line and not line.startswith(prefix):
                  raise SystemExit(f'unexpected cleanup indentation: {line!r}')
              out.append(line[len(prefix):] if line else '')
          script = '\n'.join(out) + '\n'

          patches = [
              (
                  "remove_line(p, '                    failed++;\\n')",
                  "remove_line(p, '                    failed++;\\n', expected=2)",
                  'sleep failure-counter guard',
              ),
              (
                  "'                if (ok) {\\n                    unfrozenNow++;\\n                } else {\\n                    failed++;\\n                }\\n'",
                  "'                if (ok) {\\n                    unfrozenNow++;\\n                } else {\\n                }\\n'",
                  'unfreeze summary block guard',
              ),
              (
                  "              'wakeupCount', 'normalCount', 'parsedCount',",
                  "              'parsedCount',",
                  'global forbidden-name list',
              ),
          ]
          for old, new, label in patches:
              if script.count(old) != 1:
                  raise SystemExit(f'expected one {label}, found {script.count(old)}')
              script = script.replace(old, new)

          Path('/tmp/reappzuku-debug-cleanup.sh').write_text(script)
          PY
          bash /tmp/reappzuku-debug-cleanup.sh
