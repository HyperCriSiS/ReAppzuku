name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ondemand-shizuku-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Lint
        run: ./gradlew lintDebug
      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest
      - name: Verify current Room schema export
        run: test -f app/schemas/com.gree1d.reappzuku.db.AppDatabase/11.json
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Prepare APK and digest
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ReAppzuku-1.8.7-ondemand-debug.apk
          cd dist
          sha256sum ReAppzuku-1.8.7-ondemand-debug.apk | tee ReAppzuku-1.8.7-ondemand-debug.apk.sha256
      - name: Upload validated APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ondemand-apk
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ondemand-apk
          path: dist
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ondemand-test --repo "${GITHUB_REPOSITORY}" --cleanup-tag -y || true
          gh release create ondemand-test \
            dist/ReAppzuku-1.8.7-ondemand-debug.apk \
            dist/ReAppzuku-1.8.7-ondemand-debug.apk.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ReAppzuku 1.8.7 Assurance Phase 6 test" \
            --notes "Live-test build with Phases 1-6: explicit Shizuku readiness, desired background-state enforcement, preset reboot recovery, transactional backup restore, non-destructive Room policy and migration evidence, platform-backup exclusion, exported shortcut hardening, reviewed exported platform components, immutable Action pins, lint validation, and least-privilege validation/publishing separation."
