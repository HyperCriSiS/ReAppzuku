name: On-demand Shizuku test APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Restore branch tree from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- docs/CHECK_MATRIX.md .github/workflows/ondemand-test-build.yml
          if git diff --quiet --cached && git diff --quiet; then
            echo "Nothing to recover"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CHECK_MATRIX.md .github/workflows/ondemand-test-build.yml
          git commit -m "Restore assurance refresh branch to main tree"
          git push origin HEAD:${GITHUB_REF_NAME}
