name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ondemand-shizuku-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  phase3-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply transactional backup storage
        run: |
          python .github/scripts/phase3-preset-storage.py
          python .github/scripts/phase3-backup-restore.py
          python .github/scripts/phase3-backup-helpers.py
          # Prove the migration scripts are safe to re-run.
          python .github/scripts/phase3-preset-storage.py
          python .github/scripts/phase3-backup-restore.py
          python .github/scripts/phase3-backup-helpers.py
      - name: Commit authoritative Phase 3 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/gree1d/reappzuku/core/BackupManager.java \
            app/src/main/java/com/gree1d/reappzuku/manager/PresetManager.java
          if git diff --cached --quiet; then
            echo "No Phase 3 source changes to commit"
          else
            git commit -m "Implement transactional backup restore phase 3 [skip ci]"
            git push origin HEAD:ondemand-shizuku
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ReAppzuku-1.8.7-ondemand-debug.apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum ReAppzuku-1.8.7-ondemand-debug.apk | tee ReAppzuku-1.8.7-ondemand-debug.apk.sha256
          gh release delete ondemand-test --cleanup-tag -y || true
          gh release create ondemand-test \
            ReAppzuku-1.8.7-ondemand-debug.apk \
            ReAppzuku-1.8.7-ondemand-debug.apk.sha256 \
            --target "$(git rev-parse HEAD)" \
            --title "ReAppzuku 1.8.7 Transactional Backup Phase 3 test" \
            --notes "Phase 3 live-test build: backup restore now validates before writing, snapshots all participating preference stores, commits synchronously, rolls back partial failures, reconciles runtime state only after durable success, limits import size, and treats active preset state as non-portable runtime state. Includes Phase 1 and Phase 2 hardening."