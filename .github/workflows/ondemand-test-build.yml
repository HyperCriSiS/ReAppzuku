name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-kotlin-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
      - name: Refresh strict dependency metadata and validate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --write-verification-metadata sha256 --write-locks testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/gradle.lockfile gradle/verification-metadata.xml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Refresh dependency metadata for Kotlin 2.4.10"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
