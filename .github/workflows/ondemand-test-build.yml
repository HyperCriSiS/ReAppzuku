name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ondemand-shizuku-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore last known-good application source
        run: |
          git checkout 6e7ceb2be9ce48c1ba96aed49d89794b58128194 -- \
            app/src/main/java/com/gree1d/reappzuku/core/ShellManager.java \
            app/src/main/java/com/gree1d/reappzuku/core/App.java \
            app/src/main/java/com/gree1d/reappzuku/ui/MainActivity.java \
            app/src/main/java/com/gree1d/reappzuku/manager/BackgroundAppManager.java
      - name: Commit restored authoritative source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/gree1d/reappzuku/core/ShellManager.java \
            app/src/main/java/com/gree1d/reappzuku/core/App.java \
            app/src/main/java/com/gree1d/reappzuku/ui/MainActivity.java \
            app/src/main/java/com/gree1d/reappzuku/manager/BackgroundAppManager.java
          git commit -m "Restore phase 1 source after connector write failure [skip ci]"
          git push origin HEAD:ondemand-shizuku
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
