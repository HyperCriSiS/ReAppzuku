name: On-demand Shizuku test APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-debug-scaffolding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Execute guarded cleanup with runner JDK 17
        shell: bash
        run: |
          set -euo pipefail
          : "${JAVA_HOME_17_X64:?GitHub runner JDK 17 is unavailable}"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version

          git show ff69e36437e23d20b8571bc55895ed31cef18b62:.github/workflows/ondemand-test-build.yml > /tmp/staged-cleanup.yml
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/staged-cleanup.yml').read_text().splitlines()
          marker = '      - name: Remove residual debug-only scaffolding and validate'
          try:
              step = source.index(marker)
          except ValueError:
              raise SystemExit('cleanup step marker not found')
          run_line = next(i for i in range(step + 1, len(source)) if source[i].strip() == 'run: |')
          body = source[run_line + 1:]
          prefix = '          '
          out = []
          for line in body:
              if line and not line.startswith(prefix):
                  raise SystemExit(f'unexpected cleanup indentation: {line!r}')
              out.append(line[len(prefix):] if line else '')
          Path('/tmp/reappzuku-debug-cleanup.sh').write_text('\n'.join(out) + '\n')
          PY
          bash /tmp/reappzuku-debug-cleanup.sh
