name: Guarded parser fixture validation

on:
  workflow_dispatch:

concurrency:
  group: parser-fixture-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Materialize guarded parser changes
        env:
          PARSER_B64: 
          PARSER_TEST_B64: 
          PROTECTED_TEST_B64: 
        run: |
          set -euo pipefail
          target=app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessAnalyzer.java
          test "$(git hash-object "$target")" = "2e7bbdf94590b37d3e506ee5838b7cdf7e7044b8"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessAnalyzer.java")
          text = p.read_text()
          replacements = [
              ('''// ---- CONST:BINDER_PATS ----
    private static final Pattern[] BINDER_PATS = {
            Pattern.compile("ProcessRecord\\{[^}]+\\s([\\w.]+)/"),
            Pattern.compile("client=ProcessRecord\\{[^}]+\\s([\\w.]+)/")
    };


''', ''''''),
              ('''        boolean inBlock    = false;
        int     adj        = Integer.MAX_VALUE;
        String  procState  = null;
        boolean persistent = false;

        Pattern procPat  = Pattern.compile(
                "ProcessRecord\\{[^}]+\\s" + Pattern.quote(packageName) + "/");
        Pattern adjPat   = Pattern.compile("\\badj=([-\\d]+)");
        Pattern statePat = Pattern.compile("\\bcurProcState=(\\w+)");

        for (String line : output.split("\\n")) {
            if (procPat.matcher(line).find()) {
                inBlock    = true;
                persistent = line.contains("persistent=true");
                continue;
            }
            if (inBlock && line.trim().startsWith("ProcessRecord{")
                    && !line.contains(packageName)) break;
            if (!inBlock) continue;

            Matcher mAdj = adjPat.matcher(line);
            if (mAdj.find() && adj == Integer.MAX_VALUE)
                adj = Integer.parseInt(mAdj.group(1));

            Matcher mState = statePat.matcher(line);
            if (mState.find() && procState == null)
                procState = mState.group(1);

            if (line.contains("persistent=true")) persistent = true;
        }

        if (procState == null && adj == Integer.MAX_VALUE) return list;
''', '''        ProcessDumpParser.ProcessStateSnapshot state =
                ProcessDumpParser.parseProcessState(output, packageName);
        if (state == null) return list;

        int adj = state.adj;
        String procState = state.procState;
        boolean persistent = state.persistent;
'''),
              ('''            if (t.contains("ServiceRecord") && t.contains(packageName)) {''',
               '''            if (ProcessDumpParser.isServiceRecordForPackage(t, packageName)) {'''),
              ('''            if (inBlock && t.contains("ServiceRecord") && !t.contains(packageName)) {''',
               '''            if (inBlock && ProcessDumpParser.isServiceRecordLine(t)
                    && !ProcessDumpParser.isServiceRecordForPackage(t, packageName)) {'''),
              ('''            for (Pattern bp : BINDER_PATS) {
                Matcher m = bp.matcher(t);
                if (m.find()) {
                    String pkg = m.group(1);
                    if (!pkg.equals(packageName) && !pkg.equals("android")
                            && !binders.contains(pkg)) binders.add(pkg);
                }
            }
''', '''            String binderPackage = ProcessDumpParser.extractProcessRecordPackage(t);
            if (binderPackage != null
                    && !binderPackage.equals(packageName)
                    && !binderPackage.equals("android")
                    && !binders.contains(binderPackage)) {
                binders.add(binderPackage);
            }
'''),
              ('''        Matcher m = Pattern.compile("ServiceRecord\\{[^}]+\\s([\\w./]+)\\}").matcher(line);
        if (!m.find()) return null;
        String full = m.group(1);
        if (!full.contains("/")) return full;
        String cls = full.substring(full.indexOf('/') + 1);
        if (cls.startsWith("."))               return cls.substring(1);
        if (cls.startsWith(packageName + ".")) return cls.substring(packageName.length() + 1);
        return cls;
''', '''        return ProcessDumpParser.extractServiceShortName(line, packageName);
''')
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source match, got {count}")
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

          mkdir -p app/src/test/java/com/gree1d/reappzuku/utils/triggers/analyzers
          printf '%s' "$PARSER_B64" | base64 -d > app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessDumpParser.java
          printf '%s' "$PARSER_TEST_B64" | base64 -d > app/src/test/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessDumpParserTest.java
          printf '%s' "$PROTECTED_TEST_B64" | base64 -d > app/src/test/java/com/gree1d/reappzuku/core/ProtectedAppsTest.java

          git diff --check
          test "$(git status --short | wc -l)" -eq 4
      - name: Validate parser fixtures and app build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug
      - name: Commit exact parser fixture change set
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessAnalyzer.java \
            app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessDumpParser.java \
            app/src/test/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessDumpParserTest.java \
            app/src/test/java/com/gree1d/reappzuku/core/ProtectedAppsTest.java
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --check
          git commit -m "Add dumpsys parser fixtures across Android variants"
          git push origin "HEAD:${GITHUB_REF_NAME}"
