name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inventory-debug-lambdas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Inventory logger-only Java lambdas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java')
          hits = []
          for path in sorted(root.rglob('*.java')):
              text = path.read_text(errors='replace')
              pos = 0
              while True:
                  start = text.find('AppDebugManager.', pos)
                  if start < 0:
                      break
                  before = text[:start].rstrip()
                  if before.endswith('->'):
                      line = text.count('\n', 0, start) + 1
                      snippet = text[max(0, start-180):min(len(text), start+400)].replace('\n','\\n')
                      hits.append((str(path), line, snippet))
                  pos = start + len('AppDebugManager.')
          print(f'LAMBDA_HITS={len(hits)}')
          for path, line, snippet in hits:
              print(f'{path}:{line} :: {snippet}')
          PY
