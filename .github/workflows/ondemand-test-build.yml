name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ondemand-shizuku-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  phase2-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply explicit shell readiness state
        run: |
          python .github/scripts/phase2-shellmanager.py
          python .github/scripts/phase2-app.py
          python .github/scripts/phase2-main.py
          python .github/scripts/phase2-background.py
      - name: Commit authoritative Phase 2 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/gree1d/reappzuku/core/ShellManager.java \
            app/src/main/java/com/gree1d/reappzuku/core/App.java \
            app/src/main/java/com/gree1d/reappzuku/ui/MainActivity.java \
            app/src/main/java/com/gree1d/reappzuku/manager/BackgroundAppManager.java
          git commit -m "Implement shell readiness state machine phase 2 [skip ci]"
          git push origin HEAD:ondemand-shizuku
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ReAppzuku-1.8.7-ondemand-debug.apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum ReAppzuku-1.8.7-ondemand-debug.apk | tee ReAppzuku-1.8.7-ondemand-debug.apk.sha256
          gh release delete ondemand-test --cleanup-tag -y || true
          gh release create ondemand-test \
            ReAppzuku-1.8.7-ondemand-debug.apk \
            ReAppzuku-1.8.7-ondemand-debug.apk.sha256 \
            --target "$(git rev-parse HEAD)" \
            --title "ReAppzuku 1.8.7 Shell Readiness Phase 2 test" \
            --notes "Phase 2 live-test build: explicit Root/Shizuku backend states. Permission grant no longer means shell readiness; app scanning waits for the Shizuku UserService to be connected and waiting states no longer produce the misleading running-app failure."
