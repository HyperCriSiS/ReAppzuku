name: On-demand Shizuku test APK

on:
  push:
    branches:
      - ondemand-shizuku
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ondemand-shizuku
          fetch-depth: 10
      - name: Fix Shizuku permission and service readiness
        run: |
          python .github/scripts/fix-shizuku-service-readiness.py
          python .github/scripts/fix-shizuku-permission-race.py
      - name: Apply app behavior patch
        run: python .github/scripts/apply-exit-on-back.py
      - name: Apply full-exit behavior
        run: python .github/scripts/apply-full-exit.py
      - name: Apply Smart Lifecycle patch
        run: python .github/scripts/apply-smart-lifecycle.py
      - name: Apply App Behavior compatibility policy
        run: python .github/scripts/apply-app-behavior-policy.py
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml \
                  app/src/main/java/com/gree1d/reappzuku/core/App.java \
                  app/src/main/java/com/gree1d/reappzuku/core/PreferenceKeys.java \
                  app/src/main/java/com/gree1d/reappzuku/core/BootReceiver.java \
                  app/src/main/java/com/gree1d/reappzuku/core/BackgroundWorkPolicy.java \
                  app/src/main/java/com/gree1d/reappzuku/core/ShizukuWakeReceiver.java \
                  app/src/main/java/com/gree1d/reappzuku/core/ShellManager.java \
                  app/src/main/java/com/gree1d/reappzuku/manager/SmartLifecycleManager.java \
                  app/src/main/java/com/gree1d/reappzuku/service/SmartLifecycleWorker.java \
                  app/src/main/java/com/gree1d/reappzuku/service/AppLaunchAccessibilityService.java \
                  app/src/main/java/com/gree1d/reappzuku/ui/MainActivity.java \
                  app/src/main/java/com/gree1d/reappzuku/ui/SettingsActivity.java \
                  app/src/main/res/layout/activity_settings.xml \
                  app/src/main/res/values/strings.xml
          if ! git diff --cached --quiet; then
            git commit -m "Apply on-demand behavior and Smart Lifecycle [skip ci]"
            git push origin HEAD:ondemand-shizuku
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ReAppzuku-1.8.7-ondemand-debug.apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ondemand-test --cleanup-tag -y || true
          gh release create ondemand-test ReAppzuku-1.8.7-ondemand-debug.apk \
            --target "$(git rev-parse HEAD)" \
            --title "ReAppzuku 1.8.7 On-demand Shizuku test" \
            --notes "Test build: configurable Shizuku on-demand startup, guarded full exit on Back, Smart Lifecycle app management, background-automation interlocks, and Shizuku permission/UserService synchronization."
