name: On-demand Shizuku test APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Ignored during one-time Room schema extraction
        required: false
        type: boolean
        default: false

concurrency:
  group: ondemand-shizuku-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extract-room-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Generate Room schema from source
        run: ./gradlew clean compileDebugJavaWithJavac --no-build-cache --rerun-tasks --warning-mode all
      - name: Verify generated Room schema 11
        run: test -f app/schemas/com.gree1d.reappzuku.db.AppDatabase/11.json
      - name: Emit authoritative Room schema 11
        run: |
          printf 'ROOM_SCHEMA_11_BASE64='
          base64 -w0 app/schemas/com.gree1d.reappzuku.db.AppDatabase/11.json
          printf '\n'
      - name: Upload authoritative Room schema 11
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: room-schema-11
          path: app/schemas/com.gree1d.reappzuku.db.AppDatabase/11.json
          if-no-files-found: error
          retention-days: 1
