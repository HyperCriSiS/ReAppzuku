name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inventory-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Inventory AppDebugManager and debug UI references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== AppDebugManager references ==='
          grep -RIn --exclude='AppDebugManager.java' 'AppDebugManager' app/src docs .github || true
          echo '=== Debug UI ids ==='
          grep -RIn -E 'switch_debug_enabled|layout_debug_menu|settings_debug_|appdebug_' app/src docs .github || true
          echo '=== ReAppzukuDebug tag ==='
          grep -RIn 'ReAppzukuDebug' app/src docs .github || true
