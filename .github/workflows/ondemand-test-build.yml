name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ondemand-shizuku-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply shortcut color regression fix
        run: |
          python .github/scripts/fix-shortcut-color-regression.py
          python .github/scripts/fix-shortcut-color-regression.py
      - name: Commit authoritative shortcut fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/gree1d/reappzuku/manager/RamKillShortcutManager.java
          if ! git diff --cached --quiet; then
            git commit -m "Fix shortcut icon color regression [skip ci]"
            git push origin HEAD:ondemand-shizuku
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest
      - name: Verify current Room schema export
        run: test -f app/schemas/com.gree1d.reappzuku.db.AppDatabase/11.json
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ReAppzuku-1.8.7-ondemand-debug.apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum ReAppzuku-1.8.7-ondemand-debug.apk | tee ReAppzuku-1.8.7-ondemand-debug.apk.sha256
          gh release delete ondemand-test --cleanup-tag -y || true
          gh release create ondemand-test \
            ReAppzuku-1.8.7-ondemand-debug.apk \
            ReAppzuku-1.8.7-ondemand-debug.apk.sha256 \
            --target "$(git rev-parse HEAD)" \
            --title "ReAppzuku 1.8.7 Assurance Phase 5 test" \
            --notes "Live-test build with Phases 1-4 plus exported-shortcut privilege hardening. Dynamic RAM shortcuts use an install-specific authentication token; legacy/static and external launches require explicit user confirmation before privileged actions. Includes transactional backup restore, explicit Shizuku readiness, Room migration evidence, and platform-backup exclusion."