name: Normalize policy migration schema

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/unified-app-policy-foundation
          fetch-depth: 0
      - name: Match migration SQL to Room schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/gree1d/reappzuku/db/AppDatabase.java")
          s = p.read_text()
          start = s.index("    static final Migration MIGRATION_11_12")
          end = s.index("    private static final int SQL_CACHE_SIZE", start)
          block = s[start:end]
          block = re.sub(r" DEFAULT (?:0|1|3600000|21600000)", "", block)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/ondemand-test-build.yml
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git commit -m 'Match policy migration to generated Room schema'
          git push origin HEAD:feature/unified-app-policy-foundation
