name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Apply legacy-policy activation patch
        run: python3 .github/scripts/apply-legacy-policy-activation.py
      - name: Generate Room schema 13
        run: ./gradlew :app:compileDebugJavaWithJavac
      - name: Commit generated source and schema
        shell: bash
        run: |
          set -euo pipefail
          test -f app/schemas/com.gree1d.reappzuku.db.AppDatabase/13.json
          git show HEAD^:.github/workflows/ondemand-test-build.yml > .github/workflows/ondemand-test-build.yml
          rm .github/scripts/apply-legacy-policy-activation.py
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          cat > /tmp/expected <<'EOF'
app/schemas/com.gree1d.reappzuku.db.AppDatabase/13.json
app/src/androidTest/java/com/gree1d/reappzuku/db/AppDatabaseMigrationTest.java
app/src/main/java/com/gree1d/reappzuku/core/App.java
app/src/main/java/com/gree1d/reappzuku/core/AppPolicyLegacyMigrator.java
app/src/main/java/com/gree1d/reappzuku/core/BackupManager.java
app/src/main/java/com/gree1d/reappzuku/core/PreferenceKeys.java
app/src/main/java/com/gree1d/reappzuku/db/AppDatabase.java
app/src/main/java/com/gree1d/reappzuku/db/AppPolicy.java
app/src/main/java/com/gree1d/reappzuku/db/AppPolicyDao.java
app/src/main/java/com/gree1d/reappzuku/manager/AutoKillManager.java
app/src/main/java/com/gree1d/reappzuku/manager/SmartLifecycleManager.java
app/src/test/java/com/gree1d/reappzuku/core/AppPolicyLegacyMigratorTest.java
app/src/test/java/com/gree1d/reappzuku/core/LegacyPolicyActivationSourceTest.java
docs/ROADMAP.md
EOF
          diff -u /tmp/expected <(printf '%s\n' "$changed")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Activate retry-safe legacy policy migration"
          git push origin HEAD:feature/legacy-policy-activation
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Lint
        run: ./gradlew lintDebug
      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest
      - name: Verify current Room schema export
        run: test -f app/schemas/com.gree1d.reappzuku.db.AppDatabase/13.json
      - name: Build debug APK
        run: ./gradlew assembleDebug
