name: On-demand Shizuku test APK

on:
  push:
    branches:
      - ondemand-shizuku
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ondemand-shizuku
          fetch-depth: 10
      - name: Apply existing on-demand patches
        run: |
          python .github/scripts/fix-shizuku-service-readiness.py
          python .github/scripts/fix-shizuku-permission-race.py
          python .github/scripts/apply-exit-on-back.py
          python .github/scripts/apply-full-exit.py
          python .github/scripts/apply-smart-lifecycle.py
          python .github/scripts/apply-app-behavior-policy.py
      - name: Apply assurance roadmap phase 1
        run: python .github/scripts/apply-assurance-phase1.py
      - name: Commit authoritative source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Implement assurance roadmap phase 1 [skip ci]"
            git push origin HEAD:ondemand-shizuku
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ReAppzuku-1.8.7-ondemand-debug.apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum ReAppzuku-1.8.7-ondemand-debug.apk | tee ReAppzuku-1.8.7-ondemand-debug.apk.sha256
          gh release delete ondemand-test --cleanup-tag -y || true
          gh release create ondemand-test \
            ReAppzuku-1.8.7-ondemand-debug.apk \
            ReAppzuku-1.8.7-ondemand-debug.apk.sha256 \
            --target "$(git rev-parse HEAD)" \
            --title "ReAppzuku 1.8.7 Assurance Phase 1 test" \
            --notes "Live-test build: desired-service-state fix, fork-owned update channel, preset reboot recovery, exact-alarm fallback, backup v5, non-destructive Room migration policy, accessibility cleanup, and initial unit-test gates."
