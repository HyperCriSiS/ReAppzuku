name: On-demand Shizuku test APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Refresh current assurance evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          matrix = Path('docs/CHECK_MATRIX.md')
          text = matrix.read_text()
          old_a18 = "| A18 | Build / CI / dependencies / supply chain | DECIDED | Source-authoritative least-privilege CI, immutable Action SHA pins, zero-error lint, dependency locking/verification and stable tag/source/APK version binding are enforced. Gradle is now 9.7.1 with the binary distribution SHA-256 pinned; final main normal/API-37 validation after security-probe integration and HiddenApiBypass removal passed in `34671036949` / `34670916924`. The signed-release task graph is explicitly scoped to `:app:` so the permanent `securityProbe` test module cannot enter release builds. As of 2026-09-12 GitHub reports zero open Dependabot alerts and zero open secret-scanning alerts; Code Scanning/CodeQL has no analysis result yet, so that evidence remains open. Physical release signing/rollback evidence also remains open. |"
          new_a18 = "| A18 | Build / CI / dependencies / supply chain | DECIDED | Source-authoritative least-privilege CI, immutable Action SHA pins, zero-error lint, dependency locking/verification and stable tag/source/APK version binding are enforced. Gradle is now 9.7.1 with the binary distribution SHA-256 pinned; final main normal/API-37 validation after security-probe integration and HiddenApiBypass removal passed in `34671036949` / `34670916924`. Pinned Java/Kotlin CodeQL is now active: normal validation `34672629853` and CodeQL `34672626846` passed, the subsequently reported actionable findings were repaired, and repaired-head validation passed normal `34673771828`, CodeQL `34673776649` / PR `34673964881`, and API-37 `34673781807`. The signed-release task graph is explicitly scoped to `:app:` so the permanent `securityProbe` test module cannot enter release builds. As of 2026-09-12 GitHub reports zero open Dependabot alerts, zero open secret-scanning alerts and no remaining actionable CodeQL finding on the validated product line. Physical release signing/rollback evidence remains open. |"
          if old_a18 not in text:
              raise SystemExit('A18 anchor not found')
          text = text.replace(old_a18, new_a18, 1)

          old_security = "- repository security state checked 2026-09-12: zero open Dependabot alerts and zero open secret-scanning alerts. Code scanning/CodeQL has no analysis result yet, so no CodeQL pass is claimed; this remains an assurance gap rather than a green check;"
          new_security = "- workflow runs `34672629853` / `34672626846`: pinned Java/Kotlin CodeQL entered the permanent assurance line with normal + CodeQL validation passing; repaired-head validation after the actionable findings passed normal `34673771828`, CodeQL `34673776649` / PR `34673964881`, and API-37 `34673781807`;\n- repository security state checked 2026-09-12: zero open Dependabot alerts, zero open secret-scanning alerts and no remaining actionable CodeQL finding on the validated product line;"
          if old_security not in text:
              raise SystemExit('security-state anchor not found')
          text = text.replace(old_security, new_security, 1)

          obsolete_gap = "- **Code scanning:** enable and validate CodeQL/code-scanning analysis with immutable action pins; current repository state has no Code Scanning analysis result, so no pass is claimed yet.\n"
          if obsolete_gap not in text:
              raise SystemExit('CodeQL gap anchor not found')
          text = text.replace(obsolete_gap, '', 1)
          matrix.write_text(text)

          roadmap = Path('docs/ROADMAP.md')
          r = roadmap.read_text()
          if 'refreshed through 2026-09-08' not in r:
              raise SystemExit('roadmap refresh-date anchor not found')
          r = r.replace('refreshed through 2026-09-08', 'refreshed through 2026-09-12', 1)
          if '### Maintainability evidence — 2026-09-05 to 2026-09-08' not in r:
              raise SystemExit('maintainability date anchor not found')
          r = r.replace('### Maintainability evidence — 2026-09-05 to 2026-09-08', '### Maintainability evidence — 2026-09-05 to 2026-09-12', 1)
          anchor = "- Scheduling facade gate `33946729221` passed unit tests, lint, AndroidTest compilation and debug APK build before integrating `Clock`/`ScheduleTime` and `AlarmScheduler`."
          addition = "- Pinned Java/Kotlin CodeQL is now part of the permanent assurance line. Initial normal/CodeQL validation passed in `34672629853` / `34672626846`; actionable findings were then fixed without breaking root compatibility, with repaired-head normal `34673771828`, CodeQL `34673776649` / PR `34673964881`, and API-37 `34673781807` all passing.\n- The unified user-facing On-demand mode is integrated and derives from the existing prevent-Shizuku-autostart + full-exit-on-Back controls rather than introducing a third lifecycle state. Normal `34674754810`, CodeQL PR `34700033242` and Android 17/API-37 runtime `34700010704` passed; Help documentation was propagated across EN/DE/ES/RU/UK/ZH.\n" + anchor
          if anchor not in r:
              raise SystemExit('roadmap evidence insertion anchor not found')
          r = r.replace(anchor, addition, 1)
          roadmap.write_text(r)
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/ondemand-test-build.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CHECK_MATRIX.md docs/ROADMAP.md .github/workflows/ondemand-test-build.yml
          git commit -m "Refresh assurance evidence after CodeQL and On-demand mode"
          git push origin HEAD:${GITHUB_REF_NAME}
