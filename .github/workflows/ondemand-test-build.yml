name: On-demand Shizuku test APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
      - name: Refresh dependency verification and validate Kotlin 2.4.20
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --write-verification-metadata sha256 --write-locks testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug
          git fetch origin main
          git checkout origin/main -- .github/workflows/ondemand-test-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml app/gradle.lockfile .github/workflows/ondemand-test-build.yml
          if git diff --cached --quiet; then
            echo "No dependency metadata change"
            exit 0
          fi
          git commit -m "Refresh dependency metadata for Kotlin 2.4.20"
          git push origin HEAD:${GITHUB_REF_NAME}
