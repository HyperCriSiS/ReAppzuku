name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cleanup-debug-help:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Remove obsolete debug help sections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('docs/HELP.md'),
              Path('docs/HELP_DE.md'),
              Path('docs/HELP_ES.md'),
              Path('docs/HELP_RU.md'),
              Path('docs/HELP_UK.md'),
              Path('docs/HELP_ZH.md'),
          ]
          for path in files:
              raw = path.read_bytes().decode('utf-8')
              lines = raw.splitlines(keepends=True)
              matches = [i for i, line in enumerate(lines) if 'ReAppzukuDebug' in line]
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected exactly one ReAppzukuDebug reference, got {len(matches)}')
              marker = matches[0]
              start = None
              for i in range(marker, -1, -1):
                  stripped = lines[i].strip()
                  if stripped.startswith('**') and stripped.endswith('**\\'):
                      start = i
                      break
              if start is None:
                  raise SystemExit(f'{path}: could not find debug section heading')
              end = None
              for i in range(marker + 1, min(len(lines), marker + 30)):
                  if lines[i].strip() == '---':
                      end = i
                      break
              if end is None:
                  raise SystemExit(f'{path}: could not find section separator')
              removed = ''.join(lines[start:end])
              if 'ReAppzukuDebug' not in removed or not (5 <= end - start <= 25):
                  raise SystemExit(f'{path}: unsafe debug section bounds')
              path.write_bytes(''.join(lines[:start] + lines[end:]).encode('utf-8'))
          PY
          ! grep -RIn 'ReAppzukuDebug' docs/HELP*.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HELP.md docs/HELP_DE.md docs/HELP_ES.md docs/HELP_RU.md docs/HELP_UK.md docs/HELP_ZH.md
          git diff --cached --check
          git commit -m "Remove obsolete production debug help"
          git push origin HEAD:${GITHUB_REF_NAME}
