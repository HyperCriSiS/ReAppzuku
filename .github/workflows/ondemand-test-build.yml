name: Apply current app-management task

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ux/app-management-relaunches
          fetch-depth: 0
      - name: Apply reviewed product patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/reapp.patch
          git apply --check /tmp/reapp.patch
          git apply /tmp/reapp.patch
          git fetch origin main
          git checkout origin/main -- .github/workflows/ondemand-test-build.yml
          git diff --check
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git commit -m 'Unify app management and report relaunches'
          git push origin HEAD:ux/app-management-relaunches
