name: Apply unified app-policy foundation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/unified-app-policy-foundation
          fetch-depth: 0
      - name: Apply reviewed policy foundation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/policy.patch
          git apply --check /tmp/policy.patch
          git apply /tmp/policy.patch
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon
          test -f app/schemas/com.gree1d.reappzuku.db.AppDatabase/12.json
          git fetch origin main
          git checkout origin/main -- .github/workflows/ondemand-test-build.yml
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git commit -m 'Add unified app lifecycle policy foundation'
          git push origin HEAD:feature/unified-app-policy-foundation
