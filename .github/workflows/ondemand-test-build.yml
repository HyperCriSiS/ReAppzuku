name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format-root-helper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Format helper and restore validation workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/gree1d/reappzuku/core/ShellManager.java')
          text = path.read_text()
          old = '''    private Process startRootShell() throws IOException {
          IOException lastFailure = null;
          try { return Runtime.getRuntime().exec("/system/bin/su"); } catch (IOException e) { lastFailure = e; }
          try { return Runtime.getRuntime().exec("/debug_ramdisk/su"); } catch (IOException e) { lastFailure = e; }
          try { return Runtime.getRuntime().exec("/sbin/su"); } catch (IOException e) { lastFailure = e; }
          try { return Runtime.getRuntime().exec("/system/xbin/su"); } catch (IOException e) { lastFailure = e; }
          try { return Runtime.getRuntime().exec("/system/sbin/su"); } catch (IOException e) { lastFailure = e; }
          try { return Runtime.getRuntime().exec("/su/bin/su"); } catch (IOException e) { lastFailure = e; }
          try { return Runtime.getRuntime().exec("/su/xbin/su"); } catch (IOException e) { lastFailure = e; }
          try { return Runtime.getRuntime().exec("/magisk/.core/bin/su"); } catch (IOException e) { lastFailure = e; }
          throw lastFailure != null ? lastFailure : new IOException("No supported root shell path is available");
      }
          '''
          new = '''    private Process startRootShell() throws IOException {
              IOException lastFailure = null;
              try { return Runtime.getRuntime().exec("/system/bin/su"); } catch (IOException e) { lastFailure = e; }
              try { return Runtime.getRuntime().exec("/debug_ramdisk/su"); } catch (IOException e) { lastFailure = e; }
              try { return Runtime.getRuntime().exec("/sbin/su"); } catch (IOException e) { lastFailure = e; }
              try { return Runtime.getRuntime().exec("/system/xbin/su"); } catch (IOException e) { lastFailure = e; }
              try { return Runtime.getRuntime().exec("/system/sbin/su"); } catch (IOException e) { lastFailure = e; }
              try { return Runtime.getRuntime().exec("/su/bin/su"); } catch (IOException e) { lastFailure = e; }
              try { return Runtime.getRuntime().exec("/su/xbin/su"); } catch (IOException e) { lastFailure = e; }
              try { return Runtime.getRuntime().exec("/magisk/.core/bin/su"); } catch (IOException e) { lastFailure = e; }
              throw lastFailure != null ? lastFailure : new IOException("No supported root shell path is available");
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one unformatted helper, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git fetch origin main
          git checkout origin/main -- .github/workflows/ondemand-test-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/gree1d/reappzuku/core/ShellManager.java .github/workflows/ondemand-test-build.yml
          git commit -m "Format root shell helper"
          git push origin HEAD:${GITHUB_REF_NAME}
