name: On-demand Shizuku test APK

on:
  workflow_dispatch:

concurrency:
  group: ondemand-shizuku-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest
      - name: Verify current Room schema export
        run: test -f app/schemas/com.gree1d.reappzuku.db.AppDatabase/11.json
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ReAppzuku-1.8.7-ondemand-debug.apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum ReAppzuku-1.8.7-ondemand-debug.apk | tee ReAppzuku-1.8.7-ondemand-debug.apk.sha256
          gh release delete ondemand-test --cleanup-tag -y || true
          gh release create ondemand-test \
            ReAppzuku-1.8.7-ondemand-debug.apk \
            ReAppzuku-1.8.7-ondemand-debug.apk.sha256 \
            --target "${GITHUB_SHA}" \
            --title "ReAppzuku 1.8.7 Assurance Phase 4 test" \
            --notes "Live-test build with Phase 1-3 hardening plus explicit platform-backup exclusion and compiled Room migration evidence for the supported v2→v11 path. The instrumentation migration test validates the final schema and preservation of existing statistics data when executed on Android."