name: Superseded branch cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full main history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify superseding mainline evidence and delete branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          for sha in \
            d12c2282450b2945830bab3108dac7a43034e362 \
            6b7d8eb12f1959fb1adc35f4de0905e436879393 \
            cf155d9640b4464dc687999e137e1f394ed58727 \
            93d0bc51e9c383b656b12e6b4be94b311b6858ac; do
            git merge-base --is-ancestor "$sha" HEAD || {
              echo "Required superseding main commit is missing: $sha" >&2
              exit 1
            }
          done

          grep -Fq 'R.string.ui_sort_label_with_indicator' app/src/main/java/com/gree1d/reappzuku/ui/PresetSettingsActivity.java
          grep -Fq 'ui_sort_indicator_open' app/src/main/res/values/strings.xml
          test -f app/src/main/java/com/gree1d/reappzuku/core/ManualOpsMaskPolicy.java
          test -f app/src/main/java/com/gree1d/reappzuku/core/ManualRestrictionBackupPolicy.java
          grep -Fq 'targetSdk = 37' app/build.gradle

          declare -A expected=(
            [roadmap/a17-settext-i18n]=96639959c2982ce15e44cba926e8adb52c77a08b
            [roadmap/manual-ops-mask-bounds]=272cdd4824031ee5b4d78e9072c741f1a3b4fd73
            [roadmap/manual-restriction-backup-roundtrip]=984cf3375f280091321395768b3a663fb2ecb084
            [roadmap/remove-obsolete-sdk-branches]=03393e4bbdffd90beae3a90506914089c744eec1
            [restore/roadmap-3005f7e]=f1e5929407044412d42fadf7b01f6078a3ef2368
          )

          for branch in "${!expected[@]}"; do
            ref="refs/remotes/origin/$branch"
            git show-ref --verify --quiet "$ref" || {
              echo "Branch already absent: $branch"
              continue
            }
            actual="$(git rev-parse "$ref")"
            test "$actual" = "${expected[$branch]}" || {
              echo "Refusing changed branch $branch: expected ${expected[$branch]}, got $actual" >&2
              exit 1
            }
            if [ "$branch" = 'restore/roadmap-3005f7e' ]; then
              test "$(git log --format='%s' origin/main.."$ref" | wc -l)" -eq 2
              git log --format='%s' origin/main.."$ref" | grep -Fq 'Trigger roadmap snapshot recovery'
              git log --format='%s' origin/main.."$ref" | grep -Fq 'Remove temporary recovery workflow from branch'
            fi
            echo "Deleting superseded branch: $branch"
            git push origin --delete "$branch"
          done
