name: Patch-equivalent branch cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full main history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Reverify and delete only patch-equivalent branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          branches=(
            roadmap/a17-hardcoded-text
            roadmap/a17-typography-dashes
            roadmap/close-accessibility-runtime
            roadmap/document-api37-privileged-shell
            roadmap/evidence-refresh-2026-09-08
            roadmap/lint-regression-hygiene
            roadmap/locale-aware-app-search
            roadmap/locale-stable-machine-parsers
          )
          for branch in "${branches[@]}"; do
            git show-ref --verify --quiet "refs/remotes/origin/$branch" || {
              echo "Branch already absent: $branch"
              continue
            }
            cherry="$(git cherry origin/main "origin/$branch")"
            printf '%s\n' "$cherry"
            if grep -q '^+' <<<"$cherry"; then
              echo "Refusing to delete branch with unique patch: $branch" >&2
              exit 1
            fi
            test -n "$cherry" || {
              echo "No branch-only commits remain for $branch; safe to delete."
            }
            echo "Deleting patch-equivalent branch: $branch"
            git push origin --delete "$branch"
          done
