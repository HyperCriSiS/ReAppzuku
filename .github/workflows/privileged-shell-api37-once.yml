name: One-time representative PrivilegedShell API 37 probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privileged-shell-api37:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ondemand-shizuku
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Prepare Android 17 toolchain
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CLT_ZIP=/tmp/commandlinetools-linux-15859902_latest.zip
          CLT_HOME="$SDK_ROOT/cmdline-tools/reappzuku-15859902"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' \
            -o "$CLT_ZIP"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/commandlinetools-linux-15859902_latest.zip' | sha256sum -c -
          rm -rf /tmp/android-clt "$CLT_HOME"
          mkdir -p /tmp/android-clt "$CLT_HOME"
          unzip -q "$CLT_ZIP" -d /tmp/android-clt
          cp -a /tmp/android-clt/cmdline-tools/. "$CLT_HOME/"
          echo "$CLT_HOME/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Build product, instrumentation and disposable target
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/androidTest/java/com/gree1d/reappzuku/core/PrivilegedShellRealShizukuInstrumentationTest.java
          grep -F 'compileSdk = 37' app/build.gradle
          grep -F 'targetSdk = 37' app/build.gradle
          cp app/build.gradle /tmp/reappzuku-build.gradle
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle')
          text = path.read_text(encoding='utf-8')
          old = 'applicationId = "com.gree1d.reappzuku"'
          new = 'applicationId = "com.gree1d.reappzuku.probetarget"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one applicationId declaration, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/reappzuku-probe-target.apk
          cp /tmp/reappzuku-build.gradle app/build.gradle
          ./gradlew clean assembleDebug assembleDebugAndroidTest
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging /tmp/reappzuku-probe-target.apk | sed -n '1p' | tee /tmp/probe-target-badging
          grep -Fq "package: name='com.gree1d.reappzuku.probetarget'" /tmp/probe-target-badging
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | sed -n '1p' | tee /tmp/app-badging
          grep -Fq "package: name='com.gree1d.reappzuku'" /tmp/app-badging

      - name: Install and boot API 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CLT_HOME="$SDK_ROOT/cmdline-tools/reappzuku-15859902"
          IMAGE='system-images;android-37.0;google_apis_ps16k;x86_64'
          yes | "$CLT_HOME/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$CLT_HOME/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            'platform-tools' 'emulator' 'platforms;android-37.0' "$IMAGE"
          echo no | "$CLT_HOME/bin/avdmanager" create avd \
            --force --name reappzuku-privshell37 --package "$IMAGE" --device pixel_6
          [ ! -e /dev/kvm ] || sudo chmod 666 /dev/kvm || true
          nohup emulator @reappzuku-privshell37 \
            -no-window -no-audio -no-boot-anim -no-metrics -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -partition-size 4096 >/tmp/privshell37-emulator.log 2>&1 &
          adb wait-for-device
          timeout 360 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = '37'
          adb shell input keyevent 82 || true
          adb shell wm dismiss-keyguard || true

      - name: Install official Shizuku and probe packages
        shell: bash
        run: |
          set -euo pipefail
          SHIZUKU_URL='https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk'
          SHIZUKU_APK='/tmp/shizuku-v13.6.0.r1086.2650830c-release.apk'
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 "$SHIZUKU_URL" -o "$SHIZUKU_APK"
          echo '6e273ab0e991c4e79bc8b1bbb9b9dd739ccac1a8712a541a214078886b7b790f  /tmp/shizuku-v13.6.0.r1086.2650830c-release.apk' | sha256sum -c -
          adb install -r "$SHIZUKU_APK" | tee /tmp/install-shizuku.txt
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk | tee /tmp/install-app.txt
          TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*.apk' | sort | sed -n '1p')"
          test -f "$TEST_APK"
          adb install -r -t "$TEST_APK" | tee /tmp/install-test.txt
          adb install -r /tmp/reappzuku-probe-target.apk | tee /tmp/install-target.txt
          adb shell pm clear com.gree1d.reappzuku
          adb shell pm revoke com.gree1d.reappzuku moe.shizuku.manager.permission.API_V23 2>/dev/null || true
          adb shell pm path com.gree1d.reappzuku.probetarget | grep -q '^package:'
          adb shell dumpsys package com.gree1d.reappzuku | grep -F 'targetSdk=37'

      - name: Start real Shizuku daemon
        shell: bash
        run: |
          set -euo pipefail
          SHIZUKU_APK_PATH="$(adb shell pm path moe.shizuku.privileged.api | tr -d '\r' | sed -n '1s/^package://p')"
          test -n "$SHIZUKU_APK_PATH"
          SHIZUKU_CODE_DIR="${SHIZUKU_APK_PATH%/*}"
          SHIZUKU_LIB="$SHIZUKU_CODE_DIR/lib/x86_64/libshizuku.so"
          adb shell test -x "$SHIZUKU_LIB"
          adb shell "$SHIZUKU_LIB" | tee /tmp/shizuku-api37-start.log
          ready=false
          for i in $(seq 1 60); do
            if [ -n "$(adb shell pidof shizuku_server 2>/dev/null | tr -d '\r' || true)" ]; then
              ready=true
              break
            fi
            sleep 0.25
          done
          test "$ready" = true
          echo "shizuku-server-pid=$(adb shell pidof shizuku_server | tr -d '\r')" | tee /tmp/shizuku-api37-pid.txt

      - name: Grant ReAppzuku through the real Shizuku manager flow
        shell: bash
        run: |
          set -euo pipefail
          adb shell am start -W -n moe.shizuku.privileged.api/moe.shizuku.manager.MainActivity \
            | tee /tmp/shizuku-manager-init.log
          manager_ready=false
          for i in $(seq 1 40); do
            if [ -n "$(adb shell pidof moe.shizuku.privileged.api 2>/dev/null | tr -d '\r' || true)" ]; then
              manager_ready=true
              break
            fi
            sleep 0.25
          done
          test "$manager_ready" = true
          sleep 2

          adb shell pm revoke com.gree1d.reappzuku moe.shizuku.manager.permission.API_V23 2>/dev/null || true
          adb shell am start -W -n com.gree1d.reappzuku/.ui.MainActivity | tee /tmp/shizuku-api37-app-start.log

          dialog=false
          for i in $(seq 1 120); do
            if adb shell dumpsys activity activities 2>/dev/null | \
                grep -q 'moe.shizuku.manager.authorization.RequestPermissionActivity'; then
              dialog=true
              break
            fi
            sleep 0.25
          done
          test "$dialog" = true

          adb shell uiautomator dump /sdcard/reappzuku-privshell37.xml >/dev/null
          adb shell cat /sdcard/reappzuku-privshell37.xml > /tmp/reappzuku-privshell37.xml
          python3 - <<'PY' > /tmp/shizuku-allow-coordinates
          import re
          xml = open('/tmp/reappzuku-privshell37.xml', encoding='utf-8').read()
          match = re.search(r'resource-id="android:id/button1"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml)
          if not match:
              raise SystemExit('Shizuku always-allow button not found in UI hierarchy')
          x1, y1, x2, y2 = map(int, match.groups())
          print((x1 + x2) // 2, (y1 + y2) // 2)
          PY
          read -r ALLOW_X ALLOW_Y < /tmp/shizuku-allow-coordinates
          adb shell input tap "$ALLOW_X" "$ALLOW_Y"

          granted=false
          for i in $(seq 1 120); do
            if adb shell dumpsys package com.gree1d.reappzuku | \
                grep -A20 'runtime permissions:' | \
                grep -q 'moe.shizuku.manager.permission.API_V23: granted=true'; then
              granted=true
              break
            fi
            sleep 0.25
          done
          test "$granted" = true
          adb shell dumpsys package com.gree1d.reappzuku | \
            grep -A20 'runtime permissions:' | tee /tmp/shizuku-api37-runtime-permissions.txt
          adb shell am force-stop com.gree1d.reappzuku || true

      - name: Exercise representative typed command families through real Shizuku
        shell: bash
        run: |
          set -euo pipefail
          output="$(adb shell am instrument -w \
            -e privilegedShellProbe true \
            -e class 'com.gree1d.reappzuku.core.PrivilegedShellRealShizukuInstrumentationTest#representativeMutatingFamiliesExecuteAndRollbackThroughRealShizuku' \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          clean="$(printf '%s\n' "$output" | tr -d '\r')"
          printf '%s\n' "$clean" | tee /tmp/privshell37-instrumentation.txt
          [[ "$clean" == *"OK (1 test)"* ]]
          adb shell pm path com.gree1d.reappzuku.probetarget | grep -q '^package:'
          if adb shell pm list packages -d com.gree1d.reappzuku.probetarget | grep -q com.gree1d.reappzuku.probetarget; then
            echo 'Disposable target remained disabled after rollback.' >&2
            exit 1
          fi
          if adb shell dumpsys package com.gree1d.reappzuku.probetarget | grep 'suspended=' | grep -q 'suspended=true'; then
            echo 'Disposable target remained suspended after rollback.' >&2
            exit 1
          fi
          if adb shell cmd deviceidle whitelist | grep -q com.gree1d.reappzuku.probetarget; then
            echo 'Disposable target remained in device-idle whitelist after rollback.' >&2
            exit 1
          fi
          echo 'API 37 representative PrivilegedShell command-family probe passed with rollback'

      - name: Collect evidence
        if: always()
        shell: bash
        run: |
          mkdir -p privshell37-evidence
          for f in /tmp/privshell37-emulator.log /tmp/install-shizuku.txt /tmp/install-app.txt /tmp/install-test.txt /tmp/install-target.txt /tmp/shizuku-api37-start.log /tmp/shizuku-api37-pid.txt /tmp/shizuku-manager-init.log /tmp/shizuku-api37-app-start.log /tmp/reappzuku-privshell37.xml /tmp/shizuku-api37-runtime-permissions.txt /tmp/privshell37-instrumentation.txt /tmp/probe-target-badging /tmp/app-badging; do
            [ ! -f "$f" ] || cp "$f" privshell37-evidence/
          done
          adb shell getprop ro.build.version.release > privshell37-evidence/android-release.txt 2>/dev/null || true
          adb shell getprop ro.build.version.sdk > privshell37-evidence/android-api.txt 2>/dev/null || true
          adb shell dumpsys package com.gree1d.reappzuku > privshell37-evidence/reappzuku-package.txt 2>/dev/null || true
          adb shell dumpsys package com.gree1d.reappzuku.probetarget > privshell37-evidence/probe-target-package.txt 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: privileged-shell-api37-evidence
          path: privshell37-evidence/
          retention-days: 7

      - name: Stop emulator
        if: always()
        shell: bash
        run: adb emu kill || true
