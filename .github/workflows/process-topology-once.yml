name: One-time API 36 main and Shizuku process topology probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build topology probe packages
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -f app/src/androidTest/java/com/gree1d/reappzuku/core/ProcessTopologyInstrumentationTest.java
          grep -Fq 'android:process=":shizuku"' app/src/main/AndroidManifest.xml
          grep -Fq 'Application.getProcessName()' app/src/main/java/com/gree1d/reappzuku/core/App.java

      - name: Boot stable Android 16 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$SDK_ROOT/platform-tools:$PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd --force --name reappzuku-api36-process-topology --package "system-images;android-36;google_apis;x86_64" --device pixel_6
          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          "$EMULATOR" -avd reappzuku-api36-process-topology -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -partition-size 4096 >/tmp/reappzuku-process-topology-emulator.log 2>&1 &
          adb_ready=false
          for i in $(seq 1 45); do "$ADB" get-state >/dev/null 2>&1 && { adb_ready=true; break; }; sleep 2; done
          test "$adb_ready" = true
          boot_ready=false
          for i in $(seq 1 90); do [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && { boot_ready=true; break; }; sleep 2; done
          test "$boot_ready" = true
          "$ADB" shell locksettings set-disabled true || true
          "$ADB" shell wm dismiss-keyguard || true
          "$ADB" shell input keyevent 82 || true

      - name: Install app, instrumentation and official Shizuku
        shell: bash
        run: |
          set -euo pipefail
          SHIZUKU_APK=/tmp/shizuku.apk
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 'https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk' -o "$SHIZUKU_APK"
          echo '6e273ab0e991c4e79bc8b1bbb9b9dd739ccac1a8712a541a214078886b7b790f  /tmp/shizuku.apk' | sha256sum -c -
          adb install -r "$SHIZUKU_APK"
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm grant com.gree1d.reappzuku moe.shizuku.manager.permission.API_V23

      - name: Configure provider-only mode inside ReAppzuku
        shell: bash
        run: |
          set -euo pipefail
          output="$(adb shell am instrument -w -e processTopologyProbe true -e class 'com.gree1d.reappzuku.core.ProcessTopologyInstrumentationTest#disableWakeReceiverForProviderOnlyProbe' com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          clean="$(printf '%s\n' "$output" | tr -d '\r')"
          printf '%s\n' "$clean"
          [[ "$clean" == *'OK (1 test)'* ]]
          adb shell am force-stop com.gree1d.reappzuku
          for i in $(seq 1 40); do
            main="$(adb shell pidof com.gree1d.reappzuku 2>/dev/null | tr -d '\r' || true)"
            provider="$(adb shell pidof 'com.gree1d.reappzuku:shizuku' 2>/dev/null | tr -d '\r' || true)"
            [ -z "$main" ] && [ -z "$provider" ] && exit 0
            sleep 0.25
          done
          exit 1

      - name: Prove provider-only Shizuku startup
        shell: bash
        run: |
          set -euo pipefail
          SHIZUKU_APK_PATH="$(adb shell pm path moe.shizuku.privileged.api | head -1 | sed 's/^package://' | tr -d '\r')"
          SHIZUKU_LIB="${SHIZUKU_APK_PATH%/*}/lib/x86_64/libshizuku.so"
          adb shell test -x "$SHIZUKU_LIB"
          adb shell "$SHIZUKU_LIB" | tee /tmp/shizuku-topology-start-1.log
          provider_ready=false
          for i in $(seq 1 100); do
            provider_pid="$(adb shell pidof 'com.gree1d.reappzuku:shizuku' 2>/dev/null | tr -d '\r' || true)"
            [ -n "$provider_pid" ] && { provider_ready=true; break; }
            sleep 0.25
          done
          test "$provider_ready" = true
          test -z "$(adb shell pidof com.gree1d.reappzuku 2>/dev/null | tr -d '\r' || true)"
          if adb shell dumpsys activity services com.gree1d.reappzuku | grep -Fq ShappkyService; then
            echo 'Foreground service unexpectedly started in provider-only state.' >&2
            exit 1
          fi
          old_server="$(adb shell pidof shizuku_server | tr -d '\r')"
          test -n "$old_server"
          printf '%s\n' "$old_server" >/tmp/topology-old-server
          echo "provider-only topology passed: :shizuku pid=$provider_pid main=absent"

      - name: Configure automatic wake inside ReAppzuku
        shell: bash
        run: |
          set -euo pipefail
          output="$(adb shell am instrument -w -e processTopologyProbe true -e class 'com.gree1d.reappzuku.core.ProcessTopologyInstrumentationTest#enableWakeReceiverForAutomaticWakeProbe' com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          clean="$(printf '%s\n' "$output" | tr -d '\r')"
          printf '%s\n' "$clean"
          [[ "$clean" == *'OK (1 test)'* ]]
          adb shell am force-stop com.gree1d.reappzuku

      - name: Prove Shizuku restart wakes normal process when enabled
        shell: bash
        run: |
          set -euo pipefail
          old_server="$(cat /tmp/topology-old-server)"
          adb shell kill "$old_server"
          dead=false
          for i in $(seq 1 40); do [ -z "$(adb shell pidof shizuku_server 2>/dev/null | tr -d '\r' || true)" ] && { dead=true; break; }; sleep 0.25; done
          test "$dead" = true
          SHIZUKU_APK_PATH="$(adb shell pm path moe.shizuku.privileged.api | head -1 | sed 's/^package://' | tr -d '\r')"
          SHIZUKU_LIB="${SHIZUKU_APK_PATH%/*}/lib/x86_64/libshizuku.so"
          adb shell "$SHIZUKU_LIB" | tee /tmp/shizuku-topology-start-2.log
          main_ready=false
          for i in $(seq 1 120); do
            main_pid="$(adb shell pidof com.gree1d.reappzuku 2>/dev/null | tr -d '\r' || true)"
            [ -n "$main_pid" ] && { main_ready=true; break; }
            sleep 0.25
          done
          test "$main_ready" = true
          provider_pid="$(adb shell pidof 'com.gree1d.reappzuku:shizuku' 2>/dev/null | tr -d '\r' || true)"
          new_server="$(adb shell pidof shizuku_server 2>/dev/null | tr -d '\r' || true)"
          test -n "$provider_pid"
          test -n "$new_server"
          test "$new_server" != "$old_server"
          echo "wake-enabled topology passed: main=$main_pid provider=$provider_pid Shizuku=$old_server->$new_server"

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          adb devices -l || true
          adb shell ps -A | grep -E 'reappzuku|shizuku' || true
          adb shell dumpsys package com.gree1d.reappzuku | head -280 || true
          adb shell dumpsys activity services com.gree1d.reappzuku | head -220 || true
          adb logcat -d | grep -E 'ReAppzuku|Shizuku|AndroidRuntime|FATAL EXCEPTION' | tail -800 || true
          tail -300 /tmp/reappzuku-process-topology-emulator.log || true
