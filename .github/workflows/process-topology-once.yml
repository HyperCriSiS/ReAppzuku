name: One-time API 36 main and Shizuku process topology probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build topology probe APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          grep -Fq 'android:process=":shizuku"' app/src/main/AndroidManifest.xml
          grep -Fq 'ProcessTopology.isShizukuProviderProcess' app/src/main/java/com/gree1d/reappzuku/core/App.java
          grep -Fq 'Application.getProcessName()' app/src/main/java/com/gree1d/reappzuku/core/App.java

      - name: Boot stable Android 16 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$SDK_ROOT/platform-tools:$PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd --force \
            --name reappzuku-api36-process-topology \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_6
          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          "$EMULATOR" -avd reappzuku-api36-process-topology \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -partition-size 4096 \
            >/tmp/reappzuku-process-topology-emulator.log 2>&1 &
          echo $! >/tmp/reappzuku-process-topology-emulator.pid
          adb_ready=false
          for i in $(seq 1 45); do
            if "$ADB" get-state >/dev/null 2>&1; then adb_ready=true; break; fi
            sleep 2
          done
          test "$adb_ready" = true
          boot_ready=false
          for i in $(seq 1 90); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then boot_ready=true; break; fi
            sleep 2
          done
          test "$boot_ready" = true
          "$ADB" shell locksettings set-disabled true || true
          "$ADB" shell wm dismiss-keyguard || true
          "$ADB" shell input keyevent 82 || true

      - name: Install app and official Shizuku
        shell: bash
        run: |
          set -euo pipefail
          SHIZUKU_URL='https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk'
          SHIZUKU_APK='/tmp/shizuku-v13.6.0.r1086.2650830c-release.apk'
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 "$SHIZUKU_URL" -o "$SHIZUKU_APK"
          echo '6e273ab0e991c4e79bc8b1bbb9b9dd739ccac1a8712a541a214078886b7b790f  /tmp/shizuku-v13.6.0.r1086.2650830c-release.apk' | sha256sum -c -
          adb install -r "$SHIZUKU_APK"
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant com.gree1d.reappzuku moe.shizuku.manager.permission.API_V23
          test -z "$(adb shell pidof com.gree1d.reappzuku 2>/dev/null | tr -d '\r' || true)"
          test -z "$(adb shell pidof 'com.gree1d.reappzuku:shizuku' 2>/dev/null | tr -d '\r' || true)"

      - name: Prove on-demand mode starts provider process without main process
        shell: bash
        run: |
          set -euo pipefail
          COMPONENT='com.gree1d.reappzuku/com.gree1d.reappzuku.core.ShizukuWakeReceiver'
          adb shell pm disable --user 0 "$COMPONENT" | tee /tmp/topology-disable-wake.txt

          SHIZUKU_APK_PATH="$(adb shell pm path moe.shizuku.privileged.api | head -1 | sed 's/^package://' | tr -d '\r')"
          SHIZUKU_CODE_DIR="${SHIZUKU_APK_PATH%/*}"
          SHIZUKU_LIB="$SHIZUKU_CODE_DIR/lib/x86_64/libshizuku.so"
          adb shell test -x "$SHIZUKU_LIB"
          adb shell "$SHIZUKU_LIB" | tee /tmp/shizuku-topology-start-1.log

          provider_ready=false
          for i in $(seq 1 80); do
            provider_pid="$(adb shell pidof 'com.gree1d.reappzuku:shizuku' 2>/dev/null | tr -d '\r' || true)"
            if [ -n "$provider_pid" ]; then provider_ready=true; break; fi
            sleep 0.25
          done
          test "$provider_ready" = true
          test -z "$(adb shell pidof com.gree1d.reappzuku 2>/dev/null | tr -d '\r' || true)"
          if adb shell dumpsys activity services com.gree1d.reappzuku | grep -Fq 'ShappkyService'; then
            echo 'Foreground service unexpectedly started in on-demand provider-only state.' >&2
            exit 1
          fi
          printf '%s\n' "$provider_pid" > /tmp/provider-pid-before
          echo "provider-only topology passed: :shizuku pid=$provider_pid main=absent"

      - name: Prove enabled wake receiver starts normal process after Shizuku restart
        shell: bash
        run: |
          set -euo pipefail
          COMPONENT='com.gree1d.reappzuku/com.gree1d.reappzuku.core.ShizukuWakeReceiver'
          adb shell pm enable --user 0 "$COMPONENT" | tee /tmp/topology-enable-wake.txt

          old_server="$(adb shell pidof shizuku_server 2>/dev/null | tr -d '\r' || true)"
          test -n "$old_server"
          adb shell kill "$old_server"
          dead=false
          for i in $(seq 1 40); do
            if [ -z "$(adb shell pidof shizuku_server 2>/dev/null | tr -d '\r' || true)" ]; then dead=true; break; fi
            sleep 0.25
          done
          test "$dead" = true

          SHIZUKU_APK_PATH="$(adb shell pm path moe.shizuku.privileged.api | head -1 | sed 's/^package://' | tr -d '\r')"
          SHIZUKU_CODE_DIR="${SHIZUKU_APK_PATH%/*}"
          SHIZUKU_LIB="$SHIZUKU_CODE_DIR/lib/x86_64/libshizuku.so"
          adb shell "$SHIZUKU_LIB" | tee /tmp/shizuku-topology-start-2.log

          main_ready=false
          for i in $(seq 1 100); do
            main_pid="$(adb shell pidof com.gree1d.reappzuku 2>/dev/null | tr -d '\r' || true)"
            if [ -n "$main_pid" ]; then main_ready=true; break; fi
            sleep 0.25
          done
          test "$main_ready" = true
          provider_pid="$(adb shell pidof 'com.gree1d.reappzuku:shizuku' 2>/dev/null | tr -d '\r' || true)"
          test -n "$provider_pid"
          new_server="$(adb shell pidof shizuku_server 2>/dev/null | tr -d '\r' || true)"
          test -n "$new_server"
          test "$new_server" != "$old_server"
          echo "wake-enabled topology passed: main pid=$main_pid :shizuku pid=$provider_pid Shizuku $old_server->$new_server"

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          adb devices -l || true
          adb shell ps -A | grep -E 'reappzuku|shizuku' || true
          adb shell dumpsys package com.gree1d.reappzuku | head -260 || true
          adb shell dumpsys activity services com.gree1d.reappzuku | head -220 || true
          adb logcat -d | grep -E 'ReAppzuku|Shizuku|AndroidRuntime|FATAL EXCEPTION' | tail -700 || true
          tail -300 /tmp/reappzuku-process-topology-emulator.log || true
