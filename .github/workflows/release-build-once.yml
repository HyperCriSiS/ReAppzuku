name: One-time unsigned release build gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Validate minified release build with ephemeral CI key
        shell: bash
        env:
          KEYSTORE_PASSWORD: reappzuku-ci-only
          KEY_ALIAS: ci-release-probe
          KEY_PASSWORD: reappzuku-ci-only
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=ReAppzuku CI Release Probe,O=ReAppzuku,C=DE'
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          badging="$($AAPT dump badging "${apks[0]}" | head -1)"
          printf '%s\n' "$badging"
          grep -Fq "package: name='com.gree1d.reappzuku'" <<<"$badging"
          "$APKSIGNER" verify --verbose "${apks[0]}"
          echo "release-apk=${apks[0]}"
          rm -f app/release.keystore
