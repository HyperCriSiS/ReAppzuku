name: One-time full lint report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Print complete lint report
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew lintDebug
          status=$?
          report='app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt'
          if [[ -f "$report" ]]; then
            echo '===== FULL LINT REPORT ====='
            cat "$report"
          else
            echo 'Lint report not found' >&2
          fi
          exit "$status"
