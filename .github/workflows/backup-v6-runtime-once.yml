name: One-time API 36 backup v6 runtime gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-v6-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ondemand-shizuku
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build app and instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Prepare stable Android 16 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd --force \
            --name reappzuku-api36-backup-v6 \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_6
          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          "$EMULATOR" -avd reappzuku-api36-backup-v6 \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -partition-size 4096 \
            >/tmp/reappzuku-api36-backup-v6.log 2>&1 &
          EMULATOR_PID=$!

          adb_ready=false
          for i in $(seq 1 45); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              tail -250 /tmp/reappzuku-api36-backup-v6.log || true
              exit 1
            fi
            if "$ADB" get-state >/dev/null 2>&1; then
              adb_ready=true
              break
            fi
            sleep 2
          done
          test "$adb_ready" = true

          boot_ready=false
          for i in $(seq 1 90); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              boot_ready=true
              break
            fi
            sleep 2
          done
          test "$boot_ready" = true

          "$ADB" shell input keyevent 82 || true
          unlocked=false
          for i in $(seq 1 45); do
            state="$("$ADB" shell cmd user get-user-state 0 2>/dev/null | tr -d '\r' || true)"
            if printf '%s' "$state" | grep -Fq 'RUNNING_UNLOCKED'; then
              unlocked=true
              break
            fi
            sleep 2
          done
          test "$unlocked" = true
          test "$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r')" = "36"
          "$ADB" shell settings put global window_animation_scale 0 || true
          "$ADB" shell settings put global transition_animation_scale 0 || true
          "$ADB" shell settings put global animator_duration_scale 0 || true
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install APKs
        shell: bash
        run: |
          set -euo pipefail
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm list packages | grep -F 'package:com.gree1d.reappzuku'
          adb shell pm list packages | grep -F 'package:com.gree1d.reappzuku.test'

      - name: Execute focused BackupManager restore suite
        shell: bash
        run: |
          set -euo pipefail
          output="$(adb shell am instrument -w \
            -e class com.gree1d.reappzuku.core.BackupManagerRestoreTest \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          clean="$(printf '%s\n' "$output" | tr -d '\r')"
          printf '%s\n' "$clean"
          grep -Eq 'OK \([0-9]+ tests?\)' <<<"$clean"
          ! grep -Fq 'FAILURES!!!' <<<"$clean"
          echo 'BACKUP_V6_RUNTIME_OK'

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          adb devices -l || true
          adb shell getprop ro.build.version.sdk || true
          adb shell cmd user get-user-state 0 || true
          adb shell dumpsys package com.gree1d.reappzuku | head -180 || true
          find app/build/outputs/androidTest-results -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null || true
          tail -180 /tmp/reappzuku-api36-backup-v6.log 2>/dev/null || true
