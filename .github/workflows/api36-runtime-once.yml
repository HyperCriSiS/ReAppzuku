name: One-time API 36 Android runtime gate

on:
  push:
    branches: [ondemand-shizuku]

permissions:
  contents: read

jobs:
  android-runtime:
    if: contains(github.event.head_commit.message, '[api36-runtime-gate]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build app and instrumentation APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Prepare stable Android 16 emulator
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
          test -x "$ADB"
          test -x "$EMULATOR"
          echo no | "$AVDMANAGER" create avd --force \
            --name reappzuku-api36 \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_6
          echo "AVD home: $ANDROID_AVD_HOME"
          "$EMULATOR" -list-avds
          find "$ANDROID_AVD_HOME" -maxdepth 2 \( -type f -o -type d \) | sort | head -100
          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          "$EMULATOR" -avd reappzuku-api36 \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -partition-size 4096 -verbose \
            > /tmp/reappzuku-emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "emulator_pid=$EMULATOR_PID"

          adb_ready=false
          for i in $(seq 1 45); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited before ADB became ready"
              tail -300 /tmp/reappzuku-emulator.log || true
              exit 1
            fi
            if "$ADB" get-state >/dev/null 2>&1; then
              adb_ready=true
              break
            fi
            sleep 2
          done
          if [ "$adb_ready" != true ]; then
            echo "ADB did not see the emulator within 90 seconds"
            "$ADB" devices -l || true
            ps -ef | grep -E '[e]mulator|[q]emu' || true
            tail -300 /tmp/reappzuku-emulator.log || true
            exit 1
          fi

          boot_ready=false
          for i in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited during Android boot"
              tail -300 /tmp/reappzuku-emulator.log || true
              exit 1
            fi
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              boot_ready=true
              break
            fi
            sleep 2
          done
          if [ "$boot_ready" != true ]; then
            echo "Android did not complete boot within 180 seconds"
            "$ADB" devices -l || true
            tail -300 /tmp/reappzuku-emulator.log || true
            exit 1
          fi

          "$ADB" shell input keyevent 82 || true
          "$ADB" shell settings put global window_animation_scale 0 || true
          "$ADB" shell settings put global transition_animation_scale 0 || true
          "$ADB" shell settings put global animator_duration_scale 0 || true
          "$ADB" shell getprop ro.build.version.sdk
          "$ADB" shell dumpsys user | grep -E "RUNNING_UNLOCKED|state=RUNNING_UNLOCKED" || true
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
      - name: Execute Android instrumentation suite
        run: |
          set -euo pipefail
          ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Capture emulator diagnostics on failure
        if: failure()
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          "$ADB" devices -l || true
          "$ADB" shell getprop sys.boot_completed || true
          "$ADB" shell dumpsys package com.gree1d.reappzuku | head -200 || true
          tail -300 /tmp/reappzuku-emulator.log || true
