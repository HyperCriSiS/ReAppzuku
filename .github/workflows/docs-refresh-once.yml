name: One-time assurance documentation refresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout roadmap branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: true

      - name: Refresh runtime evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {text.count(old)}')
              return text.replace(old, new, 1)

          p = Path('docs/ROADMAP.md')
          s = p.read_text()
          replacements = [
              ('- [ ] Fresh Shizuku permission flow: launch without grant, grant later, list loads only after backend is ready.',
               '- [x] Fresh Shizuku permission flow: API-36 run `34000092714` cold-started a cleared, explicitly ungranted ReAppzuku against the official Shizuku server/manager, observed the real authorization dialog, proved no app scan started before grant, then observed permission result -> `SHIZUKU_READY` -> app scan in order.'),
              ('- [~] AutoKill disable survives restart recovery: API-36 instrumentation proves a fresh restart receiver obeys persisted disabled state; an OS-level process kill/force-stop probe is still required.',
               '- [~] AutoKill disable survives restart recovery: API-36 instrumentation proves a fresh restart receiver obeys persisted disabled state and real reboot recovery passes; the separate external OS force-stop desired-state subprobe in run `33985971887` did not pass and remains the open P0 process-death case.'),
              ('- [~] Reboot reconciliation is idempotent: repeated `BootReceiver` execution on API 36 leaves only one active AutoKill, Smart Lifecycle and boot-cleanup Unique Work instance; a physical reboot with alarm reconstruction is still required.',
               '- [x] Reboot reconciliation is idempotent on the stable API-36 emulator: repeated `BootReceiver` execution is Unique-Work safe, and real OS reboot run `33985971887` passed reboot/unlock/post-boot recovery with Restrictions Scheduler plus preset activate/deactivate alarms reconstructed. Physical/OEM devices remain release-diversity evidence, not an implementation blocker.'),
              ('- [ ] Backup/restore round-trip on a real device, including App Behavior settings and preset state; API-36 transactional fault-injection and active-preset reconciliation already pass.',
               '- [~] Backup/restore round-trip now passes through a real Android MediaStore `content://` URI on API 36 in run `34000092714`, including export/import/restore on the production backup path; physical/OEM document-provider UI remains release-diversity evidence.'),
              ('- [~] Instrument binder-late, deny -> grant, Activity recreation and Shizuku restart/service-death recovery: API-36 test-bridge coverage now proves binder-late, deny -> grant, listener removal/rebind and binder-death -> return; a real Shizuku-daemon first-run/restart probe remains.',
               '- [~] Instrument binder-late, deny -> grant, Activity recreation and Shizuku restart/service-death recovery: deterministic API-36 bridge coverage proves the state permutations; real official-Shizuku first-run grant is proven by `34000092714`, and same-process daemon death/rebind plus privileged command recovery is proven by `33997372602`. Activity recreation while the real permission dialog is open remains the narrow untested permutation.'),
              ('- [ ] Add event-driven UI recovery when Shizuku appears after MainActivity is already open if live testing shows the current callback chain is insufficient.',
               '- [x] Add event-driven UI recovery when Shizuku appears after MainActivity is already open. Real first-run testing exposed a lost late-Binder race; commit `ba73b39e4e47e75a19ac2a01a120a69854e19f30`, guarded by run `33999924081`, adds sticky Binder-triggered preparation plus a coalesced retry, and run `34000092714` proves the repaired flow end-to-end.'),
              ('- API-36 runtime gate `33974637281` executed the complete restore suite successfully. A user-facing file import/export round-trip on a physical device remains a separate release-validation item.',
               '- API-36 runtime gate `33974637281` executed the complete transactional restore suite successfully. Run `34000092714` additionally passed a real Android MediaStore `content://` export/import/restore round-trip; physical/OEM document-provider UI remains separate release-diversity validation.'),
              ('- These are source/JVM/CI invariants; live Shizuku/root execution probes remain separate Android evidence.',
               '- These source/JVM/CI invariants are now supplemented by real official-Shizuku UserService execution and daemon death/rebind recovery in API-36 run `33997372602`; root-specific execution and broader representative command-family probes remain separate evidence.'),
              ('### Stable Android 16 / API 36 runtime evidence — 2026-09-05',
               '### Stable Android 16 / API 36 runtime evidence — 2026-09-05 to 2026-09-06'),
              ('- This stable API-36 lane is now the repeatable Android-runtime baseline. Physical-device Shizuku, OS process-death, real reboot, installed-update and backup-file round-trip probes remain release evidence; API 37 remains separately blocked by the preview PackageManager transport failure.',
               '- Real OS reboot run `33985971887` passed reboot/unlock/post-boot recovery and reconstructed scheduler/preset alarms; its later external force-stop desired-state subprobe failed, so that process-death case remains open.\n- Run `33986395874` passed the explicit-intent exported-shortcut abuse step before an unrelated later Shizuku-recovery failure.\n- Run `33997372602` then proved the official Shizuku UserService, shell UID execution, daemon death detection, same-process rebind after server restart and post-recovery privileged command execution.\n- Run `34000092714` proved the fresh official-Shizuku permission dialog path with no pre-grant app scan and then passed the real MediaStore `content://` backup round-trip.\n- This stable API-36 lane is now the repeatable Android-runtime baseline. Remaining release-diversity gaps are the external app force-stop/process-death case, physical/OEM variation, installed-update/signing identity and root-specific execution; API 37 remains separately blocked by the preview PackageManager transport failure.')
          ]
          for i, (old, new) in enumerate(replacements):
              s = replace_once(s, old, new, f'ROADMAP replacement {i}')
          p.write_text(s)

          p = Path('docs/CHECK_MATRIX.md')
          s = p.read_text()
          replacements = [
              ('> Audit baseline: `ondemand-shizuku`, refreshed 2026-09-05.',
               '> Audit baseline: `ondemand-shizuku`, refreshed 2026-09-06.'),
              ('| A01 | Privilege bootstrap: Root / Shizuku / permission | DECIDED | API-36 instrumentation covers binder-late, deny→grant, listener removal and binder-death/rebind through the bridge contract; real Shizuku first-run/restart evidence remains open. |',
               '| A01 | Privilege bootstrap: Root / Shizuku / permission | DECIDED | Deterministic API-36 bridge tests cover state permutations, while run `34000092714` proves a fresh ungranted app against the official Shizuku server/manager waits for the real dialog and reaches READY only after grant; physical/OEM and root remain separate diversity paths. |'),
              ('| A03 | Privileged shell / Shizuku UserService | DECIDED | Readiness/death/rebind state is instrumented and mutating commands are isolated behind validated `PrivilegedShell`; live execution against real Shizuku/root remains open. |',
               '| A03 | Privileged shell / Shizuku UserService | DECIDED | Readiness/death/rebind state is instrumented, mutating commands are isolated behind validated `PrivilegedShell`, and run `33997372602` proves real official-Shizuku UserService execution plus daemon-death/rebind recovery; root-specific execution remains open. |'),
              ('| A05 | Manual restrictions / freeze / force-stop / app ops | DECIDED | High-impact mutating operations use typed/validated `PrivilegedShell`, with injection tests and a repository-wide raw mutating-shell audit; live privileged execution remains open. |',
               '| A05 | Manual restrictions / freeze / force-stop / app ops | DECIDED | High-impact mutating operations use typed/validated `PrivilegedShell`, with injection tests and a repository-wide raw mutating-shell audit; real Shizuku privileged execution is proven, while representative live coverage of every command family remains open. |'),
              ('| A06 | AutoKill / `ShappkyService` / periodic worker | DECIDED | API-36 instrumentation proves a fresh restart receiver obeys persisted disabled state; an OS-level process-kill/force-stop probe remains. |',
               '| A06 | AutoKill / `ShappkyService` / periodic worker | DECIDED | API-36 instrumentation proves a fresh restart receiver obeys persisted disabled state and real reboot recovery succeeds; the external OS force-stop desired-state subprobe in `33985971887` failed and remains open. |'),
              ('| A09 | Presets / Restrictions Scheduler / exact alarms | DECIDED | Exact-alarm denial fallback and repeated boot WorkManager reconciliation pass on API 36; physical reboot/alarm reconstruction remains open. |',
               '| A09 | Presets / Restrictions Scheduler / exact alarms | DECIDED | Exact-alarm denial fallback, repeated boot WorkManager reconciliation and real API-36 OS reboot with scheduler/preset alarm reconstruction pass; physical/OEM variation remains release-diversity evidence. |'),
              ('| A11 | Boot / process death / restart / recovery | **RISK-P0** | Desired-state restart dominance and repeated BootReceiver WorkManager idempotency now pass on API 36, but real OS process death and physical reboot recovery remain unproven. |',
               '| A11 | Boot / process death / restart / recovery | **RISK-P0** | Real API-36 OS reboot recovery and real Shizuku daemon death/rebind now pass, but the external app force-stop/process-death desired-state subprobe remains unproven and keeps this surface P0. |'),
              ('| A13 | Backup / restore | DECIDED | API-36 instrumentation passes transactional rollback fault injection, legacy/future/malformed bounds and active-preset reconciliation; physical user-facing file round-trip remains open. |',
               '| A13 | Backup / restore | DECIDED | API-36 instrumentation passes transactional rollback fault injection, legacy/future/malformed bounds and active-preset reconciliation, and `34000092714` passes a real MediaStore `content://` export/import/restore round-trip; physical/OEM provider UI remains release-diversity evidence. |'),
              ('| A16 | Exported surfaces: shortcuts / tiles / receivers / widget | DECIDED | Shortcut confused-deputy path is hardened and all exported principals are documented; repeatable abuse probes remain pending. |',
               '| A16 | Exported surfaces: shortcuts / tiles / receivers / widget | DECIDED | Shortcut confused-deputy path is hardened, all exported principals are documented, and the explicit-intent shortcut abuse step passed in `33986395874`; broader entrypoint abuse coverage remains separate. |'),
              ('- **CM-P0-01:** implementation fixed. API-36 instrumentation now proves a newly constructed\n  restart receiver re-reads persisted desired state and cannot undo an intentional Auto-Kill disable;\n  an OS-level process-kill/force-stop probe is still required.',
               '- **CM-P0-01:** implementation fixed at source/instrumentation level. API-36 instrumentation proves a newly constructed\n  restart receiver re-reads persisted desired state and cannot undo an intentional Auto-Kill disable;\n  real reboot recovery passes, but the external OS force-stop desired-state subprobe in `33985971887` failed and remains the P0 runtime gap.'),
              ('- **CM-P0-03:** state model/readiness gating is now API-36 instrumented for binder-late,\n  deny→grant, listener removal followed by grant, and binder-death→return/rebind. A real Shizuku\n  daemon first-run/restart probe remains open.',
               '- **CM-P0-03:** state model/readiness gating is API-36 instrumented for binder-late, deny→grant,\n  listener removal followed by grant, and binder-death→return/rebind. Run `34000092714` proves the real\n  official-Shizuku first-run permission flow, while `33997372602` proves daemon death/restart and same-process rebind. Real permission-dialog Activity recreation and root remain open permutations.'),
              ('- **CM-P1-01 / CM-P1-02:** boot preset recovery and one central exact-alarm capability are\n  implemented. API-36 runtime proves denied-exact-alarm best-effort fallback plus repeated\n  BootReceiver WorkManager idempotency; physical reboot/alarm reconstruction remains open.',
               '- **CM-P1-01 / CM-P1-02:** boot preset recovery and one central exact-alarm capability are\n  implemented. API-36 runtime proves denied-exact-alarm best-effort fallback plus repeated\n  BootReceiver WorkManager idempotency, and run `33985971887` proves real OS reboot recovery with scheduler/preset alarm reconstruction; physical/OEM variation remains release-diversity evidence.'),
              ('- **CM-P1-03:** restore is validate-first, bounded, future-version aware and transactional with\n  rollback. API-36 instrumentation passes injected failure after the main commit, failure after the\n  first preset commit, rollback restoration and imported active-preset reconciliation. A physical\n  user-facing backup file round-trip remains open.',
               '- **CM-P1-03:** restore is validate-first, bounded, future-version aware and transactional with\n  rollback. API-36 instrumentation passes injected durable failures and imported active-preset reconciliation,\n  and run `34000092714` passes a real Android MediaStore `content://` export/import/restore round-trip. Physical/OEM document-provider UI remains release-diversity evidence.'),
              ('- **CM-P1-10:** exported shortcut privilege boundary is authenticated/confirmed and remaining\n  exported principals are documented in `EXPORTED_COMPONENTS.md`.',
               '- **CM-P1-10:** exported shortcut privilege boundary is authenticated/confirmed, remaining\n  exported principals are documented in `EXPORTED_COMPONENTS.md`, and the explicit-intent shortcut abuse step passed in run `33986395874`.'),
              ('- **CM-P2-02:** mutating package/component/PID operations now route through `PrivilegedShell` with\n  typed enums/validated identifiers. Strict run `33946348081` required the repository-wide raw\n  mutating-shell audit to return `NONE` outside that boundary; Android execution evidence remains open.',
               '- **CM-P2-02:** mutating package/component/PID operations now route through `PrivilegedShell` with\n  typed enums/validated identifiers. Strict run `33946348081` required the repository-wide raw\n  mutating-shell audit to return `NONE` outside that boundary; run `33997372602` proves real Shizuku privileged execution/recovery, while root and representative per-command-family live coverage remain open.'),
              ('- workflow run `33974469090`: normal validation passed for stale service-restart desired-state dominance;',
               '- workflow run `34000313640`: strict monotone lint cleanup removed exactly one stale baseline issue, kept the four current warnings visible, and passed unit/lint/AndroidTest/APK validation before commit `9fc85bd`;\n- workflow run `34000092714`: fresh official-Shizuku ungranted→dialog→grant→READY→scan ordering and real MediaStore `content://` backup round-trip passed on API 36;\n- commit `ba73b39e4e47e75a19ac2a01a120a69854e19f30`: event-driven late-Binder recovery, source-gated by run `33999924081`;\n- workflow run `33997372602`: official Shizuku UserService shell execution, daemon death detection, restart, same-process rebind and post-recovery command passed;\n- workflow run `33986395874`: explicit-intent exported-shortcut abuse step passed before a later unrelated Shizuku-recovery failure;\n- workflow run `33985971887`: real API-36 OS reboot/unlock/post-boot recovery and alarm reconstruction passed, while its later external force-stop desired-state subprobe failed and remains open;\n- workflow run `33974469090`: normal validation passed for stale service-restart desired-state dominance;'),
              ('**Maintainability status:** the named high-risk seams have explicit `PrivilegedShell`, parser/protection/background policy, `Clock`/`ScheduleTime`, `AlarmScheduler` and `BackupCodec` boundaries. API-36 runtime evidence now covers several recovery/storage invariants; real Shizuku/root execution, OS process death, physical reboot, OEM parser behavior and installed-release probes remain open.',
               '**Maintainability status:** the named high-risk seams have explicit `PrivilegedShell`, parser/protection/background policy, `Clock`/`ScheduleTime`, `AlarmScheduler` and `BackupCodec` boundaries. API-36 runtime now covers real Shizuku first-run/UserService/daemon recovery, real OS reboot/alarm reconstruction, shortcut abuse and MediaStore backup I/O. External app force-stop/process death, root, physical/OEM diversity, OEM parser behavior and installed-release/signing probes remain open.')
          ]
          for i, (old, new) in enumerate(replacements):
              s = replace_once(s, old, new, f'CHECK_MATRIX replacement {i}')
          p.write_text(s)
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'docs/CHECK_MATRIX.md\ndocs/ROADMAP.md'
          test "$changed" = "$expected"
          git diff -- docs/ROADMAP.md docs/CHECK_MATRIX.md

      - name: Commit documentation only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md docs/CHECK_MATRIX.md
          test "$(git diff --cached --name-only | sort)" = $'docs/CHECK_MATRIX.md\ndocs/ROADMAP.md'
          git commit -m 'Refresh runtime assurance evidence'
          git push origin HEAD:ondemand-shizuku
