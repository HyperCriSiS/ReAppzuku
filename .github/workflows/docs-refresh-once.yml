name: One-time assurance docs refresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          fetch-depth: 1
      - name: Apply reviewed evidence patch
        shell: bash
        env:
          PATCH_GZ_B64: 
        run: |
          test "$(git rev-parse HEAD:docs/CHECK_MATRIX.md)" = "e263af2efbf4f1a603a8730931e32c7e97458a32"
          test "$(git rev-parse HEAD:docs/ROADMAP.md)" = "09f7635072e7cde2d19fc483b231e00f3f700fc4"
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/docs.patch
          git apply --check /tmp/docs.patch
          git apply /tmp/docs.patch
          git diff --check
          grep -q '34163432363' docs/CHECK_MATRIX.md
          grep -q '34163189731' docs/ROADMAP.md
          git config user.name HyperCriSiS
          git config user.email dev.github@w3b.world
          git add docs/CHECK_MATRIX.md docs/ROADMAP.md
          git commit -m 'Refresh security and reliability evidence'
          git push origin HEAD:ondemand-shizuku
