name: One-time representative PrivilegedShell API 36 probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privileged-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build app, instrumentation and disposable target
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          test -f app/src/androidTest/java/com/gree1d/reappzuku/core/PrivilegedShellRealShizukuInstrumentationTest.java
          cp app/build.gradle /tmp/reappzuku-build.gradle
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle')
          text = path.read_text(encoding='utf-8')
          old = 'applicationId = "com.gree1d.reappzuku"'
          new = 'applicationId = "com.gree1d.reappzuku.probetarget"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one applicationId declaration, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/reappzuku-probe-target.apk
          cp /tmp/reappzuku-build.gradle app/build.gradle
          ./gradlew clean assembleDebug assembleDebugAndroidTest
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging /tmp/reappzuku-probe-target.apk | head -1 | tee /tmp/probe-target-badging
          grep -Fq "package: name='com.gree1d.reappzuku.probetarget'" /tmp/probe-target-badging
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | head -1 | tee /tmp/app-badging
          grep -Fq "package: name='com.gree1d.reappzuku'" /tmp/app-badging
      - name: Boot stable Android 16 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$SDK_ROOT/platform-tools:$PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd --force \
            --name reappzuku-api36-privileged-shell \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_6
          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          "$EMULATOR" -avd reappzuku-api36-privileged-shell \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -partition-size 4096 \
            >/tmp/reappzuku-privileged-shell-emulator.log 2>&1 &
          echo $! >/tmp/reappzuku-privileged-shell-emulator.pid
          adb_ready=false
          for i in $(seq 1 45); do
            if "$ADB" get-state >/dev/null 2>&1; then adb_ready=true; break; fi
            sleep 2
          done
          test "$adb_ready" = true
          boot_ready=false
          for i in $(seq 1 90); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then boot_ready=true; break; fi
            sleep 2
          done
          test "$boot_ready" = true
          "$ADB" shell locksettings set-disabled true || true
          "$ADB" shell wm dismiss-keyguard || true
          "$ADB" shell input keyevent 82 || true
      - name: Install official Shizuku and probe packages
        shell: bash
        run: |
          set -euo pipefail
          SHIZUKU_URL='https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk'
          SHIZUKU_APK='/tmp/shizuku-v13.6.0.r1086.2650830c-release.apk'
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 "$SHIZUKU_URL" -o "$SHIZUKU_APK"
          echo '6e273ab0e991c4e79bc8b1bbb9b9dd739ccac1a8712a541a214078886b7b790f  /tmp/shizuku-v13.6.0.r1086.2650830c-release.apk' | sha256sum -c -
          adb install -r "$SHIZUKU_APK"
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb install -r /tmp/reappzuku-probe-target.apk
          adb shell pm clear com.gree1d.reappzuku
          adb shell pm grant com.gree1d.reappzuku moe.shizuku.manager.permission.API_V23
          adb shell pm path com.gree1d.reappzuku.probetarget | grep -q '^package:'
      - name: Start real Shizuku daemon
        shell: bash
        run: |
          set -euo pipefail
          SHIZUKU_APK_PATH="$(adb shell pm path moe.shizuku.privileged.api | head -1 | sed 's/^package://' | tr -d '\r')"
          SHIZUKU_CODE_DIR="${SHIZUKU_APK_PATH%/*}"
          SHIZUKU_LIB="$SHIZUKU_CODE_DIR/lib/x86_64/libshizuku.so"
          adb shell test -x "$SHIZUKU_LIB"
          adb shell "$SHIZUKU_LIB" | tee /tmp/shizuku-privileged-shell-start.log
          ready=false
          for i in $(seq 1 40); do
            if [ -n "$(adb shell pidof shizuku_server 2>/dev/null | tr -d '\r' || true)" ]; then ready=true; break; fi
            sleep 0.25
          done
          test "$ready" = true
          echo "shizuku-server-pid=$(adb shell pidof shizuku_server | tr -d '\r')"
      - name: Exercise representative typed command families
        shell: bash
        run: |
          set -euo pipefail
          output="$(adb shell am instrument -w \
            -e privilegedShellProbe true \
            -e class 'com.gree1d.reappzuku.core.PrivilegedShellRealShizukuInstrumentationTest#representativeMutatingFamiliesExecuteAndRollbackThroughRealShizuku' \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          clean="$(printf '%s\n' "$output" | tr -d '\r')"
          printf '%s\n' "$clean"
          [[ "$clean" == *"OK (1 test)"* ]]
          adb shell pm path com.gree1d.reappzuku.probetarget | grep -q '^package:'
          if adb shell pm list packages -d com.gree1d.reappzuku.probetarget | grep -q com.gree1d.reappzuku.probetarget; then
            echo 'Disposable target remained disabled after rollback.' >&2
            exit 1
          fi
          if adb shell dumpsys package com.gree1d.reappzuku.probetarget | grep -m1 'suspended=' | grep -q 'suspended=true'; then
            echo 'Disposable target remained suspended after rollback.' >&2
            exit 1
          fi
          if adb shell cmd deviceidle whitelist | grep -q com.gree1d.reappzuku.probetarget; then
            echo 'Disposable target remained in device-idle whitelist after rollback.' >&2
            exit 1
          fi
          echo 'representative PrivilegedShell command-family probe passed with rollback'
      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          adb devices -l || true
          adb shell dumpsys package com.gree1d.reappzuku | head -180 || true
          adb shell dumpsys package com.gree1d.reappzuku.probetarget | head -220 || true
          adb logcat -d | grep -E 'ReAppzuku|Shizuku|AndroidRuntime|FATAL EXCEPTION' | tail -500 || true
          tail -250 /tmp/reappzuku-privileged-shell-emulator.log || true
