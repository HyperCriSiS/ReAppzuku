name: One-time platform baseline diff repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout topic branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: roadmap/remove-obsolete-sdk-branches
          fetch-depth: 2
      - name: Restore baseline formatting and remove only resolved entries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6402d90dcaef6067da9012144740f34b17d1d2ce"
          path='app/lint-baseline.xml'
          git checkout HEAD^ -- "$path"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/lint-baseline.xml')
          text = p.read_text()
          removed = {}
          for issue_id, expected in [('ObsoleteSdkInt', 6), ('InlinedApi', 1)]:
              pattern = re.compile(r'\n    <issue\n        id="' + re.escape(issue_id) + r'".*?\n    </issue>\n', re.S)
              text, count = pattern.subn('\n', text)
              removed[issue_id] = count
              if count != expected:
                  raise SystemExit(f'{issue_id}: expected {expected}, removed {count}')
          p.write_text(text)
          PY
          git diff --check
          ! grep -q 'id="ObsoleteSdkInt"' "$path"
          ! grep -q 'id="InlinedApi"' "$path"
          # Only baseline should differ from the current topic HEAD in this repair commit.
          test "$(git diff --name-only)" = "$path"
          git config user.name HyperCriSiS
          git config user.email dev.github@w3b.world
          git add "$path"
          git commit -m 'Preserve lint baseline formatting while removing resolved API findings'
          git push origin HEAD:roadmap/remove-obsolete-sdk-branches
