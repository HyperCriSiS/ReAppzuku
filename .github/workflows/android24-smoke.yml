name: Android 7 API 24 minimum SDK smoke

on:
  workflow_dispatch:
    inputs:
      product_ref:
        description: Product branch or commit to test
        required: true
        default: main
        type: string

concurrency:
  group: android24-minsdk-${{ inputs.product_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api24-smoke:
    name: Android 7 API 24 install and launch
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout exact product ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.product_ref }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build source-authoritative APK with verified dependencies
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          grep -Fx '        minSdk = 24' app/build.gradle
          git rev-parse HEAD
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Install pinned Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CLT_ZIP=/tmp/commandlinetools-linux-15859902_latest.zip
          CLT_HOME="$SDK_ROOT/cmdline-tools/reappzuku-15859902"
          # Google CDN can terminate HTTP/2 streams mid-transfer (curl 92).
          # Resume interrupted downloads; the pinned SHA-256 still gates extraction.
          curl --http1.1 --fail --location --proto '=https' --tlsv1.2 \
            --connect-timeout 30 --max-time 360 \
            --retry 5 --retry-all-errors --retry-delay 3 --continue-at - \
            'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' \
            -o "$CLT_ZIP"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/commandlinetools-linux-15859902_latest.zip' | sha256sum -c -
          rm -rf /tmp/reappzuku-android-clt "$CLT_HOME"
          mkdir -p /tmp/reappzuku-android-clt "$CLT_HOME"
          unzip -q "$CLT_ZIP" -d /tmp/reappzuku-android-clt
          cp -a /tmp/reappzuku-android-clt/cmdline-tools/. "$CLT_HOME/"
          echo "$CLT_HOME/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Prepare Android 7 API 24 system image
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CLT_HOME="$SDK_ROOT/cmdline-tools/reappzuku-15859902"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          IMAGE='system-images;android-24;google_apis;x86_64'
          yes | "$CLT_HOME/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$CLT_HOME/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            'platform-tools' 'emulator' 'platforms;android-24' "$IMAGE"
          "$CLT_HOME/bin/sdkmanager" --sdk_root="$SDK_ROOT" --list_installed | grep -F "$IMAGE"
          echo no | "$CLT_HOME/bin/avdmanager" create avd \
            --force --name reappzuku-api24 --package "$IMAGE" --device pixel_2
          test -f "$HOME/.android/avd/reappzuku-api24.avd/config.ini"

      - name: Boot and verify Android API 24
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          nohup emulator @reappzuku-api24 \
            -no-window -no-audio -no-boot-anim -no-metrics \
            -no-snapshot -wipe-data -gpu swiftshader_indirect \
            >/tmp/reappzuku-api24-emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 360 bash -c '
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
              sleep 3
            done
          '
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 24
          adb shell input keyevent 82 || true
          ready=0
          for attempt in $(seq 1 60); do
            if adb shell pm list packages android 2>/dev/null | grep -Fq 'package:android'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          echo 'ANDROID_API24_READY'

      - name: Install current minSdk 24 debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK"
          adb install -r -t "$APK"
          adb shell pm list packages com.gree1d.reappzuku | tr -d '\r' \
            | grep -Fx 'package:com.gree1d.reappzuku'
          adb shell dumpsys package com.gree1d.reappzuku > /tmp/reappzuku-api24-package.txt
          grep -Eq 'targetSdk=37' /tmp/reappzuku-api24-package.txt
          echo 'API24_INSTALL_PASS'

      - name: Launch product and reject immediate process crash
        shell: bash
        run: |
          set -euo pipefail
          adb logcat -c
          adb shell monkey -p com.gree1d.reappzuku \
            -c android.intent.category.LAUNCHER 1 \
            > /tmp/reappzuku-api24-launch.txt 2>&1
          cat /tmp/reappzuku-api24-launch.txt
          grep -Fq 'Events injected: 1' /tmp/reappzuku-api24-launch.txt
          sleep 8
          adb logcat -d -v brief -s AndroidRuntime:E '*:S' \
            > /tmp/reappzuku-api24-runtime-errors.txt || true
          if grep -Fq 'Process: com.gree1d.reappzuku' /tmp/reappzuku-api24-runtime-errors.txt; then
            cat /tmp/reappzuku-api24-runtime-errors.txt >&2
            exit 1
          fi
          adb shell ps | tr -d '\r' | grep -F 'com.gree1d.reappzuku'
          adb shell dumpsys activity activities | grep -F 'com.gree1d.reappzuku'
          echo 'API24_LAUNCH_SMOKE_PASS'

      - name: Install API 24 instrumentation package
        shell: bash
        run: |
          set -euo pipefail
          TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*.apk' | head -n 1)"
          test -n "$TEST_APK"
          test -f "$TEST_APK"
          sha256sum "$TEST_APK"
          adb install -r -t "$TEST_APK"
          adb shell pm list instrumentation | tr -d '\r' \
            | grep -F '(target=com.gree1d.reappzuku)'
          echo 'API24_INSTRUMENTATION_INSTALLED'

      - name: Run API 24 Room migration and policy-backup instrumentation
        shell: bash
        run: |
          set -euo pipefail
          INSTRUMENTATION="$(
            adb shell pm list instrumentation \
              | tr -d '\r' \
              | sed -n 's/^instrumentation:\([^ ]*\) (target=com.gree1d.reappzuku)$/\1/p' \
              | head -n 1
          )"
          test -n "$INSTRUMENTATION"
          # Deliberately scope this API-24 lane to local storage/codec invariants.
          # The Shizuku/root/runtime scheduling suite remains in dedicated API-36/37 lanes.
          TEST_CLASSES='com.gree1d.reappzuku.core.BackupCodecTest,com.gree1d.reappzuku.db.AppDatabaseMigrationTest,com.gree1d.reappzuku.core.Phase9BackupRestoreTest'
          adb shell am instrument -w -r -e class "$TEST_CLASSES" "$INSTRUMENTATION" \
            | tee /tmp/reappzuku-api24-instrumentation.txt
          grep -Eq 'OK \([0-9]+ tests?\)' /tmp/reappzuku-api24-instrumentation.txt
          ! grep -Fq 'FAILURES!!!' /tmp/reappzuku-api24-instrumentation.txt
          echo 'API24_LOCAL_PERSISTENCE_PASS'

      - name: Seed canonical policy and preferences before an in-place update
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          cp "$apk" /tmp/reappzuku-upgrade-base.apk
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          base_badging="$("$AAPT" dump badging /tmp/reappzuku-upgrade-base.apk | head -n 1)"
          base_code="$(sed -nE "s/.*versionCode='([0-9]+)'.*/\\1/p" <<< "$base_badging")"
          [[ "$base_code" =~ ^[0-9]+$ ]]
          echo "UPGRADE_BASE_CODE=$base_code" >> "$GITHUB_ENV"
          echo "UPGRADE_NEXT_CODE=$((base_code + 1))" >> "$GITHUB_ENV"
          runner="$(adb shell pm list instrumentation | tr -d '\\r' |
            sed -n 's/^instrumentation:\\([^ ]*\\) (target=com.gree1d.reappzuku)$/\\1/p' | head -1)"
          test -n "$runner"
          adb shell am instrument -w -r -e class \
            com.gree1d.reappzuku.core.EmulatorUpgradePersistenceTest#seedBeforeUpgrade \
            -e upgrade_smoke_stage seed "$runner" | tee /tmp/upgrade-seed.txt
          grep -Fq 'OK (1 test)' /tmp/upgrade-seed.txt
          echo 'API24_UPGRADE_SEEDED'

      - name: Build and install higher-version APK under same ephemeral debug signer
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug \
            "-PreappzukuUpgradeSmokeVersionCode=$UPGRADE_NEXT_CODE" \
            --rerun-tasks --no-daemon
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          candidate_badging="$("$AAPT" dump badging "$apk" | head -n 1)"
          grep -Fq "name='com.gree1d.reappzuku'" <<< "$candidate_badging"
          grep -Fq "versionCode='$UPGRADE_NEXT_CODE'" <<< "$candidate_badging"
          signer() {
            "$APKSIGNER" verify --verbose --print-certs "$1" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: *//p'
          }
          base_signer="$(signer /tmp/reappzuku-upgrade-base.apk)"
          next_signer="$(signer "$apk")"
          [[ "$base_signer" =~ ^[[:xdigit:]]{64}$ ]]
          test "$base_signer" = "$next_signer"
          test "$(sha256sum /tmp/reappzuku-upgrade-base.apk | cut -d ' ' -f 1)" != \
               "$(sha256sum "$apk" | cut -d ' ' -f 1)"
          adb install -r -t "$apk"
          adb shell dumpsys package com.gree1d.reappzuku |
            grep -Fq "versionCode=$UPGRADE_NEXT_CODE"
          echo 'API24_SAME_SIGNER_UPGRADE_INSTALLED'

      - name: Verify in-place upgrade retained Room policy and preferences
        shell: bash
        run: |
          set -euo pipefail
          runner="$(adb shell pm list instrumentation | tr -d '\\r' |
            sed -n 's/^instrumentation:\\([^ ]*\\) (target=com.gree1d.reappzuku)$/\\1/p' | head -1)"
          test -n "$runner"
          adb shell am instrument -w -r -e class \
            com.gree1d.reappzuku.core.EmulatorUpgradePersistenceTest#verifyAfterUpgrade \
            -e upgrade_smoke_stage verify "$runner" | tee /tmp/upgrade-verify.txt
          grep -Fq 'OK (1 test)' /tmp/upgrade-verify.txt
          ! grep -Fq 'FAILURES!!!' /tmp/upgrade-verify.txt
          echo 'API24_SAME_KEY_UPDATE_DATA_PASS'
