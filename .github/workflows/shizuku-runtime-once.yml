name: One-time real Shizuku first-run and backup probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api36-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Validate and build probes
        run: |
          bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Prepare stable Android 16 emulator
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$SDK_ROOT/platform-tools:$PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd --force \
            --name reappzuku-api36-first-run \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_6

          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          "$EMULATOR" -avd reappzuku-api36-first-run \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -partition-size 4096 \
            > /tmp/reappzuku-first-run-emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > /tmp/reappzuku-first-run-emulator.pid

          adb_ready=false
          for i in $(seq 1 45); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              tail -300 /tmp/reappzuku-first-run-emulator.log || true
              exit 1
            fi
            if "$ADB" get-state >/dev/null 2>&1; then
              adb_ready=true
              break
            fi
            sleep 2
          done
          test "$adb_ready" = true

          boot_ready=false
          for i in $(seq 1 90); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              boot_ready=true
              break
            fi
            sleep 2
          done
          test "$boot_ready" = true
          "$ADB" shell locksettings set-disabled true || true
          "$ADB" shell wm dismiss-keyguard || true
          "$ADB" shell input keyevent 82 || true

          unlocked=false
          for i in $(seq 1 60); do
            state="$("$ADB" shell am get-started-user-state 0 2>/dev/null | tr -d '\r' || true)"
            if grep -q RUNNING_UNLOCKED <<<"$state"; then
              unlocked=true
              break
            fi
            "$ADB" shell wm dismiss-keyguard || true
            "$ADB" shell input keyevent 82 || true
            sleep 1
          done
          test "$unlocked" = true

      - name: Install and initialize official Shizuku with fresh ReAppzuku
        run: |
          set -euo pipefail
          SHIZUKU_URL='https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk'
          SHIZUKU_APK='/tmp/shizuku-v13.6.0.r1086.2650830c-release.apk'
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 "$SHIZUKU_URL" -o "$SHIZUKU_APK"
          echo '6e273ab0e991c4e79bc8b1bbb9b9dd739ccac1a8712a541a214078886b7b790f  /tmp/shizuku-v13.6.0.r1086.2650830c-release.apk' | sha256sum -c -

          adb install -r "$SHIZUKU_APK"
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm clear com.gree1d.reappzuku
          adb shell pm revoke com.gree1d.reappzuku moe.shizuku.manager.permission.API_V23 2>/dev/null || true
          adb shell pm grant com.gree1d.reappzuku android.permission.POST_NOTIFICATIONS 2>/dev/null || true

          SHIZUKU_APK_PATH="$(adb shell pm path moe.shizuku.privileged.api | head -1 | sed 's/^package://' | tr -d '\r')"
          SHIZUKU_CODE_DIR="${SHIZUKU_APK_PATH%/*}"
          SHIZUKU_LIB="$SHIZUKU_CODE_DIR/lib/x86_64/libshizuku.so"
          adb shell test -x "$SHIZUKU_LIB"
          adb shell "$SHIZUKU_LIB" | tee /tmp/shizuku-first-run-start.log

          server_ready=false
          for i in $(seq 1 40); do
            if [ -n "$(adb shell pidof shizuku_server 2>/dev/null | tr -d '\r' || true)" ]; then
              server_ready=true
              break
            fi
            sleep 0.25
          done
          test "$server_ready" = true

          # The manager is normally initialized by the user while starting Shizuku.
          # Starting only the native server is sufficient for pre-authorized clients,
          # but not a faithful environment for the interactive authorization dialog.
          adb shell am start -W -n moe.shizuku.privileged.api/moe.shizuku.manager.MainActivity \
            | tee /tmp/shizuku-manager-init.log
          manager_ready=false
          for i in $(seq 1 40); do
            if [ -n "$(adb shell pidof moe.shizuku.privileged.api 2>/dev/null | tr -d '\r' || true)" ]; then
              manager_ready=true
              break
            fi
            sleep 0.25
          done
          test "$manager_ready" = true
          sleep 2

          # Initialization must not pre-authorize ReAppzuku.
          adb shell pm revoke com.gree1d.reappzuku moe.shizuku.manager.permission.API_V23 2>/dev/null || true
          if adb shell dumpsys package com.gree1d.reappzuku | \
              grep -A20 'runtime permissions:' | \
              grep -q 'moe.shizuku.manager.permission.API_V23: granted=true'; then
            echo 'ReAppzuku unexpectedly pre-authorized before first-run probe' >&2
            exit 1
          fi

      - name: Enable deterministic first-run debug evidence
        run: |
          set -euo pipefail
          output="$(adb shell am instrument -w \
            -e firstRunProbeSetup true \
            -e class 'com.gree1d.reappzuku.core.FirstRunShizukuProbeSetupInstrumentationTest#enableDebugLoggingForFirstRunProbe' \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          printf '%s\n' "$output"
          grep -q 'OK (1 test)' <<<"$output"

      - name: Verify first-run waits for real Shizuku permission
        run: |
          set -euo pipefail
          adb logcat -c
          adb shell am start -W -n com.gree1d.reappzuku/.ui.MainActivity | tee /tmp/first-run-am-start.log

          waiting=false
          dialog=false
          for i in $(seq 1 120); do
            logs="$(adb logcat -d 2>/dev/null || true)"
            if grep -q 'MainActivity: waiting for Shizuku permission before app scan' <<<"$logs"; then
              waiting=true
            fi
            activities="$(adb shell dumpsys activity activities 2>/dev/null || true)"
            if grep -q 'moe.shizuku.manager.authorization.RequestPermissionActivity' <<<"$activities"; then
              dialog=true
            fi
            if [ "$waiting" = true ] && [ "$dialog" = true ]; then
              break
            fi
            sleep 0.25
          done
          echo "first-run-waiting-marker=$waiting permission-dialog=$dialog"
          test "$waiting" = true
          test "$dialog" = true

          adb logcat -d | tee /tmp/first-run-before-grant.log >/dev/null
          if grep -q 'MainActivity: loadBackgroundApps started' /tmp/first-run-before-grant.log; then
            echo 'App scan started before Shizuku permission was granted' >&2
            exit 1
          fi

          adb shell uiautomator dump /sdcard/reappzuku-first-run.xml >/dev/null
          adb shell cat /sdcard/reappzuku-first-run.xml > /tmp/reappzuku-first-run.xml
          python3 - <<'PY' > /tmp/allow-button-coordinates
          import re
          xml = open('/tmp/reappzuku-first-run.xml', encoding='utf-8').read()
          match = re.search(r'resource-id="android:id/button1"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml)
          if not match:
              raise SystemExit('Shizuku always-allow button not found in UI hierarchy')
          x1, y1, x2, y2 = map(int, match.groups())
          print((x1 + x2) // 2, (y1 + y2) // 2)
          PY
          read -r ALLOW_X ALLOW_Y < /tmp/allow-button-coordinates
          echo "allow-button=$ALLOW_X,$ALLOW_Y"
          adb shell input tap "$ALLOW_X" "$ALLOW_Y"

          recovered=false
          for i in $(seq 1 180); do
            logs="$(adb logcat -d 2>/dev/null || true)"
            if grep -q 'MainActivity: Shizuku permission result=0' <<<"$logs" && \
               grep -q 'MainActivity: shell backend state=SHIZUKU_READY' <<<"$logs" && \
               grep -q 'MainActivity: loadBackgroundApps started' <<<"$logs"; then
              recovered=true
              break
            fi
            sleep 0.25
          done
          test "$recovered" = true

          adb logcat -d | tee /tmp/first-run-after-grant.log >/dev/null
          python3 - <<'PY'
          lines = open('/tmp/first-run-after-grant.log', encoding='utf-8').read().splitlines()
          markers = [
              'MainActivity: waiting for Shizuku permission before app scan',
              'MainActivity: Shizuku permission result=0',
              'MainActivity: shell backend state=SHIZUKU_READY',
              'MainActivity: loadBackgroundApps started',
          ]
          positions = []
          for marker in markers:
              try:
                  positions.append(next(i for i, line in enumerate(lines) if marker in line))
              except StopIteration:
                  raise SystemExit(f'missing first-run marker: {marker}')
          if positions != sorted(positions) or len(set(positions)) != len(positions):
              raise SystemExit(f'first-run marker order invalid: {positions}')
          print('first-run-marker-order=' + ','.join(map(str, positions)))
          PY

          adb shell dumpsys package com.gree1d.reappzuku | \
            grep -A20 'runtime permissions:' | tee /tmp/reappzuku-runtime-permissions.txt
          grep -q 'moe.shizuku.manager.permission.API_V23: granted=true' /tmp/reappzuku-runtime-permissions.txt

      - name: Verify real content URI backup round-trip
        run: |
          set -euo pipefail
          adb shell am force-stop com.gree1d.reappzuku || true
          output="$(adb shell am instrument -w \
            -e backupFileProbe true \
            -e class 'com.gree1d.reappzuku.core.BackupFileRoundTripInstrumentationTest' \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          printf '%s\n' "$output"
          grep -q 'OK (1 test)' <<<"$output"

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          adb devices -l || true
          adb shell getprop sys.boot_completed || true
          adb shell am get-started-user-state 0 || true
          adb shell pidof shizuku_server || true
          adb shell pidof moe.shizuku.privileged.api || true
          adb shell dumpsys activity activities | head -260 || true
          adb shell dumpsys package com.gree1d.reappzuku | head -300 || true
          adb logcat -d -t 1200 | grep -E 'ReAppzuku|Shizuku|shizuku_server|RequestPermission' || true
          cat /tmp/first-run-before-grant.log 2>/dev/null || true
          cat /tmp/first-run-after-grant.log 2>/dev/null || true
          cat /tmp/reappzuku-first-run.xml 2>/dev/null || true
          cat /tmp/shizuku-first-run-start.log 2>/dev/null || true
          cat /tmp/shizuku-manager-init.log 2>/dev/null || true
          tail -300 /tmp/reappzuku-first-run-emulator.log || true
