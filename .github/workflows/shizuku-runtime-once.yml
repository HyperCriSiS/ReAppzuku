name: One-time real Shizuku API 36 probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-shizuku:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Validate and build guarded real-Shizuku probe
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Prepare stable Android 16 emulator
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$SDK_ROOT/platform-tools:$PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd --force \
            --name reappzuku-api36-shizuku \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_6

          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          "$EMULATOR" -avd reappzuku-api36-shizuku \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -partition-size 4096 \
            > /tmp/reappzuku-shizuku-emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > /tmp/reappzuku-shizuku-emulator.pid

          adb_ready=false
          for i in $(seq 1 45); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              tail -300 /tmp/reappzuku-shizuku-emulator.log || true
              exit 1
            fi
            if "$ADB" get-state >/dev/null 2>&1; then
              adb_ready=true
              break
            fi
            sleep 2
          done
          test "$adb_ready" = true

          boot_ready=false
          for i in $(seq 1 90); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              boot_ready=true
              break
            fi
            sleep 2
          done
          test "$boot_ready" = true

          "$ADB" shell locksettings set-disabled true || true
          "$ADB" shell wm dismiss-keyguard || true
          "$ADB" shell input keyevent 82 || true
          unlocked=false
          for i in $(seq 1 60); do
            state="$("$ADB" shell am get-started-user-state 0 2>/dev/null | tr -d '\r' || true)"
            if grep -q RUNNING_UNLOCKED <<<"$state"; then
              unlocked=true
              break
            fi
            "$ADB" shell wm dismiss-keyguard || true
            "$ADB" shell input keyevent 82 || true
            sleep 1
          done
          test "$unlocked" = true

      - name: Install official Shizuku and ReAppzuku probe APKs
        run: |
          set -euo pipefail
          SHIZUKU_URL='https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk'
          SHIZUKU_APK='/tmp/shizuku-v13.6.0.r1086.2650830c-release.apk'
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            "$SHIZUKU_URL" -o "$SHIZUKU_APK"
          test "$(stat -c '%s' "$SHIZUKU_APK")" = '2571773'
          sha256sum "$SHIZUKU_APK" | tee /tmp/shizuku-apk.sha256

          adb install -r "$SHIZUKU_APK"
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm clear com.gree1d.reappzuku

          # Shizuku v13 declares API_V23 as a dangerous runtime permission. Granting it
          # through ADB is deterministic for CI; the real Shizuku server imports that
          # runtime grant into its UID authorization flags when it starts.
          adb shell pm grant com.gree1d.reappzuku moe.shizuku.manager.permission.API_V23
          adb shell dumpsys package com.gree1d.reappzuku | \
            grep -A2 'moe.shizuku.manager.permission.API_V23' | head -6

      - name: Probe exported shortcut abuse boundary
        run: |
          set -euo pipefail
          output="$(adb shell am instrument -w \
            -e shortcutAbuseProbe true \
            -e class 'com.gree1d.reappzuku.utils.ShortcutAbuseInstrumentationTest' \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          printf '%s\n' "$output"
          grep -q 'OK (2 tests)' <<<"$output"

      - name: Start real Shizuku daemon
        run: |
          set -euo pipefail
          SHIZUKU_APK_PATH="$(adb shell pm path moe.shizuku.privileged.api | head -1 | sed 's/^package://' | tr -d '\r')"
          test -n "$SHIZUKU_APK_PATH"
          SHIZUKU_CODE_DIR="${SHIZUKU_APK_PATH%/*}"
          SHIZUKU_LIB="$SHIZUKU_CODE_DIR/lib/x86_64/libshizuku.so"
          echo "$SHIZUKU_LIB" | tee /tmp/shizuku-lib-path
          adb shell test -x "$SHIZUKU_LIB"
          adb shell "$SHIZUKU_LIB" | tee /tmp/shizuku-start.log

          server_ready=false
          for i in $(seq 1 40); do
            if [ -n "$(adb shell pidof shizuku_server 2>/dev/null | tr -d '\r')" ]; then
              server_ready=true
              break
            fi
            sleep 0.25
          done
          test "$server_ready" = true
          echo "shizuku-server-pid=$(adb shell pidof shizuku_server | tr -d '\r')"

      - name: Verify real UserService and same-process daemon restart recovery
        run: |
          set -euo pipefail
          adb logcat -c

          set +e
          adb shell am instrument -w \
            -e realShizukuProbe true \
            -e class 'com.gree1d.reappzuku.core.RealShizukuDaemonInstrumentationTest#realDaemonBindCommandAndRestartRecovery' \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner \
            > /tmp/real-shizuku-instrumentation.log 2>&1 &
          PROBE_PID=$!
          set -e

          ready=false
          for i in $(seq 1 120); do
            if adb logcat -d -s ReAppzukuShizukuProbe:I '*:S' | \
                grep -q 'REAL_SHIZUKU_READY_FOR_RESTART'; then
              ready=true
              break
            fi
            if ! kill -0 "$PROBE_PID" 2>/dev/null; then
              cat /tmp/real-shizuku-instrumentation.log
              exit 1
            fi
            sleep 0.25
          done
          test "$ready" = true

          OLD_SERVER_PID="$(adb shell pidof shizuku_server | tr -d '\r')"
          test -n "$OLD_SERVER_PID"
          echo "old-shizuku-server-pid=$OLD_SERVER_PID"
          adb shell kill -9 "$OLD_SERVER_PID"

          lost=false
          for i in $(seq 1 80); do
            if adb logcat -d -s ReAppzukuShizukuProbe:I '*:S' | \
                grep -q 'REAL_SHIZUKU_BINDER_LOSS_OBSERVED'; then
              lost=true
              break
            fi
            sleep 0.25
          done
          test "$lost" = true

          SHIZUKU_LIB="$(cat /tmp/shizuku-lib-path)"
          adb shell "$SHIZUKU_LIB" | tee /tmp/shizuku-restart.log

          new_server=false
          for i in $(seq 1 80); do
            NEW_SERVER_PID="$(adb shell pidof shizuku_server 2>/dev/null | tr -d '\r' || true)"
            if [ -n "$NEW_SERVER_PID" ] && [ "$NEW_SERVER_PID" != "$OLD_SERVER_PID" ]; then
              new_server=true
              echo "new-shizuku-server-pid=$NEW_SERVER_PID"
              break
            fi
            sleep 0.25
          done
          test "$new_server" = true

          set +e
          wait "$PROBE_PID"
          PROBE_RC=$?
          set -e
          cat /tmp/real-shizuku-instrumentation.log
          test "$PROBE_RC" = 0
          grep -q 'OK (1 test)' /tmp/real-shizuku-instrumentation.log
          adb logcat -d -s ReAppzukuShizukuProbe:I '*:S' | tee /tmp/real-shizuku-markers.log
          grep -q 'REAL_SHIZUKU_RECOVERED_AFTER_RESTART' /tmp/real-shizuku-markers.log

      - name: Capture Shizuku diagnostics on failure
        if: failure()
        run: |
          adb devices -l || true
          adb shell getprop sys.boot_completed || true
          adb shell am get-started-user-state 0 || true
          adb shell pidof shizuku_server || true
          adb shell dumpsys package moe.shizuku.privileged.api | head -180 || true
          adb shell dumpsys package com.gree1d.reappzuku | head -220 || true
          adb logcat -d -t 500 | grep -E 'Shizuku|ReAppzuku|shizuku_server' || true
          cat /tmp/shizuku-apk.sha256 2>/dev/null || true
          cat /tmp/shizuku-start.log 2>/dev/null || true
          cat /tmp/shizuku-restart.log 2>/dev/null || true
          cat /tmp/real-shizuku-instrumentation.log 2>/dev/null || true
          tail -300 /tmp/reappzuku-shizuku-emulator.log || true
