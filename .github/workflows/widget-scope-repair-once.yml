name: One-time widget scope repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          fetch-depth: 2
      - name: Restore parent widget and apply only scope hardening
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "52633babc1b85e28e46061099b4e3c503c18d7ea"
          path='app/src/main/java/com/gree1d/reappzuku/utils/AppzukuWidget.kt'
          git checkout HEAD^ -- "$path"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/gree1d/reappzuku/utils/AppzukuWidget.kt')
          s = p.read_text()

          old = "import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.GlobalScope\nimport kotlinx.coroutines.launch"
          new = "import kotlinx.coroutines.CoroutineScope\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.SupervisorJob\nimport kotlinx.coroutines.launch"
          if s.count(old) != 1:
              raise SystemExit(f'unexpected coroutine imports: {s.count(old)}')
          s = s.replace(old, new, 1)

          marker = "    companion object {\n"
          insert = (
              "    companion object {\n"
              "        // Java callers have no component-owned scope. This explicit scope intentionally lives\n"
              "        // for the application process and isolates independent widget refresh failures.\n"
              "        private val widgetUpdateScope = CoroutineScope(SupervisorJob() + Dispatchers.Default)\n\n"
          )
          if s.count(marker) != 1:
              raise SystemExit(f'unexpected companion marker: {s.count(marker)}')
          s = s.replace(marker, insert, 1)

          old = "            GlobalScope.launch { updateAllWidgets(context) }"
          new = (
              "            val appContext = context.applicationContext\n"
              "            widgetUpdateScope.launch { updateAllWidgets(appContext) }"
          )
          if s.count(old) != 1:
              raise SystemExit(f'unexpected GlobalScope bridge: {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only)" = "$path"
          ! grep -q 'GlobalScope' "$path"
          grep -q 'class AppzukuWidgetReceiver' "$path"
          grep -q 'LinearProgressIndicator' "$path"
          test "$(git diff --numstat -- "$path" | awk '{print $1 ":" $2}')" = "8:2"
          git diff --stat
          git diff -- "$path"
          git config user.name HyperCriSiS
          git config user.email dev.github@w3b.world
          git add "$path"
          git commit -m 'Repair widget scope hardening without UI drift'
          git push origin HEAD:ondemand-shizuku
