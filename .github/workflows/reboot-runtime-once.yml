name: One-time API 36 real reboot probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-reboot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Validate and build guarded reboot probe
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Prepare stable Android 16 emulator
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$SDK_ROOT/platform-tools:$PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"

          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
          test -x "$ADB"
          test -x "$EMULATOR"

          echo no | "$AVDMANAGER" create avd --force \
            --name reappzuku-api36-reboot \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_6

          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          "$EMULATOR" -avd reappzuku-api36-reboot \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -partition-size 4096 \
            > /tmp/reappzuku-reboot-emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > /tmp/reappzuku-emulator.pid

          adb_ready=false
          for i in $(seq 1 45); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited before ADB became ready"
              tail -300 /tmp/reappzuku-reboot-emulator.log || true
              exit 1
            fi
            if "$ADB" get-state >/dev/null 2>&1; then
              adb_ready=true
              break
            fi
            sleep 2
          done
          test "$adb_ready" = true

          boot_ready=false
          for i in $(seq 1 90); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              boot_ready=true
              break
            fi
            sleep 2
          done
          test "$boot_ready" = true

          "$ADB" shell locksettings set-disabled true || true
          "$ADB" shell wm dismiss-keyguard || true
          "$ADB" shell input keyevent 82 || true
          unlocked=false
          for i in $(seq 1 90); do
            state="$("$ADB" shell am get-started-user-state 0 2>/dev/null | tr -d '\r' || true)"
            echo "initial user-state[$i]=$state"
            if grep -q RUNNING_UNLOCKED <<<"$state"; then
              unlocked=true
              break
            fi
            "$ADB" shell wm dismiss-keyguard || true
            "$ADB" shell input keyevent 82 || true
            sleep 1
          done
          test "$unlocked" = true

      - name: Install probe APKs and prepare pre-reboot state
        run: |
          set -euo pipefail
          APP_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          adb install -r -t "$APP_APK"
          adb install -r -t "$TEST_APK"
          adb shell pm clear com.gree1d.reappzuku

          output="$(adb shell am instrument -w \
            -e realRebootProbe true \
            -e class 'com.gree1d.reappzuku.core.RealRebootRecoveryInstrumentationTest#prepareForRealReboot' \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          printf '%s\n' "$output"
          grep -q 'OK (1 test)' <<<"$output"

          echo "boot-id-before=$(adb shell cat /proc/sys/kernel/random/boot_id | tr -d '\r')"

      - name: Reboot Android and wait for unlocked user
        run: |
          set -euo pipefail
          adb reboot

          adb_ready=false
          for i in $(seq 1 60); do
            if adb get-state >/dev/null 2>&1; then
              adb_ready=true
              break
            fi
            sleep 2
          done
          test "$adb_ready" = true

          boot_ready=false
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              boot_ready=true
              break
            fi
            sleep 2
          done
          test "$boot_ready" = true

          adb shell locksettings set-disabled true || true
          adb shell wm dismiss-keyguard || true
          adb shell input keyevent 82 || true
          unlocked=false
          for i in $(seq 1 90); do
            state="$(adb shell am get-started-user-state 0 2>/dev/null | tr -d '\r' || true)"
            echo "post-reboot user-state[$i]=$state"
            if grep -q RUNNING_UNLOCKED <<<"$state"; then
              unlocked=true
              break
            fi
            adb shell wm dismiss-keyguard || true
            adb shell input keyevent 82 || true
            sleep 1
          done
          test "$unlocked" = true

          echo "boot-id-after=$(adb shell cat /proc/sys/kernel/random/boot_id | tr -d '\r')"
          adb shell dumpsys package com.gree1d.reappzuku | head -60

      - name: Verify post-reboot recovery
        run: |
          set -euo pipefail
          output="$(adb shell am instrument -w \
            -e realRebootProbe true \
            -e class 'com.gree1d.reappzuku.core.RealRebootRecoveryInstrumentationTest#verifyAfterRealReboot' \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          printf '%s\n' "$output"
          grep -q 'OK (1 test)' <<<"$output"

          echo '=== Rebuilt ReAppzuku alarms ==='
          adb shell dumpsys alarm | grep -E 'PRESET_ACTIVATE|PRESET_DEACTIVATE|SCHEDULER_TICK' || true

      - name: Verify disabled desired state across external force-stop
        run: |
          set -euo pipefail
          prepare="$(adb shell am instrument -w \
            -e forceStopProbe true \
            -e class 'com.gree1d.reappzuku.core.ForceStopDesiredStateInstrumentationTest#prepareDisabledStateBeforeForceStop' \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          printf '%s\n' "$prepare"
          grep -q 'OK (1 test)' <<<"$prepare"

          old_pid="$(adb shell pidof com.gree1d.reappzuku | tr -d '\r')"
          test -n "$old_pid"
          echo "force-stop pid-before=$old_pid"

          adb shell am force-stop com.gree1d.reappzuku
          process_gone=false
          for i in $(seq 1 20); do
            if [ -z "$(adb shell pidof com.gree1d.reappzuku 2>/dev/null | tr -d '\r')" ]; then
              process_gone=true
              break
            fi
            sleep 0.5
          done
          test "$process_gone" = true

          verify="$(adb shell am instrument -w \
            -e forceStopProbe true \
            -e class 'com.gree1d.reappzuku.core.ForceStopDesiredStateInstrumentationTest#verifyDisabledStateAfterExternalForceStop' \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          printf '%s\n' "$verify"
          grep -q 'OK (1 test)' <<<"$verify"

          new_pid="$(adb shell pidof com.gree1d.reappzuku | tr -d '\r')"
          echo "force-stop pid-after=$new_pid"
          test -n "$new_pid"
          test "$old_pid" != "$new_pid"

      - name: Probe exported shortcut abuse boundary
        run: |
          set -euo pipefail
          output="$(adb shell am instrument -w \
            -e shortcutAbuseProbe true \
            -e class 'com.gree1d.reappzuku.utils.ShortcutAbuseInstrumentationTest' \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          printf '%s\n' "$output"
          grep -q 'OK (2 tests)' <<<"$output"

      - name: Capture reboot diagnostics on failure
        if: failure()
        run: |
          adb devices -l || true
          adb shell getprop sys.boot_completed || true
          adb shell am get-started-user-state 0 || true
          adb shell dumpsys package com.gree1d.reappzuku | head -160 || true
          adb shell dumpsys alarm | grep -E 'gree1d|PRESET_|SCHEDULER_TICK' || true
          adb shell dumpsys activity broadcasts | grep -A6 -B3 'BOOT_COMPLETED' | tail -180 || true
          tail -300 /tmp/reappzuku-reboot-emulator.log || true
