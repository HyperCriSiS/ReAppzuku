name: One-time API 36 external force-stop probe

on:
  workflow_dispatch:

concurrency:
  group: reappzuku-force-stop-runtime-once
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  force-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build guarded force-stop probe
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Prepare stable Android 16 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$SDK_ROOT/platform-tools:$PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd --force \
            --name reappzuku-api36-force-stop \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_6

          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          "$EMULATOR" -avd reappzuku-api36-force-stop \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -partition-size 4096 \
            > /tmp/reappzuku-force-stop-emulator.log 2>&1 &

          adb_ready=false
          for i in $(seq 1 60); do
            if "$ADB" get-state >/dev/null 2>&1; then adb_ready=true; break; fi
            sleep 2
          done
          test "$adb_ready" = true

          boot_ready=false
          for i in $(seq 1 90); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then boot_ready=true; break; fi
            sleep 2
          done
          test "$boot_ready" = true
          "$ADB" shell locksettings set-disabled true || true
          "$ADB" shell wm dismiss-keyguard || true
          "$ADB" shell input keyevent 82 || true
          test "$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r')" = "36"

      - name: Install probe APKs
        run: |
          set -euo pipefail
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm clear com.gree1d.reappzuku

      - name: Prove disabled desired state across external force-stop
        shell: bash
        run: |
          set -euo pipefail
          prepare="$(adb shell am instrument -w \
            -e forceStopProbe true \
            -e class 'com.gree1d.reappzuku.core.ForceStopDesiredStateInstrumentationTest#prepareDisabledStateBeforeForceStop' \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          printf '%s\n' "$prepare"
          grep -q 'OK (1 test)' <<<"$prepare"

          old_pid="$(adb shell pidof com.gree1d.reappzuku | tr -d '\r')"
          test -n "$old_pid"
          echo "force-stop pid-before=$old_pid"

          adb shell am force-stop com.gree1d.reappzuku
          process_gone=false
          for i in $(seq 1 20); do
            if [ -z "$(adb shell pidof com.gree1d.reappzuku 2>/dev/null | tr -d '\r')" ]; then process_gone=true; break; fi
            sleep 0.5
          done
          test "$process_gone" = true

          verify="$(adb shell am instrument -w \
            -e forceStopProbe true \
            -e class 'com.gree1d.reappzuku.core.ForceStopDesiredStateInstrumentationTest#verifyDisabledStateAfterExternalForceStop' \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
          printf '%s\n' "$verify"
          grep -q 'OK (1 test)' <<<"$verify"

          # The instrumentation process exits after the assertion, so a host-side pidof here
          # is intentionally not used as evidence. The test itself compares the pre-force-stop
          # PID with the fresh verification-process PID while that process is alive.

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          adb devices -l || true
          adb shell getprop sys.boot_completed || true
          adb shell am get-started-user-state 0 || true
          adb shell dumpsys package com.gree1d.reappzuku | head -180 || true
          tail -300 /tmp/reappzuku-force-stop-emulator.log || true

      - name: Stop emulator
        if: always()
        run: adb emu kill || true
