name: One-time A17 SetTextI18n review fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: roadmap/a17-settext-i18n
          fetch-depth: 0
      - name: Preserve sort indicators and clean formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/res/values/strings.xml')
          s = p.read_text()
          needle = '    <string name="ui_label_with_indicator" translatable="false">%1$s %2$s</string>\n'
          addition = needle + '    <string name="ui_sort_indicator_open" translatable="false">▲</string>\n' + '    <string name="ui_sort_indicator_closed" translatable="false">▼</string>\n' + '    <string name="ui_sort_label_with_indicator" translatable="false">%1$s  %2$s</string>\n'
          assert s.count(needle) == 1
          assert 'name="ui_sort_indicator_open"' not in s
          p.write_text(s.replace(needle, addition, 1))

          p = Path('app/src/main/java/com/gree1d/reappzuku/ui/PresetSettingsActivity.java')
          s = p.read_text()
          time_pat = re.compile(r'\s*binding\.textPresetTimeRange\.setText\(getString\(\s*R\.string\.ui_time_range_value,\s*formatTime\(workingModel\.startHour, workingModel\.startMinute, use24h\),\s*formatTime\(workingModel\.endHour, workingModel\.endMinute, use24h\)\)\);')
          time_repl = '\n        binding.textPresetTimeRange.setText(getString(\n                R.string.ui_time_range_value,\n                formatTime(workingModel.startHour, workingModel.startMinute, use24h),\n                formatTime(workingModel.endHour, workingModel.endMinute, use24h)));'
          s, count = time_pat.subn(lambda _: time_repl, s, count=1)
          assert count == 1, f'time block replacements={count}'
          sort_pat = re.compile(r'\s*btn\.setText\(getString\(\s*R\.string\.ui_label_with_indicator,\s*getString\(R\.string\.filter_sort_button\),\s*getString\(open \? R\.string\.ui_indicator_expanded : R\.string\.ui_indicator_collapsed\)\)\);')
          sort_repl = '\n        btn.setText(getString(\n                R.string.ui_sort_label_with_indicator,\n                getString(R.string.filter_sort_button),\n                getString(open ? R.string.ui_sort_indicator_open : R.string.ui_sort_indicator_closed)));'
          s, count = sort_pat.subn(lambda _: sort_repl, s, count=1)
          assert count == 1, f'sort block replacements={count}'
          p.write_text(s)

          p = Path('app/src/main/java/com/gree1d/reappzuku/ui/ScanResultAdapter.java')
          s = p.read_text()
          patterns = [
              (re.compile(r'\s*holder\.appName\.setText\(context\.getString\(\s*R\.string\.ui_label_with_indicator,\s*context\.getString\(expanded \? R\.string\.ui_indicator_expanded : R\.string\.ui_indicator_collapsed\),\s*load\.appName\)\);'), '\n        holder.appName.setText(context.getString(\n                R.string.ui_label_with_indicator,\n                context.getString(expanded ? R.string.ui_indicator_expanded : R.string.ui_indicator_collapsed),\n                load.appName));'),
              (re.compile(r'\s*holder\.appName\.setText\(context\.getString\(\s*R\.string\.ui_label_with_indicator,\s*context\.getString\(R\.string\.ui_indicator_collapsed\),\s*load\.appName\)\);'), '\n                holder.appName.setText(context.getString(\n                        R.string.ui_label_with_indicator,\n                        context.getString(R.string.ui_indicator_collapsed),\n                        load.appName));'),
              (re.compile(r'\s*holder\.appName\.setText\(context\.getString\(\s*R\.string\.ui_label_with_indicator,\s*context\.getString\(R\.string\.ui_indicator_expanded\),\s*load\.appName\)\);'), '\n                holder.appName.setText(context.getString(\n                        R.string.ui_label_with_indicator,\n                        context.getString(R.string.ui_indicator_expanded),\n                        load.appName));'),
          ]
          for pat, repl in patterns:
              s, count = pat.subn(lambda _, r=repl: r, s, count=1)
              assert count == 1, f'scan block replacements={count}'
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
          git diff --name-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/values/strings.xml \
                  app/src/main/java/com/gree1d/reappzuku/ui/PresetSettingsActivity.java \
                  app/src/main/java/com/gree1d/reappzuku/ui/ScanResultAdapter.java
          git commit -m 'Preserve A17 sort indicators in resource formatting'
          git push origin HEAD:roadmap/a17-settext-i18n
