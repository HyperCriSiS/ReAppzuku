name: One-time accessibility ECM race fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout accessibility evidence branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: roadmap/accessibility-runtime-evidence
          fetch-depth: 2
      - name: Patch ECM post-install race handling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3ab14bd29f58285b983faa576819bf09b4650855"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/androidTest/java/com/gree1d/reappzuku/service/AccessibilityRuntimeInstrumentationTest.java')
          s = p.read_text()
          replacements = [
              (
                  '    private static final long EVENT_TIMEOUT_MS = 15_000L;\n'
                  '    private static final String OP_BIND_ACCESSIBILITY_SERVICE = "BIND_ACCESSIBILITY_SERVICE";\n'
                  '    private static final String OP_ACCESS_RESTRICTED_SETTINGS = "ACCESS_RESTRICTED_SETTINGS";\n',
                  '    private static final long EVENT_TIMEOUT_MS = 15_000L;\n'
                  '    private static final long ECM_SETTLE_TIMEOUT_MS = 15_000L;\n'
                  '    private static final String OP_ACCESS_RESTRICTED_SETTINGS = "ACCESS_RESTRICTED_SETTINGS";\n'
              ),
              (
                  '    private String originalAccessibilityEnabled;\n'
                  '    private String originalBindAccessibilityMode;\n'
                  '    private String originalRestrictedSettingsMode;\n',
                  '    private String originalAccessibilityEnabled;\n'
                  '    private String originalRestrictedSettingsMode;\n'
              ),
              (
                  '        originalEnabledServices = shell("settings get secure enabled_accessibility_services");\n'
                  '        originalAccessibilityEnabled = shell("settings get secure accessibility_enabled");\n'
                  '        originalBindAccessibilityMode = readAppOpMode(OP_BIND_ACCESSIBILITY_SERVICE);\n'
                  '        originalRestrictedSettingsMode = readAppOpMode(OP_ACCESS_RESTRICTED_SETTINGS);\n',
                  '        originalEnabledServices = shell("settings get secure enabled_accessibility_services");\n'
                  '        originalAccessibilityEnabled = shell("settings get secure accessibility_enabled");\n\n'
                  '        // Enhanced Confirmation Mode initializes its package AppOp asynchronously after\n'
                  '        // installation. Wait for the fresh sideloaded package to reach MODE_DEFAULT before\n'
                  '        // snapshotting or clearing the restriction, otherwise the late initializer can race\n'
                  '        // and overwrite MODE_ALLOWED after this test has already enabled the service.\n'
                  '        waitUntil(ECM_SETTLE_TIMEOUT_MS, () ->\n'
                  '                "default".equals(readAppOpMode(OP_ACCESS_RESTRICTED_SETTINGS)));\n'
                  '        originalRestrictedSettingsMode = readAppOpMode(OP_ACCESS_RESTRICTED_SETTINGS);\n'
              ),
              (
                  '        restoreSecureSetting("enabled_accessibility_services", originalEnabledServices);\n'
                  '        restoreSecureSetting("accessibility_enabled", originalAccessibilityEnabled);\n'
                  '        restoreAppOp(OP_BIND_ACCESSIBILITY_SERVICE, originalBindAccessibilityMode);\n'
                  '        restoreAppOp(OP_ACCESS_RESTRICTED_SETTINGS, originalRestrictedSettingsMode);\n',
                  '        restoreSecureSetting("enabled_accessibility_services", originalEnabledServices);\n'
                  '        restoreSecureSetting("accessibility_enabled", originalAccessibilityEnabled);\n'
                  '        restoreAppOp(OP_ACCESS_RESTRICTED_SETTINGS, originalRestrictedSettingsMode);\n'
              ),
              (
                  '        // adb-installed debug APKs are treated as sideloaded apps on current Android releases.\n'
                  '        // Simulate the state after the user has explicitly allowed the restricted Accessibility\n'
                  '        // capability; this test is about service runtime behavior, not the Settings confirmation UI.\n'
                  '        shell("appops set --user 0 " + packageName + " "\n'
                  '                + OP_BIND_ACCESSIBILITY_SERVICE + " allow");\n'
                  '        shell("appops set --user 0 " + packageName + " "\n'
                  '                + OP_ACCESS_RESTRICTED_SETTINGS + " allow");\n',
                  '        // adb-installed debug APKs are treated as sideloaded apps on current Android releases.\n'
                  '        // MODE_ALLOWED is the ECM state after the user explicitly chooses "Allow restricted\n'
                  '        // settings". The MODE_DEFAULT wait above ensures Android has finished its asynchronous\n'
                  '        // post-install initialization before we model that user decision.\n'
                  '        shell("appops set --user 0 " + packageName + " "\n'
                  '                + OP_ACCESS_RESTRICTED_SETTINGS + " allow");\n'
                  '        assertEquals("Restricted-settings AppOp did not settle to allow", "allow",\n'
                  '                readAppOpMode(OP_ACCESS_RESTRICTED_SETTINGS));\n'
              ),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement, found {count}: {old[:80]!r}')
              s = s.replace(old, new)
          if 'OP_BIND_ACCESSIBILITY_SERVICE' in s or 'originalBindAccessibilityMode' in s:
              raise SystemExit('stale bind-accessibility AppOp handling remains')
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          grep -Fq 'ECM_SETTLE_TIMEOUT_MS' app/src/androidTest/java/com/gree1d/reappzuku/service/AccessibilityRuntimeInstrumentationTest.java
          grep -Fq 'Restricted-settings AppOp did not settle to allow' app/src/androidTest/java/com/gree1d/reappzuku/service/AccessibilityRuntimeInstrumentationTest.java
          ! grep -Fq 'OP_BIND_ACCESSIBILITY_SERVICE' app/src/androidTest/java/com/gree1d/reappzuku/service/AccessibilityRuntimeInstrumentationTest.java
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add app/src/androidTest/java/com/gree1d/reappzuku/service/AccessibilityRuntimeInstrumentationTest.java
          git commit -m 'Wait for Android ECM initialization before accessibility grant'
          git push origin HEAD:roadmap/accessibility-runtime-evidence
