name: One-time accessibility UiAutomation suppression fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout accessibility evidence branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: roadmap/accessibility-runtime-evidence
          fetch-depth: 2
      - name: Stop UiAutomation from suppressing the service under test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a51384d3f10373e786f502a153e72fc7e99f39ee"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/androidTest/java/com/gree1d/reappzuku/service/AccessibilityRuntimeInstrumentationTest.java')
          s = p.read_text()
          replacements = [
              (
                  '    private Instrumentation instrumentation;\n    private Context targetContext;\n',
                  '    private Instrumentation instrumentation;\n    private UiAutomation uiAutomation;\n    private Context targetContext;\n'
              ),
              (
                  '        instrumentation = InstrumentationRegistry.getInstrumentation();\n        targetContext = instrumentation.getTargetContext();\n',
                  '        instrumentation = InstrumentationRegistry.getInstrumentation();\n        uiAutomation = instrumentation.getUiAutomation(\n                UiAutomation.FLAG_DONT_SUPPRESS_ACCESSIBILITY_SERVICES);\n        targetContext = instrumentation.getTargetContext();\n'
              ),
              (
                  '        assertTrue(editor.commit());\n    }\n\n    @Test\n',
                  '        assertTrue(editor.commit());\n        if (uiAutomation != null) {\n            uiAutomation.destroy();\n            uiAutomation = null;\n        }\n    }\n\n    @Test\n'
              ),
              (
                  '    private String shell(String command) throws Exception {\n        UiAutomation automation = instrumentation.getUiAutomation();\n        ParcelFileDescriptor descriptor = automation.executeShellCommand(command);\n',
                  '    private String shell(String command) throws Exception {\n        assertNotNull("UiAutomation must not suppress accessibility services", uiAutomation);\n        ParcelFileDescriptor descriptor = uiAutomation.executeShellCommand(command);\n'
              ),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement, found {count}: {old[:100]!r}')
              s = s.replace(old, new)
          if s.count('FLAG_DONT_SUPPRESS_ACCESSIBILITY_SERVICES') != 1:
              raise SystemExit('UiAutomation suppression flag invariant failed')
          if 'UiAutomation automation = instrumentation.getUiAutomation();' in s:
              raise SystemExit('default suppressing UiAutomation call remains')
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          grep -Fq 'FLAG_DONT_SUPPRESS_ACCESSIBILITY_SERVICES' app/src/androidTest/java/com/gree1d/reappzuku/service/AccessibilityRuntimeInstrumentationTest.java
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add app/src/androidTest/java/com/gree1d/reappzuku/service/AccessibilityRuntimeInstrumentationTest.java
          git commit -m 'Do not suppress Accessibility service during runtime test'
          git push origin HEAD:roadmap/accessibility-runtime-evidence
