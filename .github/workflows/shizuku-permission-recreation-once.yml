name: One-time real Shizuku permission recreation probe

on:
  workflow_dispatch:

concurrency:
  group: reappzuku-shizuku-permission-recreation-once
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api36-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Validate and build probe
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Prepare stable Android 16 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$SDK_ROOT/platform-tools:$PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd --force \
            --name reappzuku-api36-shizuku-recreate \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_6

          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          "$EMULATOR" -avd reappzuku-api36-shizuku-recreate \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -partition-size 4096 \
            > /tmp/reappzuku-shizuku-recreate-emulator.log 2>&1 &
          EMULATOR_PID=$!

          adb_ready=false
          for i in $(seq 1 60); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              tail -300 /tmp/reappzuku-shizuku-recreate-emulator.log || true
              exit 1
            fi
            if "$ADB" get-state >/dev/null 2>&1; then adb_ready=true; break; fi
            sleep 2
          done
          test "$adb_ready" = true

          boot_ready=false
          for i in $(seq 1 90); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then boot_ready=true; break; fi
            sleep 2
          done
          test "$boot_ready" = true
          "$ADB" shell locksettings set-disabled true || true
          "$ADB" shell wm dismiss-keyguard || true
          "$ADB" shell input keyevent 82 || true

          unlocked=false
          for i in $(seq 1 60); do
            state="$("$ADB" shell am get-started-user-state 0 2>/dev/null | tr -d '\r' || true)"
            if grep -q RUNNING_UNLOCKED <<<"$state"; then unlocked=true; break; fi
            "$ADB" shell wm dismiss-keyguard || true
            "$ADB" shell input keyevent 82 || true
            sleep 1
          done
          test "$unlocked" = true
          test "$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r')" = "36"

      - name: Install and initialize official Shizuku with permission denied
        shell: bash
        run: |
          set -euo pipefail
          SHIZUKU_URL='https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk'
          SHIZUKU_APK='/tmp/shizuku-v13.6.0.r1086.2650830c-release.apk'
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 "$SHIZUKU_URL" -o "$SHIZUKU_APK"
          echo '6e273ab0e991c4e79bc8b1bbb9b9dd739ccac1a8712a541a214078886b7b790f  /tmp/shizuku-v13.6.0.r1086.2650830c-release.apk' | sha256sum -c -

          adb install -r "$SHIZUKU_APK"
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm clear com.gree1d.reappzuku
          adb shell pm revoke com.gree1d.reappzuku moe.shizuku.manager.permission.API_V23 2>/dev/null || true
          adb shell pm grant com.gree1d.reappzuku android.permission.POST_NOTIFICATIONS 2>/dev/null || true

          SHIZUKU_APK_PATH="$(adb shell pm path moe.shizuku.privileged.api | head -1 | sed 's/^package://' | tr -d '\r')"
          SHIZUKU_CODE_DIR="${SHIZUKU_APK_PATH%/*}"
          SHIZUKU_LIB="$SHIZUKU_CODE_DIR/lib/x86_64/libshizuku.so"
          adb shell test -x "$SHIZUKU_LIB"
          adb shell "$SHIZUKU_LIB" | tee /tmp/shizuku-recreate-start.log

          server_ready=false
          for i in $(seq 1 40); do
            if [ -n "$(adb shell pidof shizuku_server 2>/dev/null | tr -d '\r' || true)" ]; then server_ready=true; break; fi
            sleep 0.25
          done
          test "$server_ready" = true

          adb shell am start -W -n moe.shizuku.privileged.api/moe.shizuku.manager.MainActivity \
            | tee /tmp/shizuku-recreate-manager-init.log
          manager_ready=false
          for i in $(seq 1 40); do
            if [ -n "$(adb shell pidof moe.shizuku.privileged.api 2>/dev/null | tr -d '\r' || true)" ]; then manager_ready=true; break; fi
            sleep 0.25
          done
          test "$manager_ready" = true
          sleep 2
          adb shell pm revoke com.gree1d.reappzuku moe.shizuku.manager.permission.API_V23 2>/dev/null || true

      - name: Recreate MainActivity behind real permission dialog and grant
        shell: bash
        run: |
          set -euo pipefail
          adb logcat -c

          adb shell am instrument -w \
            -e realPermissionRecreationProbe true \
            -e class 'com.gree1d.reappzuku.core.RealShizukuPermissionRecreationInstrumentationTest#recreateMainActivityBehindRealPermissionDialogAndRecover' \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner \
            > /tmp/recreation-instrumentation.log 2>&1 &
          INSTRUMENT_PID=$!

          recreated=false
          dialog=false
          for i in $(seq 1 160); do
            logs="$(adb logcat -d 2>/dev/null || true)"
            if grep -q 'REAL_SHIZUKU_PERMISSION_ACTIVITY_RECREATED' <<<"$logs"; then recreated=true; fi
            activities="$(adb shell dumpsys activity activities 2>/dev/null || true)"
            if grep -q 'moe.shizuku.manager.authorization.RequestPermissionActivity' <<<"$activities"; then dialog=true; fi
            if [ "$recreated" = true ] && [ "$dialog" = true ]; then break; fi
            if ! kill -0 "$INSTRUMENT_PID" 2>/dev/null; then
              cat /tmp/recreation-instrumentation.log || true
              exit 1
            fi
            sleep 0.25
          done
          echo "recreated=$recreated permission-dialog=$dialog"
          test "$recreated" = true
          test "$dialog" = true

          adb shell uiautomator dump /sdcard/reappzuku-shizuku-recreate.xml >/dev/null
          adb shell cat /sdcard/reappzuku-shizuku-recreate.xml > /tmp/reappzuku-shizuku-recreate.xml
          python3 - <<'PY' > /tmp/recreate-allow-button
          import re
          xml = open('/tmp/reappzuku-shizuku-recreate.xml', encoding='utf-8').read()
          match = re.search(r'resource-id="android:id/button1"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml)
          if not match:
              raise SystemExit('Shizuku always-allow button not found in UI hierarchy')
          x1, y1, x2, y2 = map(int, match.groups())
          print((x1 + x2) // 2, (y1 + y2) // 2)
          PY
          read -r ALLOW_X ALLOW_Y < /tmp/recreate-allow-button
          adb shell input tap "$ALLOW_X" "$ALLOW_Y"

          wait "$INSTRUMENT_PID"
          cat /tmp/recreation-instrumentation.log
          grep -q 'OK (1 test)' /tmp/recreation-instrumentation.log

          adb logcat -d > /tmp/recreation-logcat.txt
          grep -q 'REAL_SHIZUKU_PERMISSION_DIALOG_PAUSED_MAIN' /tmp/recreation-logcat.txt
          grep -q 'REAL_SHIZUKU_PERMISSION_ACTIVITY_RECREATED' /tmp/recreation-logcat.txt
          grep -q 'REAL_SHIZUKU_PERMISSION_GRANTED_AFTER_RECREATE' /tmp/recreation-logcat.txt
          grep -q 'REAL_SHIZUKU_PERMISSION_RECOVERED_AFTER_RECREATE' /tmp/recreation-logcat.txt

          adb shell dumpsys package com.gree1d.reappzuku | \
            grep -A20 'runtime permissions:' | tee /tmp/recreation-permissions.txt
          grep -q 'moe.shizuku.manager.permission.API_V23: granted=true' /tmp/recreation-permissions.txt

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          cat /tmp/recreation-instrumentation.log 2>/dev/null || true
          cat /tmp/reappzuku-shizuku-recreate.xml 2>/dev/null || true
          adb shell dumpsys activity activities | head -320 || true
          adb shell dumpsys package com.gree1d.reappzuku | head -320 || true
          adb logcat -d -t 1600 | grep -E 'ReAppzuku|Shizuku|RequestPermission|ReAppzukuShizukuRecreate' || true
          cat /tmp/shizuku-recreate-start.log 2>/dev/null || true
          cat /tmp/shizuku-recreate-manager-init.log 2>/dev/null || true
          tail -300 /tmp/reappzuku-shizuku-recreate-emulator.log || true

      - name: Stop emulator
        if: always()
        run: adb emu kill || true
