name: One-time PackageStateSource integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ondemand-shizuku
          fetch-depth: 0

      - name: Apply validated read-only process-source refactor
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/package-state-source.patch
          git apply --check /tmp/package-state-source.patch
          git apply /tmp/package-state-source.patch
          git diff --check
          grep -q 'PackageStateSource packageStateSource' app/src/main/java/com/gree1d/reappzuku/manager/BackgroundAppManager.java
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add app/src/main/java/com/gree1d/reappzuku/manager/BackgroundAppManager.java
          git commit -m 'Route running-process reads through PackageStateSource'
          git push origin HEAD:ondemand-shizuku
