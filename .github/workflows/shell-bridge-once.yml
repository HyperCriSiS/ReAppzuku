name: One-time ShellManager bridge instrumentation gate

on:
  push:
    branches: [ondemand-shizuku]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: contains(github.event.head_commit.message, '[shell-bridge-gate]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: true
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Assemble deterministic Shizuku seam
        run: |
          cp .github/staging/ShizukuBridge.java app/src/main/java/com/gree1d/reappzuku/core/ShizukuBridge.java
          cp .github/staging/ShellManagerStateInstrumentationTest.java app/src/androidTest/java/com/gree1d/reappzuku/core/ShellManagerStateInstrumentationTest.java
          python3 .github/scripts/patch_shell_manager_bridge.py
      - name: Validate bridge seam and instrumentation compilation
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug
      - name: Commit validated ShellManager bridge coverage
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/gree1d/reappzuku/core/ShellManager.java \
                  app/src/main/java/com/gree1d/reappzuku/core/ShizukuBridge.java \
                  app/src/androidTest/java/com/gree1d/reappzuku/core/ShellManagerStateInstrumentationTest.java
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git commit -m 'Add deterministic Shizuku backend instrumentation seam'
          git push origin HEAD:ondemand-shizuku
