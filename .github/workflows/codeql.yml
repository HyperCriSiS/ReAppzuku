name: CodeQL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkpoint-phase9:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}

      - name: Update roadmap and AI session checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path("docs/ROADMAP.md")
          text = roadmap.read_text()
          old = "- [ ] Validate the completed model on API 37 plus physical/OEM devices, including install-notification flow and conflicting legacy configurations."
          new = "- [~] Validate the completed model on API 37 plus physical/OEM devices, including install-notification flow and conflicting legacy configurations. Deterministic API-37 completed-model coverage passed in run `37149945404`; physical/OEM release-diversity evidence remains open."
          if old not in text:
              raise SystemExit("ROADMAP target line not found")
          roadmap.write_text(text.replace(old, new, 1))

          state = Path("docs/AI_SESSION_STATE.md")
          text = state.read_text()
          text = text.replace("Updated: 2026-10-04", "Updated: 2026-10-07", 1)

          old = "Branch: `phase9-api37-completed-model-validation`  \\nValidated head before documentation refresh: `071186c8504541aea58345552923f1b1c8fcf3f1`"
          new = "Merged PR: #73  \\nMerge commit: `8533894b9716030609b148c675e5049312e10ed4`  \\nValidated implementation head: `071186c8504541aea58345552923f1b1c8fcf3f1`"
          if old not in text:
              raise SystemExit("AI state merge target not found")
          text = text.replace(old, new, 1)

          old = "- Fresh standard + CodeQL validation for the final documented branch head is being run before merge."
          new = "- Final standard validation and CodeQL passed on the PR head.\\n- GitHub Advanced Security agent execution failed only because the GitHub Copilot monthly quota was exhausted (HTTP 402); no code/security finding was reported, and `main` does not require that check as a merge gate."
          if old not in text:
              raise SystemExit("AI state validation target not found")
          text = text.replace(old, new, 1)

          old = """**Close completed-model validation and move to release-diversity evidence**

          1. Merge the API-37 completed-model validation branch after final standard/CodeQL gates are green.
          2. Record at least one physical/OEM pass for the install-notification/deep-link path and canonical conflict resolution as release-diversity evidence.
          3. Keep deterministic API-37 coverage as the implementation gate; do not block future source work on repeated emulator evidence already proven here."""
          new = """**Release-diversity evidence + dependency maintenance**

          1. Record at least one physical/OEM pass for the install-notification/deep-link path and canonical conflict resolution as release-diversity evidence.
          2. Keep deterministic API-37 coverage as the implementation gate; do not block future source work on repeated emulator evidence already proven here.
          3. Dependency PRs #71 (WorkManager 2.12.0) and #72 (Core KTX 1.19.1) currently fail only because strict Gradle verification metadata/locks have not been refreshed; update them through the reviewed dependency-assurance path before merge."""
          if old not in text:
              raise SystemExit("AI state next-unit target not found")
          state.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff -- docs/ROADMAP.md docs/AI_SESSION_STATE.md

      - name: Commit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md docs/AI_SESSION_STATE.md
          git diff --cached --quiet && { echo "No checkpoint changes generated."; exit 1; }
          git commit -m "Checkpoint completed Phase 9 API 37 validation"
          git push origin "HEAD:${{ github.ref_name }}"
