name: CodeQL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkpoint-dependency-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}

      - name: Update AI session checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/AI_SESSION_STATE.md")
          text = path.read_text()

          old = "3. Dependency PRs #71 (WorkManager 2.12.0) and #72 (Core KTX 1.19.1) currently fail only because strict Gradle verification metadata/locks have not been refreshed; update them through the reviewed dependency-assurance path before merge."
          new = "3. WorkManager 2.12.0 is integrated through PR #76 / merge `2982d13a7814f93492660976241207e777aae015` with Gradle-generated lock/SHA-256 verification metadata and green standard/API-37/CodeQL gates. Core KTX 1.19.1 (#72) is intentionally deferred to a future AGP 9.5 toolchain evaluation because it causes broad transitive lock changes without a current product requirement."
          if old not in text:
              raise SystemExit("dependency next-work target not found")
          text = text.replace(old, new, 1)

          marker = "## Current Phase 9 architecture state"
          block = """### Dependency assurance maintenance — 2026-10-07

          - WorkManager was updated from 2.11.1 to 2.12.0 in PR #76 / merge `2982d13a7814f93492660976241207e777aae015`.
          - Gradle 9.8.0 regenerated dependency locks and SHA-256 verification metadata from resolved artifacts before review; the final PR contains only the version change, two lockfile version replacements and the four new WorkManager artifact checksums.
          - Branch-exact validation passed: standard `37553836083`, Android 17 / API 37 runtime `37553682771`, and CodeQL. The API-37 lane passed PACKAGE_ADDED fallback, general instrumentation, completed Phase 9 model validation, external component abuse probing and launcher smoke.
          - GitHub Advanced Security agent execution again failed only because the Copilot monthly quota was exhausted (HTTP 402), not because of a code/security finding.
          - Dependabot PR #71 was closed as superseded by #76. Core KTX 1.19.1 PR #72 was intentionally closed/deferred because its transitive dependency churn is not justified on the current AGP 9.4.1 line.

          """
          if "### Dependency assurance maintenance — 2026-10-07" not in text:
              if marker not in text:
                  raise SystemExit("architecture marker not found")
              text = text.replace(marker, block + marker, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- docs/AI_SESSION_STATE.md

      - name: Commit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AI_SESSION_STATE.md
          git diff --cached --quiet && { echo "No checkpoint changes generated."; exit 1; }
          git commit -m "Checkpoint WorkManager dependency assurance"
          git push origin "HEAD:${{ github.ref_name }}"
