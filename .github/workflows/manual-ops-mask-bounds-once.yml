name: One-time manual AppOps mask bounds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout topic branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: roadmap/manual-ops-mask-bounds
          fetch-depth: 1
      - name: Integrate manual AppOps mask policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c46d057edb3432249de5a1dc624148485fbad110"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one target, found {count}')
              p.write_text(s.replace(old, new, 1))

          backup = 'app/src/main/java/com/gree1d/reappzuku/core/BackupManager.java'
          replace_once(backup,
              'import com.gree1d.reappzuku.manager.PresetManager;\n',
              'import com.gree1d.reappzuku.manager.BackgroundAppManager;\nimport com.gree1d.reappzuku.manager.PresetManager;\n')
          replace_once(backup,
              '            int mask = prefs.getInt(KEY_MANUAL_OPS_PREFIX + pkg, 0x01);\n            masks.put(pkg, mask);',
              '            int storedMask = prefs.getInt(KEY_MANUAL_OPS_PREFIX + pkg, 0x01);\n            int mask = ManualOpsMaskPolicy.sanitize(storedMask, BackgroundAppManager.ALL_OPS.length);\n            masks.put(pkg, mask);')
          replace_once(backup,
              '            editor.putInt(KEY_MANUAL_OPS_PREFIX + pkg, masks.getInt(pkg));\n            count++;',
              '            int mask = masks.getInt(pkg);\n            ManualOpsMaskPolicy.requireKnownBits(mask, BackgroundAppManager.ALL_OPS.length);\n            editor.putInt(KEY_MANUAL_OPS_PREFIX + pkg, mask);\n            count++;')

          manager = 'app/src/main/java/com/gree1d/reappzuku/manager/BackgroundAppManager.java'
          replace_once(manager,
              'import com.gree1d.reappzuku.core.AppDebugManager;\n',
              'import com.gree1d.reappzuku.core.AppDebugManager;\nimport com.gree1d.reappzuku.core.ManualOpsMaskPolicy;\n')
          replace_once(manager,
              '''    public int getManualOpsMask(String packageName) {\n        return sharedpreferences.getInt(KEY_MANUAL_OPS_PREFIX + packageName, 0x01);\n    }\n\n    public void saveManualOpsMask(String packageName, int mask) {\n        sharedpreferences.edit().putInt(KEY_MANUAL_OPS_PREFIX + packageName, mask).apply();\n        AppDebugManager.d(Category.BACKGROUND_RESTRICTIONS, FILE_NAME + ": saveManualOpsMask " + packageName + " mask=0x" + Integer.toHexString(mask)\n                + " ops=" + describeOpsMask(mask));\n    }''',
              '''    public int getManualOpsMask(String packageName) {\n        int storedMask = sharedpreferences.getInt(KEY_MANUAL_OPS_PREFIX + packageName, 0x01);\n        return ManualOpsMaskPolicy.sanitize(storedMask, ALL_OPS.length);\n    }\n\n    public void saveManualOpsMask(String packageName, int mask) {\n        int boundedMask = ManualOpsMaskPolicy.sanitize(mask, ALL_OPS.length);\n        sharedpreferences.edit().putInt(KEY_MANUAL_OPS_PREFIX + packageName, boundedMask).apply();\n        AppDebugManager.d(Category.BACKGROUND_RESTRICTIONS, FILE_NAME + ": saveManualOpsMask " + packageName + " mask=0x" + Integer.toHexString(boundedMask)\n                + " ops=" + describeOpsMask(boundedMask));\n    }''')
          replace_once(manager,
              '''    int[] applyManualOps(String packageName, int opsMask, String mode) {\n        int selectedCount = Integer.bitCount(opsMask);\n        AppDebugManager.d(Category.BACKGROUND_RESTRICTIONS, FILE_NAME + ": applyManualOps → " + packageName + " mode=" + mode\n                + " mask=0x" + Integer.toHexString(opsMask)\n                + " selectedOps=" + selectedCount + "/" + ALL_OPS.length);''',
              '''    int[] applyManualOps(String packageName, int opsMask, String mode) {\n        int boundedOpsMask = ManualOpsMaskPolicy.sanitize(opsMask, ALL_OPS.length);\n        int selectedCount = Integer.bitCount(boundedOpsMask);\n        AppDebugManager.d(Category.BACKGROUND_RESTRICTIONS, FILE_NAME + ": applyManualOps → " + packageName + " mode=" + mode\n                + " mask=0x" + Integer.toHexString(boundedOpsMask)\n                + " selectedOps=" + selectedCount + "/" + ALL_OPS.length);''')
          replace_once(manager,
              '            if ((opsMask & (1 << i)) == 0) {',
              '            if ((boundedOpsMask & (1 << i)) == 0) {')
          replace_once(manager,
              '        return new int[]{ok, fail, failedMask, opsMask, skippedMask};',
              '        return new int[]{ok, fail, failedMask, boundedOpsMask, skippedMask};')

          test = 'app/src/androidTest/java/com/gree1d/reappzuku/core/BackupManagerRestoreTest.java'
          replace_once(test,
              'import com.gree1d.reappzuku.manager.PresetManager;\n',
              'import com.gree1d.reappzuku.manager.BackgroundAppManager;\nimport com.gree1d.reappzuku.manager.PresetManager;\n')
          marker = '    @Test\n    public void rollbackHelperRestoresMainAndPresetSnapshots() throws Exception {'
          inserted = '''    @Test\n    public void unknownManualOpsBitsAreRejectedBeforeDurableRestoreWrite() throws Exception {\n        String packageName = "com.example.manual";\n        String maskKey = PreferenceKeys.KEY_MANUAL_OPS_PREFIX + packageName;\n        assertTrue(prefs.edit()\n                .putBoolean(KEY_EXIT_ON_BACK, false)\n                .putInt(maskKey, 0x01)\n                .commit());\n\n        int unknownBit = 1 << BackgroundAppManager.ALL_OPS.length;\n        JSONObject backup = new JSONObject()\n                .put(KEY_EXIT_ON_BACK, true)\n                .put("manual_ops_masks", new JSONObject().put(packageName, unknownBit));\n\n        BackupManager manager = new BackupManager(context);\n\n        assertFalse(manager.restoreBackupJson(backup.toString()));\n        assertFalse(prefs.getBoolean(KEY_EXIT_ON_BACK, true));\n        assertEquals(0x01, prefs.getInt(maskKey, -1));\n    }\n\n    @Test\n    public void rollbackHelperRestoresMainAndPresetSnapshots() throws Exception {'''
          replace_once(test, marker, inserted)
          PY
          git diff --check
          test "$(git status --porcelain | wc -l)" -eq 3
          grep -q 'ManualOpsMaskPolicy.requireKnownBits' app/src/main/java/com/gree1d/reappzuku/core/BackupManager.java
          grep -q 'boundedOpsMask' app/src/main/java/com/gree1d/reappzuku/manager/BackgroundAppManager.java
          grep -q 'unknownManualOpsBitsAreRejectedBeforeDurableRestoreWrite' app/src/androidTest/java/com/gree1d/reappzuku/core/BackupManagerRestoreTest.java
          git config user.name HyperCriSiS
          git config user.email dev.github@w3b.world
          git add app/src/main/java/com/gree1d/reappzuku/core/BackupManager.java app/src/main/java/com/gree1d/reappzuku/manager/BackgroundAppManager.java app/src/androidTest/java/com/gree1d/reappzuku/core/BackupManagerRestoreTest.java
          git commit -m 'Apply manual AppOps mask bounds to backup and runtime'
          git push origin HEAD:roadmap/manual-ops-mask-bounds
