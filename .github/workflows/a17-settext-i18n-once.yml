name: One-time A17 SetTextI18n cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: roadmap/a17-settext-i18n
          fetch-depth: 0
      - name: Replace visible string construction with resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, f'{path}: expected one occurrence of {old!r}, got {s.count(old)}'
              p.write_text(s.replace(old, new, 1))

          p = Path('app/src/main/res/values/strings.xml')
          s = p.read_text()
          marker = '</resources>'
          additions = '''    <!-- Language-neutral UI formatting / literal shell command labels. -->
              <string name="command_pm_suspend" translatable="false">pm suspend</string>
              <string name="command_pm_disable" translatable="false">pm disable</string>
              <string name="ui_indicator_expanded" translatable="false">▼</string>
              <string name="ui_indicator_collapsed" translatable="false">▶</string>
              <string name="ui_label_with_indicator" translatable="false">%1$s %2$s</string>
              <string name="ui_time_range_value" translatable="false">%1$s – %2$s</string>
          '''
          for name in ['command_pm_suspend','command_pm_disable','ui_indicator_expanded','ui_indicator_collapsed','ui_label_with_indicator','ui_time_range_value']:
              assert f'name="{name}"' not in s, name
          assert s.count(marker) == 1
          p.write_text(s.replace(marker, additions + marker, 1))

          p = Path('app/src/main/java/com/gree1d/reappzuku/ui/FilterAppsAdapter.java')
          s = p.read_text()
          assert s.count('setText("pm suspend")') == 2
          assert s.count('setText("pm disable")') == 2
          s = s.replace('setText("pm suspend")', 'setText(context.getString(R.string.command_pm_suspend))')
          s = s.replace('setText("pm disable")', 'setText(context.getString(R.string.command_pm_disable))')
          p.write_text(s)

          replace_once(
              'app/src/main/java/com/gree1d/reappzuku/ui/PresetSettingsActivity.java',
              '''        binding.textPresetTimeRange.setText(
                  formatTime(workingModel.startHour, workingModel.startMinute, use24h)
                  + " – "
                  + formatTime(workingModel.endHour, workingModel.endMinute, use24h));''',
              '''        binding.textPresetTimeRange.setText(getString(
                  R.string.ui_time_range_value,
                  formatTime(workingModel.startHour, workingModel.startMinute, use24h),
                  formatTime(workingModel.endHour, workingModel.endMinute, use24h)));''')
          replace_once(
              'app/src/main/java/com/gree1d/reappzuku/ui/PresetSettingsActivity.java',
              '        btn.setText(getString(R.string.filter_sort_button) + (open ? "  ▲" : "  ▼"));',
              '''        btn.setText(getString(
                  R.string.ui_label_with_indicator,
                  getString(R.string.filter_sort_button),
                  getString(open ? R.string.ui_indicator_expanded : R.string.ui_indicator_collapsed)));''')

          p = Path('app/src/main/java/com/gree1d/reappzuku/ui/ScanResultAdapter.java')
          s = p.read_text()
          replacements = {
              '        holder.appName.setText((expanded ? "▼ " : "▶ ") + load.appName);':
                  '''        holder.appName.setText(context.getString(
                  R.string.ui_label_with_indicator,
                  context.getString(expanded ? R.string.ui_indicator_expanded : R.string.ui_indicator_collapsed),
                  load.appName));''',
              '                holder.appName.setText("▶ " + load.appName);':
                  '''                holder.appName.setText(context.getString(
                      R.string.ui_label_with_indicator,
                      context.getString(R.string.ui_indicator_collapsed),
                      load.appName));''',
              '                holder.appName.setText("▼ " + load.appName);':
                  '''                holder.appName.setText(context.getString(
                      R.string.ui_label_with_indicator,
                      context.getString(R.string.ui_indicator_expanded),
                      load.appName));''',
          }
          for old, new in replacements.items():
              assert s.count(old) == 1, old
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/lint-baseline.xml')
          s = p.read_text()
          pattern = re.compile(r'\n    <issue\n        id="SetTextI18n".*?\n    </issue>\n', re.S)
          s, count = pattern.subn('\n', s)
          assert count == 9, f'expected 9 SetTextI18n baseline entries, removed {count}'
          assert 'id="SetTextI18n"' not in s
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 5
          git diff --name-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/values/strings.xml \
                  app/src/main/java/com/gree1d/reappzuku/ui/FilterAppsAdapter.java \
                  app/src/main/java/com/gree1d/reappzuku/ui/PresetSettingsActivity.java \
                  app/src/main/java/com/gree1d/reappzuku/ui/ScanResultAdapter.java \
                  app/lint-baseline.xml
          git commit -m 'Replace A17 visible text concatenation with resources'
          git push origin HEAD:roadmap/a17-settext-i18n
