name: One-time roadmap evidence audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout roadmap branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: false

      - name: Print evidence-sensitive roadmap lines
        run: |
          set -euo pipefail
          echo '=== ROADMAP ==='
          grep -nEi -C2 'Shizuku permission|force-stop|process death|reboot|alarm|backup|shortcut|physical|real Shizuku|root execution|runtime' docs/ROADMAP.md || true
          echo '=== CHECK_MATRIX ==='
          grep -nEi -C2 'A01|A03|A09|A11|A16|CM-P0-01|CM-P0-03|CM-P1-01|CM-P1-02|CM-P1-03|CM-P1-10|CM-P2-02|Shizuku|force-stop|reboot|backup|shortcut' docs/CHECK_MATRIX.md || true
