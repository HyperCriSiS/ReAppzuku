name: One-time preset import boundary patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          fetch-depth: 1

      - name: Reuse bounded backup URI reader for preset imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/gree1d/reappzuku/manager/PresetManager.java')
          s = p.read_text()
          old_import = '''import com.gree1d.reappzuku.core.Clock;\nimport com.gree1d.reappzuku.core.ScheduleTime;'''
          new_import = '''import com.gree1d.reappzuku.core.Clock;\nimport com.gree1d.reappzuku.core.BackupFileStore;\nimport com.gree1d.reappzuku.core.ScheduleTime;'''
          if s.count(old_import) != 1:
              raise SystemExit('Expected Clock/ScheduleTime import anchor exactly once')
          s = s.replace(old_import, new_import)
          s = s.replace('import java.io.ByteArrayOutputStream;\n', '')
          s = s.replace('import java.io.InputStream;\n', '')
          old = '''        try (InputStream is = context.getContentResolver().openInputStream(uri)) {\n            if (is == null) throw new IOException("InputStream is null for uri: " + uri);\n            ByteArrayOutputStream buffer = new ByteArrayOutputStream();\n            byte[] chunk = new byte[4096];\n            int read;\n            while ((read = is.read(chunk)) != -1) {\n                buffer.write(chunk, 0, read);\n            }\n            JSONObject json = new JSONObject(buffer.toString("UTF-8"));'''
          new = '''        try {\n            String payload = new BackupFileStore(context.getContentResolver()).read(uri);\n            JSONObject json = new JSONObject(payload);'''
          if s.count(old) != 1:
              raise SystemExit('Expected unbounded preset import block exactly once')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          grep -F 'new BackupFileStore(context.getContentResolver()).read(uri)' app/src/main/java/com/gree1d/reappzuku/manager/PresetManager.java
          ! grep -Fq 'ByteArrayOutputStream' app/src/main/java/com/gree1d/reappzuku/manager/PresetManager.java
          ! grep -Fq 'openInputStream(uri)' app/src/main/java/com/gree1d/reappzuku/manager/PresetManager.java
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add app/src/main/java/com/gree1d/reappzuku/manager/PresetManager.java
          git commit -m 'Bound standalone preset import reads'
          git push origin HEAD:ondemand-shizuku
