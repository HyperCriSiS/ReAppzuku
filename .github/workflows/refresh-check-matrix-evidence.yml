name: Refresh CHECK_MATRIX final evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-check-matrix-evidence.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out matrix branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: roadmap/check-matrix-refresh
          fetch-depth: 0

      - name: Refresh current assurance evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/CHECK_MATRIX.md')
          text = p.read_text()

          a16_old = '| A16 | Exported surfaces: shortcuts / tiles / receivers / widget | DECIDED | Shortcut confused-deputy routing has an explicit principal policy (`f3145bb0`, `34154664082`) and manifest/documentation parity plus platform permissions are regression-tested (`34138775145`). The former one-shot external attacker check is now a permanent API-37 regression: `securityProbe` is a no-permission APK under a UID distinct from ReAppzuku; branch run `34668594681` and final branch run `34670073539` proved no Binder exposure from Accessibility/Quick Tiles and denial of explicit foreign `BOOT_COMPLETED`. The same lane is integrated into `main`; OEM/launcher/widget-host diversity remains release evidence. |'
          a16_new = '| A16 | Exported surfaces: shortcuts / tiles / receivers / widget | DECIDED | Shortcut confused-deputy routing has an explicit principal policy (`f3145bb0`, `34154664082`) and manifest/documentation parity plus platform permissions are regression-tested (`34138775145`). The former one-shot external attacker check is now a permanent API-37 regression: `securityProbe` is a no-permission APK under a UID distinct from ReAppzuku; branch run `34668594681`, final branch run `34670073539`, merged-main run `34670295954`, and post-HiddenApi main run `34670916924` proved no Binder exposure from Accessibility/Quick Tiles and denial of explicit foreign `BOOT_COMPLETED`. OEM/launcher/widget-host diversity remains release evidence. |'

          a18_old = '| A18 | Build / CI / dependencies / supply chain | DECIDED | Source-authoritative least-privilege CI, immutable Action SHA pins, zero-error lint, dependency locking/verification and stable tag/source/APK version binding are enforced. Gradle is now 9.7.1 with the binary distribution SHA-256 pinned; branch normal/API-37 validation passed in `34668406587` / `34667821759`, and main normal revalidation passed in `34668611855`. The signed-release task graph is explicitly scoped to `:app:` so the permanent `securityProbe` test module cannot enter release builds. Physical release signing/rollback evidence remains open. |'
          a18_new = '| A18 | Build / CI / dependencies / supply chain | DECIDED | Source-authoritative least-privilege CI, immutable Action SHA pins, zero-error lint, dependency locking/verification and stable tag/source/APK version binding are enforced. Gradle is now 9.7.1 with the binary distribution SHA-256 pinned; final main normal/API-37 validation after security-probe integration and HiddenApiBypass removal passed in `34671036949` / `34670916924`. The signed-release task graph is explicitly scoped to `:app:` so the permanent `securityProbe` test module cannot enter release builds. As of 2026-09-12 GitHub reports zero open Dependabot alerts and zero open secret-scanning alerts; Code Scanning/CodeQL has no analysis result yet, so that evidence remains open. Physical release signing/rollback evidence also remains open. |'

          latest = 'Latest assurance evidence:\n'
          latest_new = '''Latest assurance evidence:\n- workflow run `34671036949`: final `main` normal validation after permanent API-37 security-probe integration and HiddenApiBypass removal passed unit tests, lint, AndroidTest compilation, Room schema verification and debug APK build/upload;\n- workflow run `34670916924`: final `main` Android 17/API 37 gate after HiddenApiBypass removal built and installed app + androidTest + separate no-permission `securityProbe`, passed instrumentation, external foreign-UID abuse probe and launcher crash smoke;\n- workflow run `34670295954`: first merged-main API-37 validation of the permanent external `securityProbe` passed build/install, instrumentation, foreign Binder/broadcast abuse checks and launcher smoke;\n- workflow run `34670291980`: first merged-main normal validation of the permanent external security-probe product line passed all normal source/build gates;\n- workflow run `34668611855`: `main` normal validation passed after the Gradle wrapper moved to 9.7.1 with distribution checksum pinning;\n- repository security state checked 2026-09-12: zero open Dependabot alerts and zero open secret-scanning alerts. Code scanning/CodeQL has no analysis result yet, so no CodeQL pass is claimed; this remains an assurance gap rather than a green check;\n'''

          release_ux = '- **Release UX:** continue broader runtime accessibility/i18n/error-recovery checks beyond deterministic source/policy gates.\n'
          code_scanning = '- **Code scanning:** enable and validate CodeQL/code-scanning analysis with immutable action pins; current repository state has no Code Scanning analysis result, so no pass is claimed yet.\n'

          for old, new, label in ((a16_old, a16_new, 'A16'), (a18_old, a18_new, 'A18')):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one old row, found {text.count(old)}')
              text = text.replace(old, new, 1)

          if text.count(latest) != 1:
              raise SystemExit(f'latest evidence anchor count={text.count(latest)}')
          text = text.replace(latest, latest_new, 1)

          if code_scanning not in text:
              if text.count(release_ux) != 1:
                  raise SystemExit(f'release UX anchor count={text.count(release_ux)}')
              text = text.replace(release_ux, release_ux + code_scanning, 1)

          p.write_text(text)
          PY

          git diff --check
          grep -F '34671036949' docs/CHECK_MATRIX.md
          grep -F '34670916924' docs/CHECK_MATRIX.md
          grep -F 'zero open Dependabot alerts' docs/CHECK_MATRIX.md
          grep -F 'Code Scanning/CodeQL has no analysis result yet' docs/CHECK_MATRIX.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CHECK_MATRIX.md
          git diff --cached --quiet && { echo 'No evidence changes produced'; exit 1; }
          git commit -m 'Refresh current assurance evidence'
          git push origin HEAD:roadmap/check-matrix-refresh
