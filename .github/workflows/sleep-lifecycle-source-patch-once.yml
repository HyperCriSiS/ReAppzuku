name: One-time Sleep Mode lifecycle source patch

on:
  workflow_dispatch:

concurrency:
  group: sleep-lifecycle-source-patch-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Apply exact reviewed Sleep Mode lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/maintenance/sleep-lifecycle.patch.part* > /tmp/sleep-lifecycle.patch
          git apply --check /tmp/sleep-lifecycle.patch
          git apply /tmp/sleep-lifecycle.patch
          git diff --check

      - name: Validate patched source before committing
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest
          ./gradlew lintDebug
          ./gradlew assembleDebugAndroidTest

      - name: Commit validated source and remove one-time machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/sleep-lifecycle-source-patch-once.yml
          git rm .github/maintenance/sleep-lifecycle.patch.part0
          git rm .github/maintenance/sleep-lifecycle.patch.part1
          git rm .github/maintenance/sleep-lifecycle.patch.part2
          git add app/src/main/java/com/gree1d/reappzuku/manager/SleepModeManager.java
          git add app/src/main/java/com/gree1d/reappzuku/service/ShappkyService.java
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden Sleep Mode lifecycle recovery'
          git push origin HEAD:${{ github.ref_name }}
