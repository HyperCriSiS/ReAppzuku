name: Android 17 API 37 runtime compatibility

on:
  workflow_dispatch:
    inputs:
      product_ref:
        description: Product branch or commit to test
        required: true
        default: main
        type: string
      test_class:
        description: Optional fully qualified instrumentation class or class#method
        required: false
        default: ''
        type: string

concurrency:
  group: android17-api37-runtime-${{ inputs.product_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api37-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.product_ref }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Prepare Android 17 toolchain
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CLT_ZIP=/tmp/commandlinetools-linux-15859902_latest.zip
          CLT_HOME="$SDK_ROOT/cmdline-tools/reappzuku-15859902"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' \
            -o "$CLT_ZIP"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/commandlinetools-linux-15859902_latest.zip' | sha256sum -c -
          rm -rf /tmp/android-clt "$CLT_HOME"
          mkdir -p /tmp/android-clt "$CLT_HOME"
          unzip -q "$CLT_ZIP" -d /tmp/android-clt
          cp -a /tmp/android-clt/cmdline-tools/. "$CLT_HOME/"
          "$CLT_HOME/bin/sdkmanager" --sdk_root="$SDK_ROOT" --version
          echo "$CLT_HOME/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install Android 17 emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CLT_HOME="$SDK_ROOT/cmdline-tools/reappzuku-15859902"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          IMAGE='system-images;android-37.0;google_apis_ps16k;x86_64'
          yes | "$CLT_HOME/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$CLT_HOME/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            'platform-tools' \
            'emulator' \
            'platforms;android-37.0' \
            "$IMAGE"
          "$CLT_HOME/bin/sdkmanager" --sdk_root="$SDK_ROOT" --list_installed | grep -F "$IMAGE"
          echo no | "$CLT_HOME/bin/avdmanager" create avd \
            --force \
            --name reappzuku-api37 \
            --package "$IMAGE" \
            --device pixel_6
          AVD_DIR="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          grep -F 'target=android-37.0' "$AVD_DIR/reappzuku-api37.ini"
          grep -F 'image.sysdir.1=system-images/android-37.0/google_apis_ps16k/x86_64/' "$AVD_DIR/reappzuku-api37.avd/config.ini"

      - name: Boot Android 17 emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi
          nohup emulator @reappzuku-api37 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-metrics \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            > /tmp/api37-emulator.log 2>&1 &
          echo "$!" > /tmp/api37-emulator.pid
          adb wait-for-device
          timeout 360 bash -c '
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
              sleep 2
            done
          '
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = '37'
          adb shell input keyevent 82 || true
          adb shell wm dismiss-keyguard || true
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          consecutive_ready=0
          for i in $(seq 1 80); do
            if adb shell cmd package list packages android >/tmp/pkg-ready.txt 2>/tmp/pkg-ready.err \
              && grep -Fq 'package:android' /tmp/pkg-ready.txt; then
              consecutive_ready=$((consecutive_ready + 1))
              [ "$consecutive_ready" -ge 3 ] && break
            else
              consecutive_ready=0
            fi
            sleep 1
          done
          test "$consecutive_ready" -ge 3
          echo "Android $(adb shell getprop ro.build.version.release | tr -d '\r') / API 37 ready"

      - name: Build app, instrumentation and external security probe APKs
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'compileSdk = 37' app/build.gradle
          grep -F 'targetSdk = 37' app/build.gradle
          grep -F 'include(":securityProbe")' settings.gradle
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :securityProbe:assembleDebug

      - name: Install targetSdk 37 app, instrumentation and external probe
        shell: bash
        run: |
          set -euo pipefail
          install_with_retry() {
            local apk="$1"
            local label="$2"
            for attempt in 1 2 3; do
              local log="/tmp/install-${label}-attempt-${attempt}.log"
              if adb install -r -t "$apk" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log" >&2
              adb shell cmd package list packages android >/dev/null 2>&1 || true
              sleep 3
            done
            return 1
          }
          APP_APK='app/build/outputs/apk/debug/app-debug.apk'
          TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*.apk' | head -n 1)"
          PROBE_APK="$(find securityProbe/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -f "$APP_APK"
          test -f "$TEST_APK"
          test -f "$PROBE_APK"
          install_with_retry "$APP_APK" app
          install_with_retry "$TEST_APK" androidTest
          install_with_retry "$PROBE_APK" securityProbe
          dump="$(adb shell dumpsys package com.gree1d.reappzuku | tr -d '\r')"
          grep -Fq 'targetSdk=37' <<<"$dump"
          grep -Fq 'versionName=1.8.7' <<<"$dump"
          probe_dump="$(adb shell dumpsys package com.reappzuku.securityprobe | tr -d '\r')"
          grep -Fq 'targetSdk=37' <<<"$probe_dump"
          app_uid="$(sed -n 's/.*userId=\([0-9][0-9]*\).*/\1/p' <<<"$dump" | head -n 1)"
          probe_uid="$(sed -n 's/.*userId=\([0-9][0-9]*\).*/\1/p' <<<"$probe_dump" | head -n 1)"
          test -n "$app_uid"
          test -n "$probe_uid"
          test "$app_uid" != "$probe_uid"
          printf 'product uid=%s; external security probe uid=%s\n' "$app_uid" "$probe_uid" | tee /tmp/api37-security-probe-uids.txt

      - name: Run Android instrumentation on API 37
        shell: bash
        env:
          TEST_CLASS: ${{ inputs.test_class }}
        run: |
          set -euo pipefail
          INSTRUMENTATION="$(
            adb shell pm list instrumentation \
              | tr -d '\r' \
              | sed -n 's/^instrumentation:\([^ ]*\) (target=com.gree1d.reappzuku)$/\1/p' \
              | head -n 1
          )"
          test -n "$INSTRUMENTATION"
          args=()
          if [ -n "$TEST_CLASS" ]; then
            args=(-e class "$TEST_CLASS")
          fi
          adb shell am instrument -w -r "${args[@]}" "$INSTRUMENTATION" | tee /tmp/api37-instrumentation.txt
          grep -Eq 'OK \([0-9]+ tests?\)' /tmp/api37-instrumentation.txt
          ! grep -Fq 'FAILURES!!!' /tmp/api37-instrumentation.txt

      - name: Run external component abuse probe
        shell: bash
        run: |
          set -euo pipefail
          adb logcat -c
          adb shell am force-stop com.reappzuku.securityprobe
          adb shell am start -W -n com.reappzuku.securityprobe/.ProbeActivity \
            > /tmp/api37-security-probe-start.txt 2>&1
          passed=0
          for i in $(seq 1 20); do
            adb logcat -d -s ReAppzukuSecurityProbe:I '*:S' \
              > /tmp/api37-security-probe.txt 2>&1 || true
            if grep -Fq 'RESULT=FAIL' /tmp/api37-security-probe.txt; then
              cat /tmp/api37-security-probe.txt
              exit 1
            fi
            if grep -Fq 'RESULT=PASS' /tmp/api37-security-probe.txt; then
              passed=1
              break
            fi
            sleep 1
          done
          cat /tmp/api37-security-probe-start.txt
          cat /tmp/api37-security-probe.txt
          test "$passed" -eq 1
          ! grep -Fq 'BINDER_EXPOSED=' /tmp/api37-security-probe.txt
          grep -Fq 'BOOT_BROADCAST_DENIED' /tmp/api37-security-probe.txt

      - name: Launcher smoke test on targetSdk 37
        shell: bash
        run: |
          set -euo pipefail
          adb shell am force-stop com.gree1d.reappzuku
          adb logcat -c
          adb shell monkey \
            -p com.gree1d.reappzuku \
            -c android.intent.category.LAUNCHER \
            1 >/tmp/api37-monkey.txt 2>&1 || true
          sleep 8
          adb logcat -d -b crash > /tmp/api37-crash.txt
          if grep -q 'com.gree1d.reappzuku' /tmp/api37-crash.txt; then
            cat /tmp/api37-crash.txt
            exit 1
          fi
          adb shell dumpsys package com.gree1d.reappzuku \
            | grep -E 'versionName=|targetSdk=' \
            | head -20

      - name: Collect API 37 evidence
        if: always()
        shell: bash
        run: |
          mkdir -p api37-evidence
          for file in /tmp/api37-emulator.log /tmp/api37-instrumentation.txt /tmp/api37-monkey.txt /tmp/api37-crash.txt /tmp/api37-security-probe*.txt /tmp/install-*.log; do
            if [ -f "$file" ]; then
              cp "$file" api37-evidence/
            fi
          done
          adb shell getprop ro.build.version.release > api37-evidence/android-release.txt 2>/dev/null || true
          adb shell getprop ro.build.version.sdk > api37-evidence/android-api.txt 2>/dev/null || true
          adb shell dumpsys package com.gree1d.reappzuku > api37-evidence/reappzuku-package.txt 2>/dev/null || true
          adb shell dumpsys package com.reappzuku.securityprobe > api37-evidence/security-probe-package.txt 2>/dev/null || true

      - name: Upload API 37 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android17-api37-evidence
          path: api37-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK_ROOT/platform-tools:$PATH"
          adb emu kill || true
