name: Remove unused HiddenApiBypass

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-hidden-api-bypass.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: roadmap/remove-hidden-api-bypass
          fetch-depth: 0

      - name: Remove unused dependency and stale metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          build = Path('app/build.gradle')
          text = build.read_text()
          needle = '    implementation("org.lsposed.hiddenapibypass:hiddenapibypass:4.3")\n'
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one build dependency, found {text.count(needle)}')
          build.write_text(text.replace(needle, '', 1))

          lock = Path('app/gradle.lockfile')
          text = lock.read_text()
          before = text
          text = ''.join(line for line in text.splitlines(keepends=True) if not line.startswith('org.lsposed.hiddenapibypass:hiddenapibypass:'))
          if text == before:
              raise SystemExit('HiddenApiBypass lock entry not found')
          lock.write_text(text)

          verification = Path('gradle/verification-metadata.xml')
          text = verification.read_text()
          pattern = r'      <component group="org\.lsposed\.hiddenapibypass" name="hiddenapibypass" version="4\.3">\n.*?      </component>\n'
          text, count = re.subn(pattern, '', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected exactly one verification block, found {count}')
          verification.write_text(text)

          source = Path('app/src/main/java/com/gree1d/reappzuku/core/shell/ShizukuUserServiceImpl.java')
          text = source.read_text()
          old = '    // android.app.ActivityThread is a hidden/internal API not present in the public SDK\n    // android.jar, so it cannot be imported or called directly — same constraint as the\n    // HiddenApiBypass reflection used elsewhere in this project for USS. This UserService\n    // process has no normal Application/Activity lifecycle of its own, so this is the only\n    // way to obtain a Context here for ActivityManager.getSystemService().\n'
          new = '    // android.app.ActivityThread is a hidden/internal API not present in the public SDK\n    // android.jar, so it cannot be imported or called directly. This isolated UserService\n    // process has no normal Application/Activity lifecycle of its own, so reflection is used\n    // only to obtain a Context here for ActivityManager.getSystemService().\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale comment, found {text.count(old)}')
          source.write_text(text.replace(old, new, 1))
          PY

          if grep -RInE 'HiddenApiBypass|hiddenapibypass|org\.lsposed' app/src app/build.gradle app/gradle.lockfile gradle/verification-metadata.xml; then
            echo 'HiddenApiBypass references remain after cleanup' >&2
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/gradle.lockfile gradle/verification-metadata.xml app/src/main/java/com/gree1d/reappzuku/core/shell/ShizukuUserServiceImpl.java
          git diff --cached --quiet && { echo 'No cleanup changes produced'; exit 1; }
          git commit -m 'Remove unused HiddenApiBypass dependency'
          git push origin HEAD:roadmap/remove-hidden-api-bypass
