name: Remove unused HiddenApiBypass

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-hidden-api-bypass.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: roadmap/remove-hidden-api-bypass
          fetch-depth: 0

      - name: Remove unused dependency and stale metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle')
          text = build.read_text()
          needle = '    implementation("org.lsposed.hiddenapibypass:hiddenapibypass:4.3")\n'
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one build dependency, found {text.count(needle)}')
          build.write_text(text.replace(needle, '', 1))

          lock = Path('app/gradle.lockfile')
          text = lock.read_text()
          lines = [line for line in text.splitlines(keepends=True)
                   if not line.startswith('org.lsposed.hiddenapibypass:hiddenapibypass:')]
          if len(lines) == len(text.splitlines(keepends=True)):
              raise SystemExit('HiddenApiBypass lock entry not found')
          lock.write_text(''.join(lines))

          verification = Path('gradle/verification-metadata.xml')
          text = verification.read_text()
          block = '''      <component group="org.lsposed.hiddenapibypass" name="hiddenapibypass" version="4.3">
         <artifact name="hiddenapibypass-4.3.aar">
            <sha256 value="e9c2b90785b8c0d49aaa5f723a83d8c51d9789cd4f2b1ecf6e3335e6fc561201" origin="Generated by Gradle"/>
         </artifact>
         <artifact name="hiddenapibypass-4.3.module">
            <sha256 value="b7b000ac010e52e9be1a5087807363e249653e59c0b53703b02ea2c46d9e72ea" origin="Generated by Gradle"/>
         </artifact>
      </component>
'''
          if text.count(block) != 1:
              raise SystemExit(f'expected exactly one verification block, found {text.count(block)}')
          verification.write_text(text.replace(block, '', 1))

          source = Path('app/src/main/java/com/gree1d/reappzuku/core/shell/ShizukuUserServiceImpl.java')
          text = source.read_text()
          old = '''    // android.app.ActivityThread is a hidden/internal API not present in the public SDK
    // android.jar, so it cannot be imported or called directly — same constraint as the
    // HiddenApiBypass reflection used elsewhere in this project for USS. This UserService
    // process has no normal Application/Activity lifecycle of its own, so this is the only
    // way to obtain a Context here for ActivityManager.getSystemService().
'''
          new = '''    // android.app.ActivityThread is a hidden/internal API not present in the public SDK
    // android.jar, so it cannot be imported or called directly. This isolated UserService
    // process has no normal Application/Activity lifecycle of its own, so reflection is used
    // only to obtain a Context here for ActivityManager.getSystemService().
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale comment, found {text.count(old)}')
          source.write_text(text.replace(old, new, 1))
          PY

          if grep -RInE 'HiddenApiBypass|hiddenapibypass|org\.lsposed' app/src app/build.gradle app/gradle.lockfile gradle/verification-metadata.xml; then
            echo 'HiddenApiBypass references remain after cleanup' >&2
            exit 1
          fi
          git diff --check
          git diff -- app/build.gradle app/gradle.lockfile gradle/verification-metadata.xml app/src/main/java/com/gree1d/reappzuku/core/shell/ShizukuUserServiceImpl.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/gradle.lockfile gradle/verification-metadata.xml app/src/main/java/com/gree1d/reappzuku/core/shell/ShizukuUserServiceImpl.java
          git diff --cached --quiet && { echo 'No cleanup changes produced'; exit 1; }
          git commit -m 'Remove unused HiddenApiBypass dependency'
          git push origin HEAD:roadmap/remove-hidden-api-bypass
