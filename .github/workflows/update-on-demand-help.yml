name: Update localized On-demand help

on:
  push:
    branches:
      - roadmap/on-demand-help

permissions:
  contents: write

jobs:
  update-help:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: roadmap/on-demand-help
          fetch-depth: 0

      - name: Add On-demand mode help to all supported guides
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          entries = [
              ("docs/HELP.md", "### ⚙️ App stability", "**On-demand mode**", ""),
              ("docs/HELP_DE.md", "### ⚙️ App Stabilität", "**On-demand-Modus**", ""),
              ("docs/HELP_ES.md", "### ⚙️ Estabilidad de la app", "**Modo bajo demanda**", ""),
              ("docs/HELP_RU.md", "### ⚙️ Стабильность приложения", "**Режим по запросу**", ""),
              ("docs/HELP_UK.md", "### ⚙️ Стабільність застосунку", "**Режим на вимогу**", ""),
              ("docs/HELP_ZH.md", "### ⚙️ 应用稳定性 <a id=\"应用稳定性\"></a>", "**按需模式**", "")
          ]

          changed = []
          for filename, heading, marker, encoded in entries:
              path = Path(filename)
              text = path.read_bytes().decode("utf-8")
              if marker in text:
                  continue
              newline = "\r\n" if "\r\n" in text else "\n"
              start = text.find(heading)
              if start < 0:
                  raise RuntimeError(f"Heading not found in {filename}: {heading}")
              separator = newline + "---" + newline
              pos = text.find(separator, start)
              if pos < 0:
                  raise RuntimeError(f"Section separator not found in {filename}")
              block = base64.b64decode(encoded).decode("utf-8").replace("\n", newline)
              text = text[:pos] + newline + block + text[pos:]
              path.write_bytes(text.encode("utf-8"))
              changed.append(filename)

          print("Updated:", ", ".join(changed) if changed else "already current")
          PY

      - name: Commit localized help update
        shell: bash
        run: |
          if git diff --quiet -- docs/HELP.md docs/HELP_DE.md docs/HELP_ES.md docs/HELP_RU.md docs/HELP_UK.md docs/HELP_ZH.md; then
            echo "No documentation changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HELP.md docs/HELP_DE.md docs/HELP_ES.md docs/HELP_RU.md docs/HELP_UK.md docs/HELP_ZH.md
          git commit -m "Document On-demand mode across help locales"
          git push origin HEAD:roadmap/on-demand-help
