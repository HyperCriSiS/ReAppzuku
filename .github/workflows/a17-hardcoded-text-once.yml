name: One-time A17 HardcodedText cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A17 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: roadmap/a17-hardcoded-text
          fetch-depth: 1

      - name: Replace remaining hardcoded UI text with resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences of {old!r}, got {actual}')
              p.write_text(text.replace(old, new))

          replace_exact('app/src/main/res/layout/activity_settings.xml', 'android:text="Debug"', 'android:text="@string/settings_debug_title"')
          replace_exact('app/src/main/res/layout/activity_settings.xml', 'android:text="Debug menu"', 'android:text="@string/settings_debug_menu_title"')
          replace_exact('app/src/main/res/layout/activity_statistics.xml', 'android:text="—"', 'android:text="@string/detail_activity_none"', 3)
          replace_exact('app/src/main/res/layout/dialog_top_offenders.xml', 'android:text="No offenders for this period"', 'android:text="@string/stats_top_offenders_empty"')
          replace_exact('app/src/main/res/layout/item.xml', 'android:text="System"', 'android:text="@string/filter_system"')
          replace_exact('app/src/main/res/layout/item.xml', 'android:text="Persistent"', 'android:text="@string/badge_persistent"')
          replace_exact('app/src/main/res/layout/item_filter_app.xml', 'android:contentDescription="App Icon"', 'android:contentDescription="@string/filter_app_icon_content_description"')
          replace_exact('app/src/main/res/layout/item_trigger.xml', 'android:text="▶"', 'android:text="@string/ui_indicator_collapsed"')

          p = Path('app/src/main/res/layout/dialog_preset_time_range.xml')
          text = p.read_text()
          root_old = 'xmlns:android="http://schemas.android.com/apk/res/android"\n'
          root_new = 'xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools"\n'
          if text.count(root_old) != 1:
              raise SystemExit('dialog_preset_time_range.xml: unexpected root namespace')
          text = text.replace(root_old, root_new)
          for value in ('08:00', '20:00'):
              old = f'android:text="{value}"'
              new = f'tools:text="{value}"'
              if text.count(old) != 1:
                  raise SystemExit(f'dialog_preset_time_range.xml: expected one {old}')
              text = text.replace(old, new)
          p.write_text(text)

          translations = {
              'app/src/main/res/values/strings.xml': {
                  'settings_debug_title': 'Debug',
                  'settings_debug_menu_title': 'Debug menu',
                  'badge_persistent': 'Persistent',
                  'filter_app_icon_content_description': 'App icon',
              },
              'app/src/main/res/values-es/strings.xml': {
                  'settings_debug_title': 'Depuración',
                  'settings_debug_menu_title': 'Menú de depuración',
                  'badge_persistent': 'Persistente',
                  'filter_app_icon_content_description': 'Icono de la aplicación',
              },
              'app/src/main/res/values-ru/strings.xml': {
                  'settings_debug_title': 'Отладка',
                  'settings_debug_menu_title': 'Меню отладки',
                  'badge_persistent': 'Постоянное',
                  'filter_app_icon_content_description': 'Значок приложения',
              },
              'app/src/main/res/values-uk/strings.xml': {
                  'settings_debug_title': 'Налагодження',
                  'settings_debug_menu_title': 'Меню налагодження',
                  'badge_persistent': 'Постійний',
                  'filter_app_icon_content_description': 'Піктограма застосунку',
              },
              'app/src/main/res/values-zh-rCN/strings.xml': {
                  'settings_debug_title': '调试',
                  'settings_debug_menu_title': '调试菜单',
                  'badge_persistent': '常驻',
                  'filter_app_icon_content_description': '应用图标',
              },
          }
          for path, values in translations.items():
              p = Path(path)
              text = p.read_text()
              for key in values:
                  if f'name="{key}"' in text:
                      raise SystemExit(f'{path}: duplicate string {key}')
              insertion = '\n' + '\n'.join(
                  f'    <string name="{key}">{value}</string>' for key, value in values.items()
              ) + '\n'
              if text.count('</resources>') != 1:
                  raise SystemExit(f'{path}: unexpected resources close count')
              p.write_text(text.replace('</resources>', insertion + '</resources>'))

          p = Path('app/lint-baseline.xml')
          text = p.read_text()
          before = text.count('id="HardcodedText"')
          if before != 12:
              raise SystemExit(f'expected 12 HardcodedText baseline entries, got {before}')
          pattern = re.compile(r'\n    <issue\n        id="HardcodedText".*?\n    </issue>\n', re.S)
          text, removed = pattern.subn('\n', text)
          if removed != 12 or 'id="HardcodedText"' in text:
              raise SystemExit(f'HardcodedText baseline removal mismatch: {removed}')
          p.write_text(text)
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 13
          ! grep -Fq 'id="HardcodedText"' app/lint-baseline.xml
          git diff --stat

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lint-baseline.xml app/src/main/res/layout app/src/main/res/values/strings.xml app/src/main/res/values-es/strings.xml app/src/main/res/values-ru/strings.xml app/src/main/res/values-uk/strings.xml app/src/main/res/values-zh-rCN/strings.xml
          git commit -m 'Replace remaining hardcoded UI text with resources'
          git push origin HEAD:roadmap/a17-hardcoded-text
