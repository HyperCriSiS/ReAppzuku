name: One-time ProcessAnalyzer API 36 service dump fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku

      - name: Apply package-filtered service dump fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          analyzer = Path('app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessAnalyzer.java')
          text = analyzer.read_text()
          import_anchor = 'import com.gree1d.reappzuku.core.AppDebugManager;\n'
          assert text.count(import_anchor) == 1
          text = text.replace(import_anchor,
              import_anchor + 'import com.gree1d.reappzuku.core.PackageNameValidator;\n', 1)

          old_call = '''        String output = analyzer.getShellManager().runShellCommandAndGetFullOutput(\n                "dumpsys activity services " + packageName);'''
          new_call = '''        String output = analyzer.getShellManager().runShellCommandAndGetFullOutput(\n                buildServicesDumpCommand(packageName));'''
          assert text.count(old_call) == 1
          text = text.replace(old_call, new_call, 1)

          marker = '// ---- analyzeServicesAndBindings ----\n'
          assert text.count(marker) == 1
          helper = '''// ---- buildServicesDumpCommand ----\n    static String buildServicesDumpCommand(String packageName) {\n        return "dumpsys activity -p " + PackageNameValidator.requireValid(packageName) + " services";\n    }\n\n'''
          text = text.replace(marker, helper + marker, 1)
          analyzer.write_text(text)

          runtime = Path('app/src/androidTest/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessDumpParserRuntimeInstrumentationTest.java')
          r = runtime.read_text()
          old_runtime = '''                serviceDump = shellManager.runShellCommandAndGetFullOutput(\n                        "dumpsys activity services");'''
          new_runtime = '''                serviceDump = shellManager.runShellCommandAndGetFullOutput(\n                        ProcessAnalyzer.buildServicesDumpCommand(packageName));'''
          assert r.count(old_runtime) == 1
          r = r.replace(old_runtime, new_runtime, 1)
          r = r.replace('unfiltered dumpsys activity services returned null',
                        'package-filtered dumpsys activity services returned null')
          r = r.replace('unfiltered dumpsys activity services returned empty output',
                        'package-filtered dumpsys activity services returned empty output')
          r = r.replace('API36_UNFILTERED_SERVICE_RECORD_PARSED',
                        'API36_PACKAGE_FILTERED_SERVICE_RECORD_PARSED')
          runtime.write_text(r)
          PY

          cat > app/src/test/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessAnalyzerCommandTest.java <<'EOF'
          package com.gree1d.reappzuku.utils.triggers.analyzers;

          import static org.junit.Assert.assertEquals;
          import static org.junit.Assert.assertThrows;

          import org.junit.Test;

          public class ProcessAnalyzerCommandTest {
              @Test
              public void servicesDumpUsesGlobalPackageFilterBeforeSubcommand() {
                  assertEquals(
                          "dumpsys activity -p com.example.app services",
                          ProcessAnalyzer.buildServicesDumpCommand("com.example.app"));
              }

              @Test
              public void servicesDumpRejectsShellMetacharacters() {
                  assertThrows(IllegalArgumentException.class, () ->
                          ProcessAnalyzer.buildServicesDumpCommand("com.example.app;id"));
              }
          }
          EOF

          grep -Fq 'dumpsys activity -p ' app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessAnalyzer.java
          ! grep -Fq '"dumpsys activity services " + packageName' app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessAnalyzer.java

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Validate product branch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug

      - name: Commit validated product fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- gradlew
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessAnalyzer.java \
                  app/src/androidTest/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessDumpParserRuntimeInstrumentationTest.java \
                  app/src/test/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessAnalyzerCommandTest.java
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Fix package-filtered activity service dump command'
          git push origin HEAD:ondemand-shizuku
