name: One-time ShappkyService shell readiness fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: true

      - name: Apply service readiness fix
        shell: bash
        env:
          OLD_BLOCK_B64: ''
          NEW_BLOCK_B64: ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('app/src/main/java/com/gree1d/reappzuku/service/ShappkyService.java')
          text = p.read_text()
          old_import = 'import com.gree1d.reappzuku.core.ShellManager;\n'
          new_import = old_import + 'import com.gree1d.reappzuku.core.ShellBackendState;\n'
          assert text.count(old_import) == 1
          assert 'import com.gree1d.reappzuku.core.ShellBackendState;' not in text
          old = base64.b64decode(os.environ['OLD_BLOCK_B64']).decode()
          new = base64.b64decode(os.environ['NEW_BLOCK_B64']).decode()
          assert text.count(old) == 1
          text = text.replace(old_import, new_import, 1).replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Validate product branch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Commit validated product fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- gradlew
          expected='app/src/main/java/com/gree1d/reappzuku/service/ShappkyService.java'
          mapfile -t changed < <(git status --short | sed -E 's/^...//')
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$expected"
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add -- "$expected"
          git commit -m 'Wait for shell backend before queued service actions'
          git push origin HEAD:ondemand-shizuku
