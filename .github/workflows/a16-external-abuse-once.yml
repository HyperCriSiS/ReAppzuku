name: One-time A16 external entrypoint abuse probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entrypoint-abuse:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ondemand-shizuku
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Generate unprivileged attacker APK
        shell: bash
        run: |
          set -euo pipefail
          cat >> settings.gradle <<'EOF'
          include(":abuseProbe")
          EOF
          mkdir -p abuseProbe/src/main/java/com/gree1d/reappzuku/probe abuseProbe/src/main
          cat > abuseProbe/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace = 'com.gree1d.reappzuku.probe'
              compileSdk = 37
              defaultConfig {
                  applicationId = 'com.gree1d.reappzuku.probe'
                  minSdk = 24
                  targetSdk = 37
                  versionCode = 1
                  versionName = '1.0'
              }
          }
          EOF
          cat > abuseProbe/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".ProbeActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > abuseProbe/src/main/java/com/gree1d/reappzuku/probe/ProbeActivity.java <<'EOF'
          package com.gree1d.reappzuku.probe;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.ContentProviderClient;
          import android.content.Context;
          import android.content.Intent;
          import android.content.ServiceConnection;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.IBinder;

          public final class ProbeActivity extends Activity {
              private static final String PRODUCT = "com.gree1d.reappzuku";

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  SharedPreferences.Editor out = getSharedPreferences("results", MODE_PRIVATE).edit().clear();
                  out.putString("probe_uid_package", getPackageName());
                  out.putBoolean("accessibility_denied", bindDenied(
                          "com.gree1d.reappzuku.service.AppLaunchAccessibilityService"));
                  out.putBoolean("quick_tile_denied", bindDenied(
                          "com.gree1d.reappzuku.utils.ShappkyQuickTile"));
                  out.putBoolean("background_tile_denied", bindDenied(
                          "com.gree1d.reappzuku.utils.ShappkyBackgroundKillTile"));
                  out.putBoolean("shizuku_provider_denied", providerDenied());
                  out.putBoolean("boot_broadcast_denied", bootBroadcastDenied());
                  if (!out.commit()) {
                      throw new IllegalStateException("Could not persist probe results");
                  }
                  finish();
              }

              private boolean bindDenied(String className) {
                  Intent intent = new Intent().setComponent(new ComponentName(PRODUCT, className));
                  ServiceConnection connection = new ServiceConnection() {
                      @Override public void onServiceConnected(ComponentName name, IBinder service) {}
                      @Override public void onServiceDisconnected(ComponentName name) {}
                  };
                  try {
                      boolean bound = bindService(intent, connection, Context.BIND_AUTO_CREATE);
                      if (bound) unbindService(connection);
                      return false;
                  } catch (SecurityException expected) {
                      return true;
                  }
              }

              private boolean providerDenied() {
                  ContentProviderClient client = null;
                  try {
                      client = getContentResolver().acquireUnstableContentProviderClient(
                              Uri.parse("content://com.gree1d.reappzuku.shizuku"));
                      return false;
                  } catch (SecurityException expected) {
                      return true;
                  } finally {
                      if (client != null) client.close();
                  }
              }

              private boolean bootBroadcastDenied() {
                  try {
                      Intent intent = new Intent(Intent.ACTION_BOOT_COMPLETED)
                              .setComponent(new ComponentName(
                                      PRODUCT, "com.gree1d.reappzuku.core.BootReceiver"));
                      sendBroadcast(intent);
                      return false;
                  } catch (SecurityException expected) {
                      return true;
                  }
              }
          }
          EOF
          git diff --check
          ./gradlew :app:assembleDebug :abuseProbe:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s abuseProbe/build/outputs/apk/debug/abuseProbe-debug.apk

      - name: Prepare Android 17 toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CLT_ZIP=/tmp/commandlinetools-linux-15859902_latest.zip
          CLT_HOME="$SDK_ROOT/cmdline-tools/reappzuku-15859902"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' \
            -o "$CLT_ZIP"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/commandlinetools-linux-15859902_latest.zip' | sha256sum -c -
          rm -rf /tmp/android-clt "$CLT_HOME"
          mkdir -p /tmp/android-clt "$CLT_HOME"
          unzip -q "$CLT_ZIP" -d /tmp/android-clt
          cp -a /tmp/android-clt/cmdline-tools/. "$CLT_HOME/"
          echo "$CLT_HOME/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install and boot API 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CLT_HOME="$SDK_ROOT/cmdline-tools/reappzuku-15859902"
          IMAGE='system-images;android-37.0;google_apis_ps16k;x86_64'
          yes | "$CLT_HOME/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$CLT_HOME/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            'platform-tools' 'emulator' 'platforms;android-37.0' "$IMAGE"
          echo no | "$CLT_HOME/bin/avdmanager" create avd \
            --force --name reappzuku-abuse37 --package "$IMAGE" --device pixel_6
          [ ! -e /dev/kvm ] || sudo chmod 666 /dev/kvm || true
          nohup emulator @reappzuku-abuse37 \
            -no-window -no-audio -no-boot-anim -no-metrics -no-snapshot -wipe-data \
            -gpu swiftshader_indirect >/tmp/a16-emulator.log 2>&1 &
          adb wait-for-device
          timeout 360 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = '37'
          adb shell input keyevent 82 || true
          adb shell wm dismiss-keyguard || true

      - name: Run foreign-principal abuse probe
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT='com.gree1d.reappzuku'
          ATTACKER='com.gree1d.reappzuku.probe'
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk | tee /tmp/install-product.txt
          adb install -r -t abuseProbe/build/outputs/apk/debug/abuseProbe-debug.apk | tee /tmp/install-attacker.txt
          adb shell dumpsys package "$PRODUCT" | grep -F 'targetSdk=37'
          adb shell dumpsys package "$ATTACKER" | grep -F 'targetSdk=37'

          PRODUCT_UID="$(adb shell dumpsys package "$PRODUCT" | sed -n 's/^[[:space:]]*userId=//p' | head -n 1 | tr -d '\r')"
          ATTACKER_UID="$(adb shell dumpsys package "$ATTACKER" | sed -n 's/^[[:space:]]*userId=//p' | head -n 1 | tr -d '\r')"
          test -n "$PRODUCT_UID"
          test -n "$ATTACKER_UID"
          test "$PRODUCT_UID" != "$ATTACKER_UID"
          printf 'product_uid=%s attacker_uid=%s\n' "$PRODUCT_UID" "$ATTACKER_UID" | tee /tmp/a16-uids.txt

          adb shell am force-stop "$PRODUCT"
          adb shell am start -W -n "$ATTACKER/.ProbeActivity" | tee /tmp/attacker-launch.txt
          for i in $(seq 1 20); do
            if adb shell run-as "$ATTACKER" cat shared_prefs/results.xml > /tmp/a16-results.xml 2>/dev/null; then
              grep -Fq 'name="boot_broadcast_denied" value="true"' /tmp/a16-results.xml && break
            fi
            sleep 0.5
          done
          cat /tmp/a16-results.xml
          grep -Fq 'name="accessibility_denied" value="true"' /tmp/a16-results.xml
          grep -Fq 'name="quick_tile_denied" value="true"' /tmp/a16-results.xml
          grep -Fq 'name="background_tile_denied" value="true"' /tmp/a16-results.xml
          grep -Fq 'name="shizuku_provider_denied" value="true"' /tmp/a16-results.xml
          grep -Fq 'name="boot_broadcast_denied" value="true"' /tmp/a16-results.xml

          # None of the rejected probes may bootstrap the privileged foreground service.
          if adb shell dumpsys activity services "$PRODUCT" | grep -Fq 'ShappkyService'; then
            echo 'Unexpected privileged ShappkyService startup after foreign abuse probes' >&2
            exit 1
          fi
          echo 'A16 external protected-entrypoint abuse probe passed'

      - name: Collect evidence
        if: always()
        shell: bash
        run: |
          mkdir -p a16-evidence
          for f in /tmp/a16-emulator.log /tmp/install-product.txt /tmp/install-attacker.txt /tmp/a16-uids.txt /tmp/attacker-launch.txt /tmp/a16-results.xml; do
            [ ! -f "$f" ] || cp "$f" a16-evidence/
          done
          adb shell dumpsys package com.gree1d.reappzuku > a16-evidence/product-package.txt 2>/dev/null || true
          adb shell dumpsys package com.gree1d.reappzuku.probe > a16-evidence/attacker-package.txt 2>/dev/null || true
          adb shell dumpsys activity services com.gree1d.reappzuku > a16-evidence/product-services.txt 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a16-api37-external-abuse-evidence
          path: a16-evidence/
          retention-days: 7

      - name: Stop emulator
        if: always()
        shell: bash
        run: adb emu kill || true
