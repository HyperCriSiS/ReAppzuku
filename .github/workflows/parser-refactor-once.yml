name: One-time parser refactor gate

on:
  push:
    branches:
      - ondemand-shizuku
    paths:
      - '.github/workflows/parser-refactor-once.yml'
      - '.github/scripts/apply_process_parser_refactor.py'
      - 'app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessDumpParser.java'
      - 'app/src/test/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessDumpParserTest.java'
      - 'app/src/test/java/com/gree1d/reappzuku/core/ProtectedAppsTest.java'

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: true
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Verify and apply ProcessAnalyzer refactor
        run: |
          set -euo pipefail
          target=app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessAnalyzer.java
          test "$(git hash-object "$target")" = "2e7bbdf94590b37d3e506ee5838b7cdf7e7044b8"
          python3 .github/scripts/apply_process_parser_refactor.py
          git diff --check
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = "$target"
      - name: Validate parser fixtures and app build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug
      - name: Commit ProcessAnalyzer refactor
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          target=app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/ProcessAnalyzer.java
          git add "$target"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --check
          git commit -m "Use fixture-tested dumpsys parser"
          git push origin HEAD:ondemand-shizuku
