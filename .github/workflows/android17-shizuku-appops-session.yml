name: Android 17 real Shizuku AppOps session-loss probe

on:
  workflow_dispatch:
    inputs:
      product_ref:
        description: Exact PR implementation commit to exercise (no floating main)
        type: string
        required: true

concurrency:
  group: android17-shizuku-appops-${{ inputs.product_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-shizuku-appops:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: read
    steps:
      - name: Checkout exact product commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.product_ref }}
          persist-credentials: false

      - name: Configure JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Prepare SHA-256 pinned Android 17 toolchain
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CLT_ZIP=/tmp/commandlinetools-linux-15859902_latest.zip
          CLT_HOME="$SDK_ROOT/cmdline-tools/reappzuku-15859902"
          curl --fail --location --http1.1 --proto '=https' --tlsv1.2 --retry 3 \
            'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' \
            -o "$CLT_ZIP"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/commandlinetools-linux-15859902_latest.zip' | sha256sum -c -
          rm -rf /tmp/android-clt "$CLT_HOME"
          mkdir -p /tmp/android-clt "$CLT_HOME"
          unzip -q "$CLT_ZIP" -d /tmp/android-clt
          cp -a /tmp/android-clt/cmdline-tools/. "$CLT_HOME/"
          echo "$CLT_HOME/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Build product and real-session instrumented tests
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/androidTest/java/com/gree1d/reappzuku/core/RealShizukuPinnedAppOpsSessionInstrumentationTest.java
          grep -Fq 'compileSdk = 37' app/build.gradle
          grep -Fq 'targetSdk = 37' app/build.gradle
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Boot disposable Android 17 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CLT_HOME="$SDK_ROOT/cmdline-tools/reappzuku-15859902"
          export ANDROID_SDK_ROOT="$SDK_ROOT" ANDROID_HOME="$SDK_ROOT"
          IMAGE='system-images;android-37.0;google_apis_ps16k;x86_64'
          yes | "$CLT_HOME/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$CLT_HOME/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            'platform-tools' 'emulator' 'platforms;android-37.0' "$IMAGE"
          echo no | "$CLT_HOME/bin/avdmanager" create avd \
            --force --name reappzuku-shizuku-appops --package "$IMAGE" --device pixel_6
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          nohup emulator @reappzuku-shizuku-appops \
            -no-window -no-audio -no-boot-anim -no-metrics -no-snapshot \
            -wipe-data -gpu swiftshader_indirect -partition-size 4096 \
            >/tmp/rz-shizuku-emulator.log 2>&1 &
          adb wait-for-device
          timeout 360 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = '37'
          test "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" = '1'
          adb shell input keyevent 82 || true
          adb shell wm dismiss-keyguard || true
          consecutive=0
          for attempt in $(seq 1 80); do
            if adb shell cmd package list packages android >/tmp/rz-pkg-ready.txt 2>/dev/null \
              && grep -Fq 'package:android' /tmp/rz-pkg-ready.txt; then
              consecutive=$((consecutive+1))
              [ "$consecutive" -ge 3 ] && break
            else
              consecutive=0
            fi
            sleep 1
          done
          test "$consecutive" -ge 3

      - name: Install checksum-pinned official Shizuku and ReAppzuku
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/shizuku-v13.6.0.r1086.2650830c-release.apk
          curl --fail --location --http1.1 --proto '=https' --tlsv1.2 --retry 3 \
            'https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk' \
            -o "$APK"
          echo '6e273ab0e991c4e79bc8b1bbb9b9dd739ccac1a8712a541a214078886b7b790f  /tmp/shizuku-v13.6.0.r1086.2650830c-release.apk' | sha256sum -c -
          adb install -r "$APK"
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*.apk' | sort | head -n 1)"
          test -f "$TEST_APK"
          adb install -r -t "$TEST_APK"
          test -n "$(adb shell pm path moe.shizuku.privileged.api)"
          test -n "$(adb shell pm path com.gree1d.reappzuku)"

      - name: Start actual official Shizuku shell daemon
        shell: bash
        run: |
          set -euo pipefail
          SHIZUKU_APK_PATH="$(adb shell pm path moe.shizuku.privileged.api | tr -d '\r' | sed -n '1s/^package://p')"
          test -n "$SHIZUKU_APK_PATH"
          SHIZUKU_LIB="${SHIZUKU_APK_PATH%/*}/lib/x86_64/libshizuku.so"
          adb shell test -x "$SHIZUKU_LIB"
          adb shell "$SHIZUKU_LIB" > /tmp/rz-shizuku-start.txt
          ready=false
          for attempt in $(seq 1 80); do
            if [ -n "$(adb shell pidof shizuku_server 2>/dev/null | tr -d '\r' || true)" ]; then
              ready=true
              break
            fi
            sleep 0.25
          done
          test "$ready" = true
          echo "original-shizuku-pid=$(adb shell pidof shizuku_server | tr -d '\r')"
          echo "$SHIZUKU_LIB" > /tmp/rz-shizuku-lib-path

      - name: Approve real Shizuku authorization dialog on disposable emulator
        shell: bash
        run: |
          set -euo pipefail
          adb shell am start -W -n moe.shizuku.privileged.api/moe.shizuku.manager.MainActivity \
            > /tmp/rz-shizuku-manager-start.txt
          for attempt in $(seq 1 40); do
            if [ -n "$(adb shell pidof moe.shizuku.privileged.api 2>/dev/null | tr -d '\r' || true)" ]; then break; fi
            sleep 0.25
          done
          sleep 2
          adb shell pm revoke com.gree1d.reappzuku moe.shizuku.manager.permission.API_V23 2>/dev/null || true
          adb shell am start -W -n com.gree1d.reappzuku/.ui.MainActivity \
            > /tmp/rz-app-start.txt
          found=false
          for attempt in $(seq 1 120); do
            if adb shell dumpsys activity activities 2>/dev/null \
              | grep -Fq 'moe.shizuku.manager.authorization.RequestPermissionActivity'; then
              found=true
              break
            fi
            sleep 0.25
          done
          test "$found" = true
          adb shell uiautomator dump /sdcard/rz-shizuku-appops.xml >/dev/null
          adb shell cat /sdcard/rz-shizuku-appops.xml > /tmp/rz-shizuku-permission.xml
          python3 - <<'PY' > /tmp/rz-shizuku-allow-coordinates
          import re
          xml = open('/tmp/rz-shizuku-permission.xml', encoding='utf-8').read()
          match = re.search(r'resource-id="android:id/button1"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml)
          if not match:
              raise SystemExit('Expected genuine Shizuku permission button not found')
          x1, y1, x2, y2 = map(int, match.groups())
          print((x1+x2)//2, (y1+y2)//2)
          PY
          read -r x y < /tmp/rz-shizuku-allow-coordinates
          adb shell input tap "$x" "$y"
          granted=false
          for attempt in $(seq 1 120); do
            if adb shell dumpsys package com.gree1d.reappzuku \
              | grep -A20 'runtime permissions:' \
              | grep -Fq 'moe.shizuku.manager.permission.API_V23: granted=true'; then
              granted=true
              break
            fi
            sleep 0.25
          done
          test "$granted" = true
          adb shell am force-stop com.gree1d.reappzuku || true

      - name: Kill and restart actual Shizuku daemon across pinned read-only AppOps GET
        shell: bash
        run: |
          set -euo pipefail
          adb logcat -c
          TEST='com.gree1d.reappzuku.core.RealShizukuPinnedAppOpsSessionInstrumentationTest'
          (timeout 200 adb shell am instrument -w -r \
            -e realShizukuPinnedAppOpsProbe true -e class "$TEST" \
            com.gree1d.reappzuku.test/androidx.test.runner.AndroidJUnitRunner \
            >/tmp/rz-shizuku-appops-instrumentation.txt 2>&1) &
          probe_pid=$!
          cleanup_probe() {
            if kill -0 "$probe_pid" 2>/dev/null; then
              kill "$probe_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_probe EXIT
          wait_marker() {
            local marker="$1" max_iterations="$2"
            for attempt in $(seq 1 "$max_iterations"); do
              if adb logcat -d -s RZShizukuAppOps:I '*:S' \
                | grep -Fq "$marker"; then
                echo "$marker"
                return 0
              fi
              sleep 0.5
            done
            cat /tmp/rz-shizuku-appops-instrumentation.txt || true
            echo "Missing real Shizuku marker: $marker" >&2
            return 1
          }
          wait_marker RZ_SHIZUKU_APPOPS_PIN_READY 150
          initial="$(adb shell pidof shizuku_server | tr -d '\r')"
          test -n "$initial"
          test "${initial#* }" = "$initial"
          adb shell kill -9 "$initial"
          wait_marker RZ_SHIZUKU_APPOPS_PIN_INVALIDATED 80
          SHIZUKU_LIB="$(cat /tmp/rz-shizuku-lib-path)"
          adb shell "$SHIZUKU_LIB" > /tmp/rz-shizuku-restart.txt
          replacement=''
          for attempt in $(seq 1 100); do
            replacement="$(adb shell pidof shizuku_server 2>/dev/null | tr -d '\r' || true)"
            if [ -n "$replacement" ] && [ "$replacement" != "$initial" ]; then
              break
            fi
            sleep 0.25
          done
          test -n "$replacement"
          test "$replacement" != "$initial"
          echo "RZ_SHIZUKU_ACTUAL_SERVER_PID_CHANGED"
          wait_marker RZ_SHIZUKU_APPOPS_NEW_PIN_READONLY_ONLY 150
          wait "$probe_pid"
          trap - EXIT
          cat /tmp/rz-shizuku-appops-instrumentation.txt
          grep -Fq 'OK (1 test)' /tmp/rz-shizuku-appops-instrumentation.txt
          ! grep -Fq 'INSTRUMENTATION_STATUS_CODE: -4' /tmp/rz-shizuku-appops-instrumentation.txt
          ! grep -Fq 'FAILURES!!!' /tmp/rz-shizuku-appops-instrumentation.txt
          adb logcat -d -s RZShizukuAppOps:I '*:S' > /tmp/rz-shizuku-appops-markers.txt
          for marker in PIN_READY PIN_INVALIDATED NEW_PIN_READONLY_ONLY; do
            grep -Fq "RZ_SHIZUKU_APPOPS_$marker" /tmp/rz-shizuku-appops-markers.txt
          done
          echo 'API37_REAL_SHIZUKU_PINNED_READONLY_APPOPS_LOSS_REBIND_PASS'

      - name: Collect bounded disposable-emulator evidence
        if: always()
        shell: bash
        run: |
          mkdir -p shizuku-appops-evidence
          for f in /tmp/rz-shizuku-appops-instrumentation.txt \
            /tmp/rz-shizuku-appops-markers.txt \
            /tmp/rz-shizuku-start.txt /tmp/rz-shizuku-restart.txt \
            /tmp/rz-shizuku-emulator.log; do
            [ ! -f "$f" ] || cp "$f" shizuku-appops-evidence/
          done
          adb shell getprop ro.build.version.sdk > shizuku-appops-evidence/api.txt 2>/dev/null || true

      - name: Upload limited evidence artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: api37-real-shizuku-appops-evidence
          path: shizuku-appops-evidence/
          retention-days: 7

      - name: Stop disposable emulator
        if: always()
        shell: bash
        run: adb emu kill || true
