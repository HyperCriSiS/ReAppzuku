name: One-time strict lint baseline cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Remove exactly the stale baseline issue
        run: |
          set -euo pipefail
          chmod +x gradlew
          cp app/lint-baseline.xml /tmp/lint-baseline-before.xml
          ./gradlew updateLintBaseline
          cp app/lint-baseline.xml /tmp/lint-baseline-generated.xml
          cp /tmp/lint-baseline-before.xml app/lint-baseline.xml

          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          before_path = Path('/tmp/lint-baseline-before.xml')
          generated_path = Path('/tmp/lint-baseline-generated.xml')
          final_path = Path('app/lint-baseline.xml')

          def key(issue):
              return (
                  issue.attrib.get('id', ''),
                  issue.attrib.get('message', ''),
                  tuple(loc.attrib.get('file', '') for loc in issue.findall('location')),
              )

          before_root = ET.parse(before_path).getroot()
          generated_root = ET.parse(generated_path).getroot()
          before = {key(issue) for issue in before_root.findall('issue')}
          generated = {key(issue) for issue in generated_root.findall('issue')}
          removed = before - generated
          if len(removed) != 1:
              raise SystemExit(f'expected exactly one stale semantic baseline issue, found {len(removed)}: {removed}')
          stale = next(iter(removed))
          print('stale-baseline-entry=', stale)

          original = before_path.read_text(encoding='utf-8')
          pattern = re.compile(r'<issue\b.*?</issue>|<issue\b[^>]*/>', re.DOTALL)
          matches = []
          for match in pattern.finditer(original):
              try:
                  issue = ET.fromstring(match.group(0))
              except ET.ParseError:
                  continue
              if key(issue) == stale:
                  matches.append(match)
          if len(matches) != 1:
              raise SystemExit(f'could not uniquely locate stale raw XML issue: {len(matches)} matches')
          match = matches[0]
          line_start = original.rfind('\n', 0, match.start()) + 1
          final = original[:line_start] + original[match.end():]
          final_path.write_text(final, encoding='utf-8')

          final_root = ET.parse(final_path).getroot()
          final_keys = {key(issue) for issue in final_root.findall('issue')}
          if final_keys != before - {stale}:
              raise SystemExit('final lint baseline is not exactly original minus stale issue')
          print(f'baseline-semantic-count: {len(before)} -> {len(final_keys)}')
          PY

      - name: Validate cleaned baseline
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug | tee /tmp/lint-clean-validation.log
          if grep -q 'listed in the baseline file.*not found in the project' /tmp/lint-clean-validation.log; then
            echo 'stale lint baseline entries remain' >&2
            exit 1
          fi
          git diff --check
          changed="$(git status --porcelain | awk '{print $2}')"
          test "$changed" = 'app/lint-baseline.xml'

      - name: Commit cleaned baseline only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/lint-baseline.xml
          test "$(git diff --cached --name-only)" = 'app/lint-baseline.xml'
          git commit -m 'Remove stale lint baseline entry'
          git push origin HEAD:ondemand-shizuku
