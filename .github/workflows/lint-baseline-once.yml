name: One-time lint baseline cleanup gate

on:
  push:
    branches: [ondemand-shizuku]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: contains(github.event.head_commit.message, '[lint-baseline-gate]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: true
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Regenerate baseline under strict subset guard
        run: |
          set -euo pipefail
          chmod +x gradlew
          cp app/lint-baseline.xml /tmp/lint-baseline-before.xml
          ./gradlew updateLintBaseline
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          def semantic_keys(path):
              root = ET.parse(path).getroot()
              result = set()
              for issue in root.findall('issue'):
                  locations = tuple(sorted(
                      loc.attrib.get('file', '') for loc in issue.findall('location')
                  ))
                  result.add((issue.attrib.get('id', ''), issue.attrib.get('message', ''), locations))
              return result

          before = semantic_keys('/tmp/lint-baseline-before.xml')
          after = semantic_keys('app/lint-baseline.xml')
          added = after - before
          removed = before - after
          print(f'before={len(before)} after={len(after)} added={len(added)} removed={len(removed)}')
          if added:
              print('NEW_SUPPRESSIONS:')
              for item in sorted(added):
                  print(item)
              raise SystemExit('refusing baseline update with new suppressions')
          if len(removed) != 1:
              print('REMOVED_ENTRIES:')
              for item in sorted(removed):
                  print(item)
              raise SystemExit('expected exactly one stale baseline entry')
          print('STALE_ENTRY_REMOVED:', next(iter(removed)))
          PY
          git diff --check -- app/lint-baseline.xml
      - name: Validate refreshed baseline and app
        run: ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug
      - name: Commit reviewed baseline shrink
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lint-baseline.xml
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'Remove stale lint baseline entry'
          git push origin HEAD:ondemand-shizuku
