name: Signed ReAppzuku release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Trusted Git ref to build (main or ondemand-shizuku)
        required: true
        default: main
        type: string
      tag:
        description: Release tag (required only when publishing)
        required: false
        type: string
      publish:
        description: Publish a GitHub release after signing verification
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type RELEASE to authorize publication
        required: false
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  build-sign-verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate release authorization and source ref
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$SOURCE_REF" in
            main|ondemand-shizuku) ;;
            *) echo 'source_ref must be main or ondemand-shizuku.' >&2; exit 1 ;;
          esac
          if [ "$PUBLISH" = "true" ]; then
            test -n "$RELEASE_TAG" || { echo 'A release tag is required when publish=true.' >&2; exit 1; }
            test "$CONFIRMATION" = "RELEASE" || { echo 'Publication requires confirmation=RELEASE.' >&2; exit 1; }
          fi

      - name: Checkout selected ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record exact source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building exact source commit: $sha"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Require stable signing secrets
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_KEY_ALIAS SIGNING_KEYSTORE_PASSWORD SIGNING_KEY_PASSWORD EXPECTED_CERT_SHA256; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Missing required signing secret: $name" >&2
              exit 1
            fi
          done
          normalized="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$normalized" =~ ^[0-9a-f]{64}$ ]] || { echo 'ANDROID_SIGNING_CERT_SHA256 must be a SHA-256 certificate digest.' >&2; exit 1; }

      - name: Decode release keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          test -s app/release.keystore

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1 || { printf 'Expected exactly one release APK, found %s\n' "${#apks[@]}" >&2; printf '%s\n' "${apks[@]}" >&2; exit 1; }
          printf '%s\n' "${apks[0]}" > /tmp/release-apk-path

      - name: Verify package and signing certificate identity
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          input_apk="$(cat /tmp/release-apk-path)"
          badging="$($AAPT dump badging "$input_apk" | head -1)"
          printf '%s\n' "$badging"
          grep -Fq "package: name='com.gree1d.reappzuku'" <<<"$badging" || { echo 'Refusing release APK with unexpected application id.' >&2; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$input_apk" | tee /tmp/signed-certs.txt
          actual="$(sed -n -E 's/^.*certificate SHA-256 digest: *//p' /tmp/signed-certs.txt | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "Signing certificate mismatch: expected=$expected actual=$actual" >&2
            exit 1
          fi
          safe_tag="$(printf '%s' "$RELEASE_TAG" | tr -cs 'A-Za-z0-9._-' '-')"
          [ -n "$safe_tag" ] || safe_tag='signed-build'
          mkdir -p release-dist
          name="ReAppzuku-${safe_tag}.apk"
          cp "$input_apk" "release-dist/$name"
          (
            cd release-dist
            sha256sum "$name" > "$name.sha256"
            printf '%s\n' "$SOURCE_SHA" > source-sha.txt
            printf '%s\n' "$actual" > signing-cert-sha256.txt
          )
          echo "Verified signing certificate SHA-256: $actual"

      - name: Stage verified release payload for publish job
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-release-${{ github.run_id }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 1

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f app/release.keystore

  publish:
    if: ${{ inputs.publish }}
    needs: build-sign-verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: signed-release-${{ github.run_id }}
          path: release-dist

      - name: Re-verify payload and publish exact built commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PRERELEASE: ${{ inputs.prerelease }}
          SOURCE_SHA: ${{ needs.build-sign-verify.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RELEASE"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(cat release-dist/source-sha.txt)" = "$SOURCE_SHA"
          mapfile -t apks < <(find release-dist -maxdepth 1 -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1 || { echo "Expected exactly one staged APK, found ${#apks[@]}." >&2; exit 1; }
          apk="${apks[0]}"
          checksum="$apk.sha256"
          test -f "$checksum"
          (
            cd release-dist
            sha256sum -c "$(basename "$checksum")"
          )
          args=(release create "$RELEASE_TAG" "$apk" "$checksum" --target "$SOURCE_SHA" --generate-notes --title "ReAppzuku $RELEASE_TAG")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
