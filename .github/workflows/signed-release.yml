name: Signed ReAppzuku release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Trusted Git ref to build (main or ondemand-shizuku)
        required: true
        default: main
        type: string
      tag:
        description: Release tag (required only when publishing)
        required: false
        type: string
      publish:
        description: Publish a GitHub release after signing verification
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type RELEASE to authorize publication
        required: false
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate release authorization and source ref
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.source_ref }}" in
            main|ondemand-shizuku) ;;
            *) echo 'source_ref must be main or ondemand-shizuku.' >&2; exit 1 ;;
          esac
          if [ "${{ inputs.publish }}" = "true" ]; then
            tag='${{ inputs.tag }}'
            test -n "$tag" || { echo 'A release tag is required when publish=true.' >&2; exit 1; }
            [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || {
              echo 'Release tag must be 1-64 characters and use only letters, digits, dot, underscore, or hyphen.' >&2
              exit 1
            }
            test "${{ inputs.confirmation }}" = "RELEASE" || { echo 'Publication requires confirmation=RELEASE.' >&2; exit 1; }
          fi

      - name: Checkout selected ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Require stable signing secrets
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_KEY_ALIAS SIGNING_KEYSTORE_PASSWORD SIGNING_KEY_PASSWORD EXPECTED_CERT_SHA256; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Missing required signing secret: $name" >&2
              exit 1
            fi
          done
          normalized="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$normalized" =~ ^[0-9a-f]{64}$ ]] || { echo 'ANDROID_SIGNING_CERT_SHA256 must be a SHA-256 certificate digest.' >&2; exit 1; }

      - name: Decode release keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          test -s app/release.keystore

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1 || { printf 'Expected exactly one release APK, found %s\n' "${#apks[@]}" >&2; printf '%s\n' "${apks[@]}" >&2; exit 1; }
          printf '%s\n' "${apks[0]}" > /tmp/release-apk-path

      - name: Verify package and signing certificate identity
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          input_apk="$(cat /tmp/release-apk-path)"
          badging="$($AAPT dump badging "$input_apk" | head -1)"
          printf '%s\n' "$badging"
          grep -Fq "package: name='com.gree1d.reappzuku'" <<<"$badging" || { echo 'Refusing release APK with unexpected application id.' >&2; exit 1; }

          version_name="$(sed -n -E "s/.*versionName='([^']+)'.*/\1/p" <<<"$badging")"
          version_code="$(sed -n -E "s/.*versionCode='([^']+)'.*/\1/p" <<<"$badging")"
          test -n "$version_name" || { echo 'Could not resolve APK versionName.' >&2; exit 1; }
          [[ "$version_code" =~ ^[0-9]+$ ]] || { echo 'APK versionCode must be numeric.' >&2; exit 1; }

          if [ "${{ inputs.publish }}" = "true" ] && [ "${{ inputs.prerelease }}" != "true" ]; then
            normalized_tag='${{ inputs.tag }}'
            normalized_tag="${normalized_tag#v}"
            normalized_tag="${normalized_tag#V}"
            [[ "$normalized_tag" =~ ^[0-9]+(\.[0-9]+)*$ ]] || {
              echo 'Stable release tags must be numeric versions (optional leading v), e.g. 1.8.8 or v1.8.8.' >&2
              exit 1
            }
            [[ "$version_name" =~ ^[0-9]+(\.[0-9]+)*$ ]] || {
              echo "Stable APK versionName must be numeric, got: $version_name" >&2
              exit 1
            }
            if [ "$normalized_tag" != "$version_name" ]; then
              echo "Stable release tag/APK version mismatch: tag=${{ inputs.tag }} APK versionName=$version_name" >&2
              exit 1
            fi
          fi

          "$APKSIGNER" verify --verbose --print-certs "$input_apk" | tee /tmp/signed-certs.txt
          actual="$(sed -n -E 's/^.*certificate SHA-256 digest: *//p' /tmp/signed-certs.txt | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "Signing certificate mismatch: expected=$expected actual=$actual" >&2
            exit 1
          fi
          safe_tag="$(printf '%s' "${{ inputs.tag }}" | tr -cs 'A-Za-z0-9._-' '-')"
          [ -n "$safe_tag" ] || safe_tag='signed-build'
          signed="$GITHUB_WORKSPACE/ReAppzuku-${safe_tag}.apk"
          cp "$input_apk" "$signed"
          sha256sum "$signed" | tee "$signed.sha256"
          metadata="$signed.provenance.txt"
          {
            printf 'packageName=%s\n' 'com.gree1d.reappzuku'
            printf 'versionName=%s\n' "$version_name"
            printf 'versionCode=%s\n' "$version_code"
            printf 'sourceRef=%s\n' '${{ inputs.source_ref }}'
            printf 'sourceCommit=%s\n' "$(git rev-parse HEAD)"
            printf 'certificateSha256=%s\n' "$actual"
            printf 'apkSha256=%s\n' "$(sha256sum "$signed" | awk '{print $1}')"
          } > "$metadata"
          cat "$metadata"
          printf '%s\n' "$signed" > /tmp/signed-apk-path
          printf '%s\n' "$metadata" > /tmp/signed-provenance-path
          echo "Verified signing certificate SHA-256: $actual"

      - name: Publish explicitly authorized GitHub release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RELEASE"
          signed="$(cat /tmp/signed-apk-path)"
          provenance="$(cat /tmp/signed-provenance-path)"
          test -s "$signed"
          test -s "$signed.sha256"
          test -s "$provenance"
          grep -Fxq "sourceCommit=$(git rev-parse HEAD)" "$provenance"
          if [ "${{ inputs.prerelease }}" != "true" ]; then
            normalized_tag='${{ inputs.tag }}'
            normalized_tag="${normalized_tag#v}"
            normalized_tag="${normalized_tag#V}"
            version_name="$(sed -n 's/^versionName=//p' "$provenance")"
            test "$normalized_tag" = "$version_name" || {
              echo "Stable release metadata changed before publication: tag=${{ inputs.tag }} APK versionName=$version_name" >&2
              exit 1
            }
          fi
          args=(release create "${{ inputs.tag }}" "$signed" "$signed.sha256" "$provenance" --target "${{ inputs.source_ref }}" --generate-notes --title "ReAppzuku ${{ inputs.tag }}")
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f app/release.keystore
