name: Consolidate mainline history

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Product branch to consolidate
        required: true
        default: consolidate/mainline
        type: string
      expected_source_sha:
        description: Exact product commit expected before the merge
        required: true
        type: string

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_REF" = 'consolidate/mainline'
          test "$EXPECTED_SOURCE_SHA" = '2547950175c64f38096f3cd8b653cb063f55a0a1'

      - name: Check out product line with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Absorb main history without changing the product tree
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git fetch origin main
          before_tree="$(git rev-parse HEAD^{tree})"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff -s ours origin/main -m 'Consolidate historical main mirror into product line'
          after_tree="$(git rev-parse HEAD^{tree})"
          test "$before_tree" = "$after_tree"
          git push origin HEAD:consolidate/mainline
