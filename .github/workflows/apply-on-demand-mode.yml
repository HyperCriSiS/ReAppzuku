name: Apply On-demand mode product patch

on:
  push:
    branches: [roadmap/on-demand-mode]
    paths:
      - '.github/workflows/apply-on-demand-mode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: roadmap/on-demand-mode

      - name: Apply derived On-demand mode UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          changed = False
          settings_path = Path('app/src/main/java/com/gree1d/reappzuku/ui/SettingsActivity.java')
          text = settings_path.read_text()

          if 'updatingOnDemandModeSwitch' not in text:
              anchor = '    @Override\n    protected void onCreate('
              if anchor not in text:
                  raise RuntimeError('SettingsActivity onCreate anchor not found')
              text = text.replace(anchor, '    private boolean updatingOnDemandModeSwitch;\n\n' + anchor, 1)
              changed = True

          if 'R.id.switch_on_demand_mode' not in text:
              anchor = '            R.id.switch_prevent_shizuku_autostart'
              if anchor not in text:
                  raise RuntimeError('switch tint anchor not found')
              text = text.replace(anchor, '            R.id.switch_on_demand_mode,\n' + anchor, 1)
              changed = True

          if 'binding.switchOnDemandMode.setOnCheckedChangeListener' not in text:
              anchor = '        binding.switchPreventShizukuAutostart.setOnCheckedChangeListener'
              if anchor not in text:
                  raise RuntimeError('App Behavior listener anchor not found')
              master = textwrap.dedent('''\
                      binding.switchOnDemandMode.setOnCheckedChangeListener((buttonView, isChecked) -> {
                          if (updatingOnDemandModeSwitch) return;
                          if (isChecked && !BackgroundWorkPolicy.isOnDemandBehaviorAllowed(this)) {
                              updatingOnDemandModeSwitch = true;
                              buttonView.setChecked(false);
                              updatingOnDemandModeSwitch = false;
                              Toast.makeText(this, R.string.settings_app_behavior_blocked, Toast.LENGTH_LONG).show();
                              return;
                          }

                          sharedPreferences.edit()
                                  .putBoolean(KEY_PREVENT_SHIZUKU_AUTOSTART, isChecked)
                                  .putBoolean(KEY_EXIT_ON_BACK, isChecked)
                                  .apply();
                          BackgroundWorkPolicy.syncShizukuWakeComponent(this);
                          updateAppBehaviorAvailability();
                      });
                      binding.layoutOnDemandMode.setOnClickListener(v -> {
                          if (binding.switchOnDemandMode.isEnabled()) {
                              binding.switchOnDemandMode.toggle();
                          }
                      });

              ''')
              text = text.replace(anchor, master + anchor, 1)
              changed = True

          exit_line = '        boolean exitOnBack = sharedPreferences.getBoolean(KEY_EXIT_ON_BACK, false);\n'
          if 'boolean onDemandMode = preventAutoStart && exitOnBack;' not in text:
              if exit_line not in text:
                  raise RuntimeError('exitOnBack state line not found')
              text = text.replace(
                  exit_line,
                  exit_line + '        boolean onDemandMode = preventAutoStart && exitOnBack;\n',
                  1,
              )
              changed = True

          if 'binding.switchOnDemandMode.setChecked(onDemandMode);' not in text:
              anchor = '        binding.switchPreventShizukuAutostart.setChecked(preventAutoStart);\n'
              if anchor not in text:
                  raise RuntimeError('prevent-autostart render line not found')
              text = text.replace(
                  anchor,
                  '        updatingOnDemandModeSwitch = true;\n'
                  '        binding.switchOnDemandMode.setChecked(onDemandMode);\n'
                  '        updatingOnDemandModeSwitch = false;\n' + anchor,
                  1,
              )
              changed = True

          insertions = [
              ('binding.switchOnDemandMode.setEnabled(enabled);',
               '        binding.switchPreventShizukuAutostart.setEnabled(enabled);\n',
               '        binding.switchOnDemandMode.setEnabled(enabled);\n'),
              ('binding.layoutOnDemandMode.setEnabled(enabled);',
               '        binding.layoutPreventShizukuAutostart.setEnabled(enabled);\n',
               '        binding.layoutOnDemandMode.setEnabled(enabled);\n'),
              ('binding.layoutOnDemandMode.setAlpha(alpha);',
               '        binding.layoutPreventShizukuAutostart.setAlpha(alpha);\n',
               '        binding.layoutOnDemandMode.setAlpha(alpha);\n'),
          ]
          for sentinel, anchor, addition in insertions:
              if sentinel in text:
                  continue
              if anchor not in text:
                  raise RuntimeError(f'App Behavior anchor not found: {anchor.strip()}')
              text = text.replace(anchor, addition + anchor, 1)
              changed = True

          settings_path.write_text(text)

          layout_path = Path('app/src/main/res/layout/activity_settings.xml')
          layout = layout_path.read_text()
          if 'android:id="@+id/switch_on_demand_mode"' not in layout:
              id_marker = 'android:id="@+id/layout_prevent_shizuku_autostart"'
              marker_pos = layout.find(id_marker)
              if marker_pos < 0:
                  raise RuntimeError('App Behavior layout id anchor not found')
              row_start = layout.rfind('                    <LinearLayout', 0, marker_pos)
              if row_start < 0:
                  raise RuntimeError('App Behavior row start not found')
              row = textwrap.dedent('''\
                                      <LinearLayout
                                          android:id="@+id/layout_on_demand_mode"
                                          android:layout_width="match_parent"
                                          android:layout_height="wrap_content"
                                          android:orientation="horizontal"
                                          android:gravity="center_vertical"
                                          android:paddingHorizontal="8dp"
                                          android:paddingVertical="12dp"
                                          android:background="?attr/selectableItemBackground">

                                          <LinearLayout
                                              android:layout_width="0dp"
                                              android:layout_height="wrap_content"
                                              android:layout_weight="1"
                                              android:orientation="vertical">

                                              <TextView
                                                  android:layout_width="wrap_content"
                                                  android:layout_height="wrap_content"
                                                  android:text="@string/settings_on_demand_mode_title"
                                                  android:textColor="@color/text_primary"
                                                  android:textSize="16sp"
                                                  android:textStyle="bold" />

                                              <TextView
                                                  android:layout_width="wrap_content"
                                                  android:layout_height="wrap_content"
                                                  android:layout_marginTop="2dp"
                                                  android:text="@string/settings_on_demand_mode_subtitle"
                                                  android:textColor="@color/text_secondary"
                                                  android:textSize="12sp" />
                                          </LinearLayout>

                                          <com.google.android.material.materialswitch.MaterialSwitch
                                              android:id="@+id/switch_on_demand_mode"
                                              android:layout_width="wrap_content"
                                              android:layout_height="wrap_content"
                                              android:clickable="true"
                                              android:focusable="true" />
                                      </LinearLayout>

              ''')
              # Restore the card's existing indentation after dedent.
              row = ''.join(('                    ' + line if line.strip() else line)
                            for line in row.splitlines(True))
              layout = layout[:row_start] + row + layout[row_start:]
              layout_path.write_text(layout)
              changed = True

          translations = {
              'app/src/main/res/values/strings_assurance.xml': (
                  'On-demand mode',
                  'Keep ReAppzuku dormant until you open it, and fully exit the main process with Back.'),
              'app/src/main/res/values-es/strings_assurance.xml': (
                  'Modo bajo demanda',
                  'Mantén ReAppzuku inactivo hasta que lo abras y cierra por completo el proceso principal al pulsar Atrás.'),
              'app/src/main/res/values-ru/strings_assurance.xml': (
                  'Режим по запросу',
                  'Не запускает ReAppzuku без необходимости и полностью завершает основной процесс по кнопке «Назад».'),
              'app/src/main/res/values-uk/strings_assurance.xml': (
                  'Режим на вимогу',
                  'Не запускає ReAppzuku без потреби та повністю завершує основний процес кнопкою «Назад».'),
              'app/src/main/res/values-zh-rCN/strings_assurance.xml': (
                  '按需模式',
                  '仅在你主动打开时运行 ReAppzuku，并在按“返回”时完全结束主进程。'),
          }
          for resource, (title, subtitle) in translations.items():
              p = Path(resource)
              value = p.read_text()
              if 'name="settings_on_demand_mode_title"' in value:
                  continue
              block = (
                  f'    <string name="settings_on_demand_mode_title">{title}</string>\n'
                  f'    <string name="settings_on_demand_mode_subtitle">{subtitle}</string>\n'
              )
              if '</resources>' not in value:
                  raise RuntimeError(f'resources close tag not found in {resource}')
              p.write_text(value.replace('</resources>', block + '</resources>', 1))
              changed = True

          test_path = Path('app/src/test/java/com/gree1d/reappzuku/core/OnDemandModePolicyTest.java')
          test_text = textwrap.dedent(r'''\
              package com.gree1d.reappzuku.core;

              import static org.junit.Assert.assertFalse;
              import static org.junit.Assert.assertTrue;

              import java.io.IOException;
              import java.nio.file.Files;
              import java.nio.file.Path;
              import java.nio.file.Paths;
              import java.util.Arrays;
              import java.util.List;

              import org.junit.Test;

              public class OnDemandModePolicyTest {
                  @Test
                  public void masterModeIsDerivedFromExistingAppBehaviorPreferences() throws Exception {
                      String source = readRepositoryFile(
                              "app/src/main/java/com/gree1d/reappzuku/ui/SettingsActivity.java");

                      assertTrue(source.contains("boolean onDemandMode = preventAutoStart && exitOnBack;"));
                      assertTrue(source.contains(".putBoolean(KEY_PREVENT_SHIZUKU_AUTOSTART, isChecked)"));
                      assertTrue(source.contains(".putBoolean(KEY_EXIT_ON_BACK, isChecked)"));
                      assertTrue(source.contains("updatingOnDemandModeSwitch"));
                      assertFalse(source.contains("KEY_ON_DEMAND_MODE"));
                  }

                  @Test
                  public void appBehaviorScreenExposesMasterAndExistingFineControls() throws Exception {
                      String layout = readRepositoryFile("app/src/main/res/layout/activity_settings.xml");

                      assertTrue(layout.contains("@+id/layout_on_demand_mode"));
                      assertTrue(layout.contains("@+id/switch_on_demand_mode"));
                      assertTrue(layout.contains("@+id/layout_prevent_shizuku_autostart"));
                      assertTrue(layout.contains("@+id/layout_exit_on_back"));
                  }

                  private static String readRepositoryFile(String relative) throws IOException {
                      List<Path> candidates = Arrays.asList(
                              Paths.get(relative),
                              Paths.get("..", relative),
                              Paths.get("..", "..", relative));
                      for (Path candidate : candidates) {
                          if (Files.isRegularFile(candidate)) {
                              return Files.readString(candidate);
                          }
                      }
                      throw new IOException("Could not locate repository file: " + relative
                              + " from " + Paths.get("").toAbsolutePath());
                  }
              }
          ''')
          if not test_path.exists() or test_path.read_text() != test_text:
              test_path.write_text(test_text)
              changed = True

          print('On-demand mode patch applied' if changed else 'On-demand mode patch already present')
          PY

      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/gree1d/reappzuku/ui/SettingsActivity.java \
            app/src/main/res/layout/activity_settings.xml \
            app/src/main/res/values/strings_assurance.xml \
            app/src/main/res/values-es/strings_assurance.xml \
            app/src/main/res/values-ru/strings_assurance.xml \
            app/src/main/res/values-uk/strings_assurance.xml \
            app/src/main/res/values-zh-rCN/strings_assurance.xml \
            app/src/test/java/com/gree1d/reappzuku/core/OnDemandModePolicyTest.java
          git diff --cached --check
          git commit -m "Add unified On-demand mode control"
          git push origin HEAD:roadmap/on-demand-mode
