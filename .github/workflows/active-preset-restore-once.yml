name: One-time active preset restore gate

on:
  push:
    branches: [ondemand-shizuku]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: contains(github.event.head_commit.message, '[active-preset-restore-gate]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: true
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Add active-preset restore instrumentation coverage
        run: python3 .github/scripts/add_active_preset_restore_test.py
      - name: Validate test compilation and app
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug
      - name: Commit validated active-preset coverage
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/androidTest/java/com/gree1d/reappzuku/core/BackupManagerRestoreTest.java
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --check
          git commit -m 'Cover active preset reconciliation during restore'
          git push origin HEAD:ondemand-shizuku
