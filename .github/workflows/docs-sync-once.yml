name: One-time roadmap evidence sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ondemand-shizuku
          fetch-depth: 0
      - name: Apply reviewed roadmap and matrix patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/docs.patch
          git apply --check /tmp/docs.patch
          git apply /tmp/docs.patch
          test -z "$(git status --porcelain | grep -vE '^( M|M ) docs/(ROADMAP|CHECK_MATRIX)\.md$' || true)"
          ! grep -R '__A04_' docs/ROADMAP.md docs/CHECK_MATRIX.md
          git diff --check
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add docs/ROADMAP.md docs/CHECK_MATRIX.md
          git commit -m 'Refresh roadmap and assurance evidence'
          git push origin HEAD:ondemand-shizuku
