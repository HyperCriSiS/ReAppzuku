name: Active lint warning audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Run lint and print active findings
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew lintDebug
          report='app/build/reports/lint-results-debug.xml'
          test -f "$report"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('app/build/reports/lint-results-debug.xml')
          root = ET.parse(report).getroot()
          issues = list(root.findall('issue'))
          print(f'ACTIVE_LINT_COUNT={len(issues)}')
          for issue in issues:
              loc = issue.find('location')
              file = loc.get('file', '?') if loc is not None else '?'
              line = loc.get('line', '?') if loc is not None else '?'
              print(f"LINT {issue.get('severity')} {issue.get('id')} {file}:{line} :: {issue.get('message')}")
          PY
