name: One-time locale-stable machine parser patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout topic branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: roadmap/locale-stable-machine-parsers
          fetch-depth: 0

      - name: Make machine-token normalization locale-stable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "93d0bc51e9c383b656b12e6b4be94b311b6858ac"
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              'app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/ComponentsAnalyzer.java': [
                  ('pkgOut.toLowerCase().contains("syncadapter")', 'pkgOut.toLowerCase(Locale.ROOT).contains("syncadapter")', 1),
                  ('String t = line.toLowerCase();', 'String t = line.toLowerCase(Locale.ROOT);', 1),
              ],
              'app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/DozeOpsAnalyzer.java': [
                  ('battery.toLowerCase().contains("exempt")', 'battery.toLowerCase(Locale.ROOT).contains("exempt")', 1),
                  ('mOp.group(1).toUpperCase()', 'mOp.group(1).toUpperCase(Locale.ROOT)', 1),
                  ('mOp.group(2).toLowerCase()', 'mOp.group(2).toLowerCase(Locale.ROOT)', 1),
              ],
              'app/src/main/java/com/gree1d/reappzuku/ui/LogDetailActivity.java': [
                  ('action.trim().toLowerCase()', 'action.trim().toLowerCase(Locale.ROOT)', 3),
                  ('trimmed.toLowerCase()', 'trimmed.toLowerCase(Locale.ROOT)', 1),
              ],
              'app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/MediaAnalyzer.java': [
                  ('raw.toUpperCase()', 'raw.toUpperCase(Locale.ROOT)', 1),
                  ('scanMode.toUpperCase().contains("LOW_LATENCY")', 'scanMode.toUpperCase(Locale.ROOT).contains("LOW_LATENCY")', 1),
              ],
              'app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/NetworkAnalyzer.java': [
                  ('line.toLowerCase().contains("established")', 'line.toLowerCase(Locale.ROOT).contains("established")', 1),
                  ('line.toLowerCase().contains("connected")', 'line.toLowerCase(Locale.ROOT).contains("connected")', 1),
              ],
              'app/src/main/java/com/gree1d/reappzuku/manager/ScanSystem.java': [
                  ('raw.toLowerCase()', 'raw.toLowerCase(Locale.ROOT)', 1),
                  ('raw.toUpperCase()', 'raw.toUpperCase(Locale.ROOT)', 1),
              ],
              'app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/SchedulingAnalyzer.java': [
                  ('mRec.group(2).toLowerCase()', 'mRec.group(2).toLowerCase(Locale.ROOT)', 1),
                  ('type.substring(0, Math.min(2, type.length())).toUpperCase()', 'type.substring(0, Math.min(2, type.length())).toUpperCase(Locale.ROOT)', 1),
              ],
              'app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/SensorsLocationAnalyzer.java': [
                  ('raw.toLowerCase()', 'raw.toLowerCase(Locale.ROOT)', 1),
                  ('mProv.group(1).toLowerCase()', 'mProv.group(1).toLowerCase(Locale.ROOT)', 1),
                  ('raw.toUpperCase()', 'raw.toUpperCase(Locale.ROOT)', 1),
              ],
          }

          def ensure_locale_import(text, path):
              if 'import java.util.Locale;' in text:
                  return text
              lines = text.splitlines()
              static_idx = next((i for i, line in enumerate(lines) if line.startswith('import static ')), None)
              if static_idx is not None:
                  lines.insert(static_idx, 'import java.util.Locale;')
              else:
                  imports = [i for i, line in enumerate(lines) if line.startswith('import ')]
                  if not imports:
                      raise SystemExit(f'{path}: no import block found')
                  lines.insert(imports[-1] + 1, 'import java.util.Locale;')
              return '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          total = 0
          for path, rules in replacements.items():
              p = Path(path)
              text = p.read_text()
              for old, new, expected in rules:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
                  text = text.replace(old, new)
                  total += expected
              text = ensure_locale_import(text, path)
              p.write_text(text)
          if total != 20:
              raise SystemExit(f'expected 20 parser replacements, got {total}')

          baseline = Path('app/lint-baseline.xml')
          text = baseline.read_text()
          target_paths = {
              path.removeprefix('app/') for path in replacements
          }
          pattern = re.compile(r'\n\s*<issue\n.*?\n\s*</issue>', re.S)
          removed = []
          def filter_issue(match):
              block = match.group(0)
              if 'id="DefaultLocale"' not in block:
                  return block
              if any(f'file="{path}"' in block for path in target_paths):
                  removed.append(block)
                  return ''
              return block
          updated = pattern.sub(filter_issue, text)
          if len(removed) != 20:
              raise SystemExit(f'expected 20 DefaultLocale baseline entries, removed {len(removed)}')
          baseline.write_text(updated)
          PY

          git diff --check
          test "$(git status --porcelain | wc -l)" -eq 9
          for path in \
            src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/ComponentsAnalyzer.java \
            src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/DozeOpsAnalyzer.java \
            src/main/java/com/gree1d/reappzuku/ui/LogDetailActivity.java \
            src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/MediaAnalyzer.java \
            src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/NetworkAnalyzer.java \
            src/main/java/com/gree1d/reappzuku/manager/ScanSystem.java \
            src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/SchedulingAnalyzer.java \
            src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/SensorsLocationAnalyzer.java; do
            ! grep -Fq "file=\"$path\"" app/lint-baseline.xml || {
              if grep -B3 -A8 'id="DefaultLocale"' app/lint-baseline.xml | grep -Fq "file=\"$path\""; then
                echo "DefaultLocale baseline entry remains for $path" >&2
                exit 1
              fi
            }
          done
          git config user.name HyperCriSiS
          git config user.email dev.github@w3b.world
          git add app/lint-baseline.xml \
            app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/ComponentsAnalyzer.java \
            app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/DozeOpsAnalyzer.java \
            app/src/main/java/com/gree1d/reappzuku/ui/LogDetailActivity.java \
            app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/MediaAnalyzer.java \
            app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/NetworkAnalyzer.java \
            app/src/main/java/com/gree1d/reappzuku/manager/ScanSystem.java \
            app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/SchedulingAnalyzer.java \
            app/src/main/java/com/gree1d/reappzuku/utils/triggers/analyzers/SensorsLocationAnalyzer.java
          git commit -m 'Make machine parser normalization locale-stable'
          git push origin HEAD:roadmap/locale-stable-machine-parsers
