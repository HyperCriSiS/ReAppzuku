name: One-time BackupCodec gate

on:
  push:
    branches: [ondemand-shizuku]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: contains(github.event.head_commit.message, '[backupcodec-gate]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ondemand-shizuku
          persist-credentials: true
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Apply BackupCodec boundary
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 .github/scripts/apply_backup_codec.py
          git diff --check
      - name: Validate BackupCodec and app
        run: ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug
      - name: Commit validated BackupCodec integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/gree1d/reappzuku/core/BackupManager.java \
            docs/ROADMAP.md \
            docs/CHECK_MATRIX.md
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'Extract backup payload codec boundary'
          git push origin HEAD:ondemand-shizuku
