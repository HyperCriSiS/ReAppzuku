name: Refresh WorkManager dependency assurance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Refresh dependency locks and SHA-256 verification metadata
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew             clean             :app:testDebugUnitTest             :app:lintDebug             :app:assembleDebugAndroidTest             :app:assembleDebug             :securityProbe:assembleDebug             --write-locks             --write-verification-metadata sha256             --no-daemon             --no-build-cache             --rerun-tasks
          git diff --check
          git status --short

      - name: Commit reviewed dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/gradle.lockfile gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "No dependency metadata changes generated."
            exit 1
          fi
          git commit -m "Refresh WorkManager dependency assurance metadata"
          git push origin "HEAD:${{ github.ref_name }}"
