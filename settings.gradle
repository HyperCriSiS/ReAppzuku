pluginManagement {
  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
  }
  plugins {
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.21'
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
    maven { url = uri('https://jitpack.io') }
  }
}

rootProject.name = "shappky"
include(":app")
